<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问我任何问题 ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#166534;--green2:#22c55e;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --t1:#111827;--t2:#4b5563;--t3:#9ca3af;
  --b1:#e5e7eb;--font:'Plus Jakarta Sans',sans-serif;
}
body{
  background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 50%,#bbf7d0 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;font-family:var(--font);
}
.card{
  background:white;border-radius:24px;
  box-shadow:0 20px 60px rgba(22,101,52,.15);
  padding:40px 36px;width:100%;max-width:480px;
}
.header{text-align:center;margin-bottom:32px;}
.avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#166534,#22c55e);
  margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  font-size:36px;box-shadow:0 8px 24px rgba(22,101,52,.3);
}
h1{font-size:22px;font-weight:800;color:var(--t1);margin-bottom:6px;}
.sub{font-size:14px;color:var(--t2);line-height:1.6;}
.tag{
  display:inline-block;background:var(--green-bg);color:var(--green);
  border:1px solid var(--green-border);border-radius:999px;
  font-size:12px;font-weight:600;padding:4px 12px;margin-top:10px;
}

.field{margin-bottom:18px;}
.field label{
  display:block;font-size:12px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;
}
.field input,.field textarea,.field select{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--b1);border-radius:12px;
  font-size:15px;font-family:var(--font);color:var(--t1);
  background:#fafafa;transition:all .2s;outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--green);background:white;
  box-shadow:0 0 0 3px rgba(34,197,94,.1);
}
.field textarea{resize:vertical;min-height:100px;line-height:1.6;}
.field select{cursor:pointer;}

.contact-row{display:grid;grid-template-columns:140px 1fr;gap:10px;}

.note{font-size:12px;color:var(--t3);margin-top:6px;}

.btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#166534,#16a34a);
  color:white;border:none;border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;
  font-family:var(--font);transition:all .2s;margin-top:8px;
  box-shadow:0 4px 16px rgba(22,101,52,.3);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(22,101,52,.4);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.success{
  text-align:center;padding:32px 20px;display:none;
}
.success-icon{font-size:56px;margin-bottom:16px;}
.success h2{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:8px;}
.success p{font-size:14px;color:var(--t2);line-height:1.7;}
.success .back{
  display:inline-block;margin-top:20px;
  background:var(--green-bg);color:var(--green);
  border:1px solid var(--green-border);border-radius:12px;
  padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:var(--font);border:none;
}

.err{
  background:#fef2f2;color:#dc2626;border-radius:10px;
  padding:10px 14px;font-size:13px;margin-top:12px;display:none;
}
.char-count{font-size:11px;color:var(--t3);text-align:right;margin-top:4px;}

/* 配置提示 */
.config-banner{
  background:#fef9c3;border:1px solid #fde047;border-radius:10px;
  padding:10px 14px;font-size:12px;color:#713f12;margin-bottom:20px;
  display:none;
}
</style>
</head>
<body>

<div class="card">
  <!-- 配置缺失提示（仅开发时可见） -->
  <div class="config-banner" id="configBanner">
    ⚠️ 请先设置 Google Apps Script URL，详见页面底部注释
  </div>

  <div id="formView">
    <div class="header">
      <div class="avatar">🌿</div>
      <h1>问我任何问题</h1>
      <p class="sub">关于素食、健康、生活方式……<br>什么都可以问！</p>
      <span class="tag">✨ 我会私信回复你</span>
    </div>

    <div class="field">
      <label>你的问题 *</label>
      <textarea id="question" placeholder="想问什么就写什么～" maxlength="500"></textarea>
      <div class="char-count"><span id="qCount">0</span>/500</div>
    </div>

    <div class="field">
      <label>昵称（可选）</label>
      <input type="text" id="nickname" placeholder="叫我叫你什么？">
    </div>

    <div class="field">
      <label>联系方式 * <span style="font-weight:400;text-transform:none;font-size:11px;">（方便我私信回你）</span></label>
      <div class="contact-row">
        <select id="contactType">
          <option value="微信">💬 微信</option>
          <option value="WhatsApp">📱 WhatsApp</option>
          <option value="手机号">📞 手机号</option>
          <option value="小红书">🌸 小红书</option>
          <option value="抖音">🎵 抖音</option>
          <option value="Instagram">📷 Instagram</option>
          <option value="其他">💌 其他</option>
        </select>
        <input type="text" id="contactValue" placeholder="填写账号/号码">
      </div>
      <p class="note">🔒 联系方式仅用于私信回复，不会公开</p>
    </div>

    <button class="btn" id="submitBtn" onclick="submitQuestion()">提交问题 →</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="success" id="successView">
    <div class="success-icon">🎉</div>
    <h2>问题已收到！</h2>
    <p>我会尽快通过 <strong id="replyVia"></strong> 私信回复你～<br>感谢你的提问，期待和你聊聊！🌿</p>
    <button class="back" onclick="resetForm()">再问一个问题</button>
  </div>
</div>

<script>
// ✅ 第一步：把你的 Google Apps Script URL 粘贴在这里
const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL';

const qTextarea = document.getElementById('question');
qTextarea.addEventListener('input', () => {
  document.getElementById('qCount').textContent = qTextarea.value.length;
});

if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL') {
  document.getElementById('configBanner').style.display = 'block';
}

async function submitQuestion() {
  const question = document.getElementById('question').value.trim();
  const nickname = document.getElementById('nickname').value.trim();
  const contactType = document.getElementById('contactType').value;
  const contactValue = document.getElementById('contactValue').value.trim();
  const err = document.getElementById('errMsg');

  err.style.display = 'none';

  if (!question) { showErr('请填写你的问题 😊'); return; }
  if (question.length < 5) { showErr('问题太短啦，多说一点～'); return; }
  if (!contactValue) { showErr('请留下联系方式，方便我回复你'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';

  const data = {
    timestamp: new Date().toLocaleString('zh-CN', {timeZone:'Asia/Kuala_Lumpur'}),
    nickname: nickname || '匿名',
    question,
    contactType,
    contactValue,
    status: '待回复'
  };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });

    document.getElementById('replyVia').textContent = contactType;
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  } catch(e) {
    showErr('提交失败，请稍后再试 😢');
  }

  btn.disabled = false;
  btn.textContent = '提交问题 →';
}

function showErr(msg) {
  const err = document.getElementById('errMsg');
  err.textContent = msg;
  err.style.display = 'block';
}

function resetForm() {
  document.getElementById('question').value = '';
  document.getElementById('nickname').value = '';
  document.getElementById('contactValue').value = '';
  document.getElementById('qCount').textContent = '0';
  document.getElementById('errMsg').style.display = 'none';
  document.getElementById('formView').style.display = 'block';
  document.getElementById('successView').style.display = 'none';
}
</script>
</body>
</html>
