<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Dashboard — MamaVege</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--s1:#fff;--s2:#f3f4f6;
  --b1:#e5e7eb;--b2:#d1d5db;
  --t1:#111827;--t2:#4b5563;--t3:#9ca3af;
  --green:#166534;--green2:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:16px;
  /* dataviz categorical (adjacent-validated) */
  --cat1:#2a78d6;--cat2:#eb6834;--cat3:#1baf7a;--cat4:#eda100;
  --cat5:#e87ba4;--cat6:#008300;--cat7:#4a3aa7;--cat8:#e34948;
}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;padding-bottom:60px;}

/* Nav */
.mv-top{overflow:hidden}
.mv-top-main{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#166534}
.mv-top-left{display:flex;align-items:center;gap:12px}
.mv-top-logo{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;text-decoration:none}
.mv-top-logo img{height:26px}
.mv-top-sep{width:1px;height:24px;background:rgba(255,255,255,.2)}
.mv-top-tool{color:#fff;font-size:14px;font-weight:700;letter-spacing:.3px}
.mv-top-right{display:flex;align-items:center;gap:12px}
.mv-top-back{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}
.mv-top-back:hover{color:#fff}
.mv-top-sub{display:flex;justify-content:space-between;align-items:center;padding:5px 24px;background:#15532d;color:rgba(255,255,255,.6);font-size:11px}

.container{max-width:1200px;margin:0 auto;padding:20px 16px 0;}

/* Filter bar */
.filter-bar{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.filter-bar label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-right:4px;}
.filter-bar select{background:var(--s2);border:1.5px solid var(--b1);border-radius:var(--r);padding:8px 12px;font-size:13px;font-family:var(--font);color:var(--t1);outline:none;}
.filter-bar select:focus{border-color:var(--green);}
.filter-label{font-size:13px;font-weight:700;color:var(--t2);}

/* Section label */
.sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--b1);}

/* KPI Cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px;}
@media(max-width:700px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:6px;}
.kpi-val{font-size:26px;font-weight:800;font-family:var(--mono);line-height:1;}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px;}
.kpi-card.k-green .kpi-val{color:var(--green2);}
.kpi-card.k-blue .kpi-val{color:var(--blue);}
.kpi-card.k-red .kpi-val{color:var(--red);}
.kpi-card.k-amber .kpi-val{color:var(--amber);}

/* Salesperson table */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow-x:auto;}
.dash-table{width:100%;border-collapse:collapse;font-size:13px;}
.dash-table th{text-align:left;padding:8px 12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border-bottom:2px solid var(--b1);font-weight:700;background:var(--s2);white-space:nowrap;}
.dash-table th.r{text-align:right;}
.dash-table td{padding:9px 12px;border-bottom:1px solid var(--b1);vertical-align:middle;}
.dash-table td.r{text-align:right;font-family:var(--mono);}
.dash-table tr:last-child td{border-bottom:none;}
.dash-table td:first-child{white-space:nowrap;}
.dash-table tr:hover td{background:var(--green-bg);}
.sp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex-shrink:0;}
.sp-name{font-weight:700;white-space:nowrap;}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;}
.pill-green{background:var(--green-bg);color:var(--green2);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-red{background:var(--red-bg);color:var(--red);}
.pill-gray{background:var(--s2);color:var(--t3);}
.stars{color:#f59e0b;letter-spacing:1px;font-size:12px;}
.no-data{text-align:center;padding:32px;color:var(--t3);font-size:13px;}

/* Chart */
.chart-wrap{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.chart-title{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:14px;}
.chart-svg-wrap{overflow-x:auto;}

/* Tooltip */
.chart-tooltip{position:fixed;background:#111827;color:#fff;font-size:12px;font-family:var(--font);padding:7px 11px;border-radius:8px;pointer-events:none;display:none;z-index:999;line-height:1.5;white-space:nowrap;}

/* Dormant */
.dormant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.dormant-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.dormant-sp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.dormant-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b1);font-size:12.5px;}
.dormant-row:last-child{border-bottom:none;}
.dormant-name{font-weight:600;color:var(--t1);}
.dormant-days{font-family:var(--mono);font-size:12px;}

/* Loader */
.loading{text-align:center;padding:40px;color:var(--t3);font-size:13px;}
</style>
</head>
<body>

<div class="mv-top">
  <div class="mv-top-main">
    <div class="mv-top-left">
      <a href="index.html" class="mv-top-logo"><img src="Mamavege_Logo.png" alt="MamaVege"></a>
      <div class="mv-top-sep"></div>
      <span class="mv-top-tool">Promo Dashboard</span>
    </div>
    <div class="mv-top-right">
      <a href="index.html" class="mv-top-back">← Hub</a>
    </div>
  </div>
  <div class="mv-top-sub">
    <span>Annual promo activity by salesperson — HQ view</span>
    <span id="top-date"></span>
  </div>
</div>
<script>document.getElementById('top-date').textContent=new Date().toLocaleDateString('en-MY',{weekday:'short',year:'numeric',month:'short',day:'numeric'});</script>

<div id="tooltip" class="chart-tooltip"></div>

<div class="container">

  <!-- Filter -->
  <div class="filter-bar">
    <span class="filter-label">Year</span>
    <select id="f-year" onchange="renderAll()"></select>
    <span style="margin-left:auto;font-size:12px;color:var(--t3);" id="last-updated"></span>
  </div>

  <!-- KPI -->
  <p class="sec">Overview</p>
  <div class="kpi-row" id="kpi-row">
    <div class="loading" style="grid-column:1/-1;">Loading…</div>
  </div>

  <!-- Salesperson table -->
  <p class="sec">By Salesperson</p>
  <div class="card">
    <div id="sp-table-wrap"><div class="loading">Loading…</div></div>
  </div>

  <!-- Monthly trend -->
  <p class="sec">Monthly Activity Trend</p>
  <div class="chart-wrap">
    <div class="chart-title" id="chart-title">Activities per Month</div>
    <div class="chart-svg-wrap" id="chart-wrap"><div class="loading">Loading…</div></div>
  </div>

  <!-- Dormant watchlist -->
  <p class="sec">Dormant Customer Watchlist <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--t3);font-size:9px;">(no promo in 60+ days or never)</span></p>
  <div id="dormant-wrap"><div class="loading">Loading…</div></div>

</div>

<script src="/supabase.min.js"></script>
<script>
// ── Auth ────────────────────────────────────────────────
function lsGet(k){
  const raw=localStorage.getItem(k);if(!raw)return null;
  try{const i=JSON.parse(raw);if(Date.now()>i.expiry){localStorage.removeItem(k);return null;}return i.value;}catch{return null;}
}
const loggedUser=lsGet('userName');
const userRole=lsGet('userRole');
if(!loggedUser||userRole!=='hq'){location.href='index.html';}

const sb=supabase.createClient(
  'https://wjhgezvrxlhpexocfsea.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE'
);
const SALES_API='https://script.google.com/macros/s/AKfycbwxt23ZB0od7EeBSNvjurKTbkDcM7HLgrWhuoqHc3meKWmhbB0XQzfOdB-X2Pj5O_MY/exec';
const CAT_COLORS=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const STALE_DAYS=60;
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let allPromos=[], allCustomers=[], custToSp={};

// ── Helpers ─────────────────────────────────────────────
function norm(s){return(s||'').toString().trim().toLowerCase();}
function fmtRM(v){return'RM '+(v||0).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtPct(n,d){return d>0?(n/d*100).toFixed(0)+'%':'—';}
function spLabel(r){return r.salesperson||r.pic||'Unassigned';}
function parseDays(s){
  if(!s)return 1;const str=s.toString().toLowerCase();
  let m=str.match(/(\d+(\.\d+)?)\s*month/);if(m)return Math.max(1,Math.round(parseFloat(m[1])*30));
  m=str.match(/(\d+(\.\d+)?)\s*week/);if(m)return Math.max(1,Math.round(parseFloat(m[1])*7));
  m=str.match(/(\d+(\.\d+)?)/);if(m)return Math.max(1,Math.round(parseFloat(m[1])));return 1;
}
function addDays(dateStr,d){const dt=new Date(dateStr+'T00:00:00');dt.setDate(dt.getDate()+d);return dt;}
function escHtml(s){return(s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function stars(r){if(!r)return'<span style="color:var(--t3)">—</span>';return'<span class="stars">'+'★'.repeat(r)+'☆'.repeat(5-r)+'</span> <span style="font-size:11px;color:var(--t3)">'+r+'/5</span>';}

// ── Load ────────────────────────────────────────────────
async function loadAll(){
  const [promosRes, custsRes, sheetsRes] = await Promise.all([
    sb.from('promotions')
      .select('id,date,store,salesperson,pic,promo_type,duration,total_cost,target,actual_sales,rating')
      .order('date',{ascending:true}),
    sb.from('customers').select('id,name').order('name',{ascending:true}),
    fetch(SALES_API).then(r=>r.json()).then(j=>j.data||[]).catch(()=>[])
  ]);
  allPromos=promosRes.data||[];
  allCustomers=custsRes.data||[];
  sheetsRes.forEach(r=>{
    const co=norm(r['COMPANY']||'');const sp=(r['SALES PERSON']||'').trim();
    if(co&&sp&&!custToSp[co])custToSp[co]=sp;
  });
  // Populate year selector
  const years=[...new Set(allPromos.map(r=>new Date(r.date+'T00:00:00').getFullYear()))].sort((a,b)=>b-a);
  const sel=document.getElementById('f-year');
  const curY=new Date().getFullYear();
  sel.innerHTML=years.map(y=>`<option value="${y}"${y===curY?' selected':''}>${y}</option>`).join('');
  if(!years.includes(curY)&&years.length)sel.value=years[0];
  document.getElementById('last-updated').textContent='Updated '+new Date().toLocaleTimeString('en-MY');
  renderAll();
}

function getYear(){return parseInt(document.getElementById('f-year').value)||new Date().getFullYear();}
function getYearPromos(){
  const y=getYear();
  return allPromos.filter(r=>new Date(r.date+'T00:00:00').getFullYear()===y);
}

// ── Aggregate ───────────────────────────────────────────
function buildSpStats(promos){
  const map={};
  promos.forEach(r=>{
    const sp=spLabel(r)||'Unassigned';
    if(!map[sp])map[sp]={name:sp,activities:0,customers:new Set(),cost:0,actual:0,target:0,targCount:0,ratings:[],monthly:Array(12).fill(0)};
    const s=map[sp];
    s.activities++;
    if(r.store)s.customers.add(norm(r.store));
    s.cost+=r.total_cost||0;
    s.actual+=r.actual_sales||0;
    if(r.target>0){s.target+=r.target;s.targCount++;}
    if(r.rating)s.ratings.push(r.rating);
    const mo=new Date(r.date+'T00:00:00').getMonth();
    s.monthly[mo]++;
  });
  return Object.values(map).sort((a,b)=>b.activities-a.activities);
}

// ── Render KPIs ─────────────────────────────────────────
function renderKpi(promos){
  const totalAct=promos.length;
  const custsCovered=new Set(promos.map(r=>norm(r.store)).filter(Boolean)).size;
  const totalCost=promos.reduce((s,r)=>s+(r.total_cost||0),0);
  const totalActual=promos.reduce((s,r)=>s+(r.actual_sales||0),0);
  const roi=totalCost>0?((totalActual-totalCost)/totalCost*100):null;
  const roiStr=roi!==null?(roi>=0?'+':'')+roi.toFixed(0)+'%':'—';
  const roiColor=roi===null?'var(--t3)':roi>=0?'var(--green2)':'var(--red)';
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi-card">
      <div class="kpi-label">Total Activities</div>
      <div class="kpi-val">${totalAct}</div>
      <div class="kpi-sub">promo events in ${getYear()}</div>
    </div>
    <div class="kpi-card k-blue">
      <div class="kpi-label">Customers Covered</div>
      <div class="kpi-val">${custsCovered}</div>
      <div class="kpi-sub">of ${allCustomers.length} total customers</div>
    </div>
    <div class="kpi-card k-amber">
      <div class="kpi-label">Total Cost</div>
      <div class="kpi-val" style="font-size:20px">${fmtRM(totalCost)}</div>
      <div class="kpi-sub">promo spend</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Actual Sales</div>
      <div class="kpi-val" style="font-size:20px;color:${roiColor}">${fmtRM(totalActual)}</div>
      <div class="kpi-sub">ROI <strong style="color:${roiColor}">${roiStr}</strong></div>
    </div>`;
}

// ── Render SP Table ─────────────────────────────────────
function renderSpTable(stats){
  const wrap=document.getElementById('sp-table-wrap');
  if(!stats.length){wrap.innerHTML='<div class="no-data">No promo activities found for this year.</div>';return;}

  // Dormant count per SP (all-time, not year-filtered)
  const today=new Date();today.setHours(0,0,0,0);
  const custLastPromo={};
  allPromos.forEach(r=>{
    if(!r.store)return;
    const k=norm(r.store);
    const days=parseDays(r.duration);
    const end=addDays(r.date,days-1);
    const sp=spLabel(r);
    if(!custLastPromo[k]||end>custLastPromo[k].end)custLastPromo[k]={end,sp};
  });
  // count dormant per SP (uses Sheets mapping for attribution)
  const dormantBySp={};
  allCustomers.forEach(c=>{
    const k=norm(c.name);
    const sp=custToSp[k]||custLastPromo[k]?.sp||'Unassigned';
    const info=custLastPromo[k];
    let daysSince=null;
    if(info){daysSince=Math.floor((today-info.end)/86400000);if(daysSince<0)daysSince=0;}
    const status=daysSince===null?'never':daysSince>STALE_DAYS?'stale':'ok';
    if(status!=='ok'){
      if(!dormantBySp[sp])dormantBySp[sp]=0;
      dormantBySp[sp]++;
    }
  });

  let html=`<table class="dash-table">
    <thead><tr>
      <th>Salesperson</th>
      <th class="r">Activities</th>
      <th class="r">Customers w/ Promo</th>
      <th class="r">Dormant Customers</th>
      <th class="r">Total Cost</th>
      <th class="r">Actual Sales</th>
      <th class="r">Achievement</th>
      <th class="r">Avg Rating</th>
    </tr></thead><tbody>`;

  stats.forEach((s,i)=>{
    const color=CAT_COLORS[i%CAT_COLORS.length];
    const dormant=dormantBySp[s.name]||0;
    const dormPill=dormant===0?'<span class="pill pill-green">✓ All active</span>':
      dormant<=3?`<span class="pill pill-amber">${dormant} dormant</span>`:
      `<span class="pill pill-red">${dormant} dormant</span>`;
    const achieve=s.targCount>0?s.actual/s.target*100:null;
    let achieveHtml='<span class="pill pill-gray">No target</span>';
    if(achieve!==null){
      const cls=achieve>=100?'pill-green':achieve>=70?'pill-amber':'pill-red';
      achieveHtml=`<span class="pill ${cls}">${achieve.toFixed(0)}%</span>`;
    }
    const avgRating=s.ratings.length?s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length:null;
    const ratingHtml=avgRating?stars(Math.round(avgRating)):'<span style="color:var(--t3)">—</span>';
    html+=`<tr>
      <td><span class="sp-dot" style="background:${color}"></span><span class="sp-name">${escHtml(s.name)}</span></td>
      <td class="r"><strong>${s.activities}</strong></td>
      <td class="r">${s.customers.size}</td>
      <td class="r">${dormPill}</td>
      <td class="r">${fmtRM(s.cost)}</td>
      <td class="r">${s.actual?fmtRM(s.actual):'<span style="color:var(--t3)">—</span>'}</td>
      <td class="r">${achieveHtml}</td>
      <td class="r">${ratingHtml}</td>
    </tr>`;
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

// ── Monthly Trend Chart ─────────────────────────────────
function renderChart(promos){
  const year=getYear();
  document.getElementById('chart-title').textContent=`Monthly Promo Activities — ${year}`;
  const monthly=Array(12).fill(0);
  promos.forEach(r=>{monthly[new Date(r.date+'T00:00:00').getMonth()]++;});
  const maxVal=Math.max(...monthly,1);

  const W=760,H=160,PL=40,PR=12,PT=16,PB=36;
  const chartW=W-PL-PR,chartH=H-PT-PB;
  const barW=Math.max(8,chartW/12*0.6);
  const gap=chartW/12;
  const tooltip=document.getElementById('tooltip');

  let svgBars='',svgGridLines='',svgXLabels='',svgYLabels='';

  // Grid lines (4)
  const gridSteps=4;
  for(let i=0;i<=gridSteps;i++){
    const v=Math.round(maxVal/gridSteps*i);
    const y=PT+chartH-chartH*(v/maxVal);
    svgGridLines+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
    if(i>0||v===0)svgYLabels+=`<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9ca3af">${v}</text>`;
  }

  monthly.forEach((count,i)=>{
    const cx=PL+gap*i+gap/2;
    const barH=count>0?Math.max(4,chartH*(count/maxVal)):0;
    const barY=PT+chartH-barH;
    svgBars+=`<rect class="bar" x="${cx-barW/2}" y="${barY}" width="${barW}" height="${barH}"
      rx="4" fill="#166534" data-month="${MONTH_NAMES[i]}" data-count="${count}"
      style="cursor:pointer;transition:opacity .1s;"
      onmouseenter="showTip(event,'${MONTH_NAMES[i]} ${year}: ${count} activit${count===1?'y':'ies'}')"
      onmouseleave="hideTip()"
      onmousemove="moveTip(event)"/>`;
    if(count>0){
      svgBars+=`<text x="${cx}" y="${barY-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">${count}</text>`;
    }
    svgXLabels+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="#9ca3af">${MONTH_NAMES[i]}</text>`;
  });

  const svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;min-width:480px;height:auto;display:block;">
    ${svgGridLines}
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+chartH}" stroke="#d1d5db" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+chartH}" x2="${W-PR}" y2="${PT+chartH}" stroke="#d1d5db" stroke-width="1"/>
    ${svgYLabels}${svgBars}${svgXLabels}
  </svg>`;
  document.getElementById('chart-wrap').innerHTML=svg;
}

function showTip(e,text){
  const t=document.getElementById('tooltip');
  t.textContent=text;t.style.display='block';moveTip(e);
}
function moveTip(e){
  const t=document.getElementById('tooltip');
  t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-10)+'px';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}

// ── Dormant Watchlist ───────────────────────────────────
function renderDormant(){
  const today=new Date();today.setHours(0,0,0,0);
  const custInfo={};
  allCustomers.forEach(c=>{custInfo[norm(c.name)]={name:c.name,lastEnd:null,sp:null};});

  allPromos.forEach(r=>{
    if(!r.store)return;
    const k=norm(r.store);
    if(!custInfo[k])return;
    const days=parseDays(r.duration);
    const end=addDays(r.date,days-1);
    if(!custInfo[k].lastEnd||end>custInfo[k].lastEnd)custInfo[k].lastEnd=end;
  });

  // Map customer to salesperson via Sheets, then fallback to last promo pic
  const lastPromoBySp={};
  allPromos.forEach(r=>{
    if(!r.store)return;
    const k=norm(r.store);
    if(!custInfo[k])return;
    if(!custInfo[k].sp)custInfo[k].sp=spLabel(r);
  });
  Object.keys(custInfo).forEach(k=>{
    const sp=custToSp[k];
    if(sp)custInfo[k].sp=sp;
  });

  // Group dormant by SP
  const groups={};
  Object.values(custInfo).forEach(c=>{
    let daysSince=null;
    if(c.lastEnd){daysSince=Math.floor((today-c.lastEnd)/86400000);if(daysSince<0)daysSince=0;}
    const status=daysSince===null?'never':daysSince>STALE_DAYS?'stale':'ok';
    if(status==='ok')return;
    const sp=c.sp||'Unassigned';
    if(!groups[sp])groups[sp]=[];
    groups[sp].push({name:c.name,daysSince,status});
  });

  const sortedSps=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  if(!sortedSps.length){
    document.getElementById('dormant-wrap').innerHTML='<div class="no-data" style="background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:24px;">🎉 All customers have been active recently.</div>';
    return;
  }

  const spColorMap={};
  const spList=[...new Set(allPromos.map(r=>spLabel(r)).filter(Boolean))].sort();
  spList.forEach((sp,i)=>{spColorMap[sp]=CAT_COLORS[i%CAT_COLORS.length];});

  const html=`<div class="dormant-grid">${sortedSps.map(sp=>{
    const rows=groups[sp].sort((a,b)=>{
      const av=a.daysSince===null?Infinity:a.daysSince;
      const bv=b.daysSince===null?Infinity:b.daysSince;
      return bv-av;
    });
    const dot=spColorMap[sp]?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${spColorMap[sp]};"></span>`:'';
    return `<div class="dormant-card">
      <div class="dormant-sp">${dot} ${escHtml(sp)} <span style="margin-left:auto;font-size:11px;">${rows.length} customer${rows.length>1?'s':''}</span></div>
      ${rows.map(r=>{
        const label=r.status==='never'?'<span style="color:var(--red);font-weight:700;font-size:11px;">Never</span>':
          `<span class="${r.daysSince>90?'dormant-days" style="color:var(--red)':'dormant-days" style="color:var(--amber)'}">${r.daysSince}d</span>`;
        return `<div class="dormant-row"><span class="dormant-name">${escHtml(r.name)}</span>${label}</div>`;
      }).join('')}
    </div>`;
  }).join('')}</div>`;
  document.getElementById('dormant-wrap').innerHTML=html;
}

// ── Main render ─────────────────────────────────────────
function renderAll(){
  const promos=getYearPromos();
  renderKpi(promos);
  renderSpTable(buildSpStats(promos));
  renderChart(promos);
  renderDormant();
}

loadAll();
