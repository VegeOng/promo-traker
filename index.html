<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MamaVege Management Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
  }
  .logo h1 {
    color: #166534;
    font-size: 24px;
    font-weight: 700;
  }
  .subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    font-size: 15px;
    background: #fafafa;
    transition: border-color 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #166534;
    background: white;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #166534;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  button:hover { background: #14532d; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><h1>🥬 MamaVege</h1></div>
    <p class="subtitle">Management Hub</p>

    <div class="form-group">
      <label>名字 / Name</label>
      <input type="text" id="name" placeholder="输入你的名字" autocomplete="off">
    </div>
    <div class="form-group">
      <label>密码 / Password</label>
      <input type="password" id="password" placeholder="输入密码">
    </div>

    <button id="loginBtn" onclick="login()">登入 Login</button>
    <div class="error" id="errorMsg"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://wjhgezvrxlhpexocfsea.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE';
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 已登入则自动跳转
  if (sessionStorage.getItem('userName')) {
    const role = sessionStorage.getItem('userRole');
    location.href = role === 'hq' ? 'report-hq.html' : 'my-dashboard.html';
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const name = document.getElementById('name').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    err.classList.remove('show');

    if (!name || !password) {
      err.textContent = '请填写名字和密码';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = '登入中...';

    // 1. 先检查是不是 HQ（名字 + HQ 密码）
    const { data: hqRow } = await supa
      .from('settings')
      .select('value')
      .eq('key', 'hq_password')
      .single();

    if (hqRow && password === hqRow.value) {
      // HQ 登入成功（任何名字 + HQ 密码都算 HQ）
      sessionStorage.setItem('userName', name);
      sessionStorage.setItem('userRole', 'hq');
      location.href = 'report-hq.html';
      return;
    }

    // 2. 检查是不是销售员
    const { data: member } = await supa
      .from('members')
      .select('id, name, password')
      .eq('name', name)
      .single();

    if (member && member.password === password) {
      sessionStorage.setItem('userName', member.name);
      sessionStorage.setItem('userRole', 'member');
      sessionStorage.setItem('userId', member.id);
      location.href = 'my-dashboard.html';
      return;
    }

    err.textContent = '名字或密码错误';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = '登入 Login';
  }
</script>
</body>
</html>
