<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MamaVege | 业绩管理中心</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f3;--primary:#166534;--primary-light:#dcfce7;--primary-mid:#16a34a;--danger:#dc2626;--danger-light:#fee2e2;--warn:#d97706;--warn-light:#fef3c7;--text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;--border:#e5e7eb;--card:#ffffff;--white:#fafafa}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,.serif{font-family:'DM Serif Display',serif}



.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:#dc2626}
.badge{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:500}

.header-right a{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}
.header-right a:hover{color:#fff}
.btn-refresh{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:.8rem;font-family:inherit}
.btn-refresh:hover{background:rgba(255,255,255,.25)}
.last-updated{font-size:.75rem;opacity:.7}

nav.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;gap:0;overflow-x:auto}
nav.tabs button{padding:14px 20px;border:none;background:none;font-family:inherit;font-size:.85rem;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.2s}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs button:hover{color:var(--primary)}

.filters{background:var(--card);padding:.75rem 2rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.filter-label{font-size:.8rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.filter-select{padding:7px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;color:var(--text);background:var(--white);cursor:pointer}

main{padding:1.5rem 2rem;max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card h3{font-size:.9rem;font-family:'DM Sans',sans-serif;font-weight:600;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:1rem}
.kpi{background:var(--card);border-radius:12px;padding:1.1rem;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.green::before{background:var(--primary)}.kpi.red::before{background:var(--danger)}.kpi.gold::before{background:var(--warn)}.kpi.blue::before{background:#3b82f6}
.kpi .label{font-size:.72rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-family:'DM Serif Display',serif;font-size:1.6rem;line-height:1;margin-top:4px}
.kpi.green .value{color:var(--primary)}.kpi.red .value{color:var(--danger)}.kpi.gold .value{color:var(--warn)}.kpi.blue .value{color:#3b82f6}
.kpi .sub{font-size:.72rem;color:var(--text3);margin-top:3px}

.progress-bar{height:24px;background:var(--border);border-radius:12px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#166534,#22c55e);border-radius:12px;transition:width .8s ease}
.progress-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--text)}
.progress-info{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text2)}

.bar-chart .bar-row{display:flex;align-items:center;margin-bottom:6px;gap:8px}
.bar-chart .bar-label{width:36px;font-size:12px;font-weight:600;color:var(--text2);text-align:right;flex-shrink:0}
.bar-chart .bar-track{flex:1;height:26px;background:#f3f4f6;border-radius:6px;overflow:hidden;position:relative}
.bar-chart .bar-fill{height:100%;border-radius:6px;transition:width .6s ease}
.bar-chart .bar-fill.g{background:linear-gradient(90deg,#166534,#22c55e)}
.bar-chart .bar-fill.r{background:linear-gradient(90deg,#dc2626,#f87171)}
.bar-chart .bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--text)}
.bar-chart .bar-pct{width:44px;font-size:11px;color:var(--text2);text-align:right;flex-shrink:0}

table.dt{width:100%;border-collapse:collapse;font-size:.85rem}
table.dt th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);font-weight:600;color:var(--text2);font-size:.72rem;text-transform:uppercase;letter-spacing:.3px;background:#f9fafb;white-space:nowrap}
table.dt td{padding:10px 8px;border-bottom:1px solid #f3f4f6}
table.dt tr:hover td{background:#fafafa}
table.dt tr.clickable{cursor:pointer}
table.dt tr.clickable:hover td{background:var(--primary-light)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700}
.rank.g{background:#dcfce7;color:#166534}.rank.s{background:#f3f4f6;color:#374151}.rank.b{background:#fed7aa;color:#9a3412}.rank.n{background:#f3f4f6;color:var(--text2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.tag.up{background:#dcfce7;color:#166534}.tag.dn{background:#fee2e2;color:#dc2626}.tag.nw{background:#dbeafe;color:#1e40af}

.detail-row td{background:#f8faf8!important;padding:12px 16px!important}
.detail-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:4px}
.detail-table th{background:var(--primary);color:#fff;padding:6px 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.3px}
.detail-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center}
.detail-table td:first-child{text-align:left;font-weight:600}
.detail-table tr:last-child td{font-weight:700;background:#dcfce7}

.alert-card{padding:12px;border-radius:8px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
.alert-card.red{background:var(--danger-light);border-left:3px solid var(--danger)}
.alert-card.yellow{background:var(--warn-light);border-left:3px solid var(--warn)}
.alert-card.green{background:#dcfce7;border-left:3px solid var(--primary)}
.alert-title{font-weight:600;font-size:13px}
.alert-sub{font-size:12px;color:var(--text2);margin-top:2px}

.team-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:8px;transition:all .2s}
.team-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.team-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;color:#fff}
.team-info{flex:1}.team-name{font-weight:600;font-size:15px}.team-stats{font-size:12px;color:var(--text2);margin-top:2px}
.team-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:6px}
.team-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.team-pct{font-size:20px;font-weight:700;font-family:'DM Serif Display',serif}

.section-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--text);margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--primary-light)}
.inline-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.inline-filters input,.inline-filters select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.82rem}
.inline-filters input{min-width:160px}

.sku-block{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.sku-block h4{font-size:.9rem;font-weight:700;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sku-block h4 .sku-total{font-weight:400;font-size:.75rem;color:var(--text2)}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px}
.btn{padding:8px 18px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#15803d}
.btn-outline{background:none;border:2px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary-light)}

.empty{text-align:center;padding:3rem;color:var(--text3);font-size:.9rem}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem;color:var(--text2);gap:1rem}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:24px;max-width:400px;width:100%}
.modal h2{font-size:18px;margin-bottom:16px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;z-index:300;opacity:0;transition:.3s}
.toast.show{opacity:1}.toast.ok{background:var(--primary)}.toast.err{background:var(--danger)}

.footer-nav{background:var(--card);border-top:1px solid var(--border);padding:.75rem 2rem;display:flex;gap:1rem;align-items:center;font-size:.8rem;color:var(--text2)}
.footer-nav a{color:var(--primary);text-decoration:none}.footer-nav a:hover{text-decoration:underline}

@media(max-width:700px){
  .header{padding:0 1rem;height:56px}.header .logo{font-size:1.1rem}
  nav.tabs{padding:0 1rem}nav.tabs button{padding:12px 14px;font-size:.8rem}
  .filters{padding:.5rem 1rem}main{padding:1rem}
  .kpi-grid{grid-template-columns:1fr 1fr}.kpi .value{font-size:1.3rem}
  table.dt{font-size:.78rem}table.dt th,table.dt td{padding:8px 4px}
  .inline-filters{flex-direction:column;align-items:stretch}
}

.mv-top{overflow:hidden}
.mv-top-main{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#166534}
.mv-top-left{display:flex;align-items:center;gap:12px}
.mv-top-logo{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;text-decoration:none}
.mv-top-logo img{height:26px}
.mv-top-sep{width:1px;height:24px;background:rgba(255,255,255,.2)}
.mv-top-tool{color:#fff;font-size:14px;font-weight:700;letter-spacing:.3px}
.mv-top-right{display:flex;align-items:center;gap:12px}
.mv-top-back{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}
.mv-top-back:hover{color:#fff}
.mv-top-btn{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.mv-top-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.mv-top-sub{display:flex;justify-content:space-between;align-items:center;padding:5px 24px;background:#15532d;color:rgba(255,255,255,.6);font-size:11px}
</style>
</head>
<body>

<div class="mv-top">
  <div class="mv-top-main">
    <div class="mv-top-left">
      <a href="index.html" class="mv-top-logo"><img src="Mamavege_Logo.png" alt="MamaVege"></a>

<nav class="tabs">
  <button class="active" onclick="go('overview',this)">📊 总览</button>
  <button onclick="go('customers',this)">👥 客户</button>
  <button onclick="go('products',this)">🏷️ 产品</button>
  <button onclick="go('skutop',this)">🔍 SKU客户</button>
  <button onclick="go('team',this)">👤 团队</button>
  <button onclick="go('profit',this)">💰 利润</button>
  <button onclick="go('admin',this)">⚙️ 设置</button>
</nav>

<div class="filters">
  <span class="filter-label">筛选</span>
  <select class="filter-select" id="selYear" onchange="onFilter()"></select>
  <select class="filter-select" id="selMonth" onchange="onFilter()">
    <option value="0">📅 全年 YTD</option>
    <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>

  </select>
</div>

<main id="content"><div class="loading"><div class="spinner"></div><span>正在加载销售数据...</span></div></main>

<div class="modal-bg" id="authModal">
  <div class="modal">
    <h2>🔐 HQ 验证</h2>
    <div class="form-group"><label>请输入 HQ 密码</label><input type="password" id="authPwd" placeholder="密码" onkeydown="if(event.key==='Enter')verifyHQ()"></div>
    <button class="btn btn-primary" onclick="verifyHQ()">验证</button>
    <button class="btn btn-outline" onclick="closeAuth()" style="margin-left:8px">取消</button>
  </div>
</div>

<div class="footer-nav">
  <span>MamaVege Management Hub</span><span>|</span>
  <a href="index.html">🏠 首页</a>
  <a href="sales-dashboard.html">📊 销售仪表板</a>
  <a href="promo-hq.html">📋 HQ仪表板</a>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwxt23ZB0od7EeBSNvjurKTbkDcM7HLgrWhuoqHc3meKWmhbB0XQzfOdB-X2Pj5O_MY/exec';
const SB='https://wjhgezvrxlhpexocfsea.supabase.co/rest/v1';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE';
const SB_HDR={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const SKUS=['KPM','CLM','SHCR','SHTY','SHSS','SPM - BBQ','BBQ (BAG)','SPM - MALA','MALA (BAG)','MRBR','TYSN','TYSP','TMSP','SMTS','SMCL','SPTS','SPCL','CMBR','KETUPAT'];

// Profit config: customer → SKU → {w: wholesale price, c: cost, d: total deduction rate}
const PC={
'7 ELEVEN':{'SPM - BBQ':{w:1,c:.39,d:.21},'SPM - MALA':{w:1,c:.39,d:.21},'SMTS':{w:3.8,c:4.08,d:.21},'SMCL':{w:3.8,c:4.11,d:.21}},
"LOTUS'S":{'KPM':{w:15.9,c:9.16,d:.139},'SPM - BBQ':{w:1,c:.39,d:.139},'SPM - MALA':{w:1,c:.39,d:.139},'SHTY':{w:13.9,c:8.56,d:.139},'SHCR':{w:13.9,c:7.89,d:.139}},
'MYNEWS / MYCU':{'KPM':{w:3.6,c:2.4,d:.09},'CLM':{w:3.6,c:2.4,d:.09},'SPM - BBQ':{w:1,c:.39,d:.09},'SPM - MALA':{w:1,c:.39,d:.09},'SMTS':{w:3.8,c:4.3,d:.09},'SMCL':{w:3.8,c:4.28,d:.09},'SHTY':{w:14.2,c:8.56,d:.09},'SHCR':{w:14.2,c:7.89,d:.09}},
'JAYA GROCER':{'KPM':{w:14.9,c:9.16,d:.065},'CLM':{w:14.9,c:9.85,d:.10},'SMTS':{w:4.7,c:4.3,d:.055},'SMCL':{w:4.7,c:4.28,d:.055},'SHTY':{w:13,c:8.56,d:.115},'SHCR':{w:13,c:7.89,d:.115}},
'AEON CO.':{'KPM':{w:15.9,c:9.16,d:.10},'CLM':{w:15.9,c:9.85,d:.10},'SMTS':{w:3.8,c:4.08,d:.10},'SMCL':{w:3.8,c:4.11,d:.10},'SHTY':{w:14.2,c:8.56,d:.10},'SHCR':{w:14.2,c:7.89,d:.10}},
'AEON BIG':{'KPM':{w:15.9,c:9.16,d:.115},'CLM':{w:15.9,c:9.85,d:.115}},
'VILLAGE GROCER':{'KPM':{w:15.9,c:9.16,d:.04},'CLM':{w:15.9,c:9.85,d:.10},'SHTY':{w:15.9,c:8.56,d:.04},'SHCR':{w:15.9,c:7.89,d:.04}}
};
// Deduction detail per customer (per-SKU where rates differ)
const PDD={
'7 ELEVEN':{uniform:true,items:[['DC','6.0%'],['Unconditional','5.0%'],['A/P','10.0%']],total:'21.0%'},
"LOTUS'S":{uniform:true,items:[['DC','3.85%'],['Gan. Rebate','4.0%'],['Trade Disc','6.0%']],total:'13.9%'},
'MYNEWS / MYCU':{uniform:true,items:[['DC','6.0%'],['Prompt','1.0%'],['CRM','1.0%'],['Unconditional','1.0%']],total:'9.0%'},
'JAYA GROCER':{uniform:false,bysku:{
  'KPM':{items:[['DC/Item','3.5%'],['Fix Rebate','3.0%']],total:'6.5%'},
  'CLM':{items:[['DC/Item','8.0%'],['Fix Rebate','2.0%']],total:'10.0%'},
  'SMTS':{items:[['DC/Item','3.5%'],['Fix Rebate','2.0%']],total:'5.5%'},
  'SMCL':{items:[['DC/Item','3.5%'],['Fix Rebate','2.0%']],total:'5.5%'},
  'SHTY':{items:[['DC/Item','3.5%'],['Fix Rebate','3.0%'],['A/P','5.0%']],total:'11.5%'},
  'SHCR':{items:[['DC/Item','3.5%'],['Fix Rebate','3.0%'],['A/P','5.0%']],total:'11.5%'}}},
'AEON CO.':{uniform:true,items:[['DC','8.0%'],['Trading Rebate','2.0%']],total:'10.0%'},
'AEON BIG':{uniform:true,items:[['Fix Rebate','11.5%']],total:'11.5%'},
'VILLAGE GROCER':{uniform:false,bysku:{
  'KPM':{items:[['Fix Rebate','2.0%'],['A/P','2.0%']],total:'4.0%'},
  'CLM':{items:[['Fix Rebate','8.0%'],['A/P','2.0%']],total:'10.0%'},
  'SHTY':{items:[['Fix Rebate','2.0%'],['A/P','2.0%']],total:'4.0%'},
  'SHCR':{items:[['Fix Rebate','2.0%'],['A/P','2.0%']],total:'4.0%'}}}
};

let allData=[], profitDB=[], state={year:0,month:0,tab:'overview',targets:{monthly:500000,annual:6000000}};
let custSearchTerm='', custSPFilter='', cfgForm=null, cfgMonth='';

async function loadProfitConfig(){
  try{const r=await fetch(SB+'/profit_config?order=year_month.asc',{headers:SB_HDR});if(r.ok)profitDB=await r.json();else profitDB=[];}catch(e){profitDB=[];}
}
// Find effective config for a customer in a given year-month (e.g. "2026-03")
// Priority: 1) exact month match in DB, 2) most recent previous month in DB, 3) hardcoded PC/PDD
function getEffectiveConfig(cust,ym){
  const rows=profitDB.filter(r=>r.customer_name===cust&&r.year_month<=ym).sort((a,b)=>b.year_month.localeCompare(a.year_month));
  if(rows.length)return{skus:rows[0].skus,deds:rows[0].deductions,from:rows[0].year_month,isDB:true};
  if(PC[cust])return{skus:PC[cust],deds:PDD[cust],from:'默认',isDB:false};
  return null;
}
function getEffectiveDeductions(cust,ym){const e=getEffectiveConfig(cust,ym);return e?e.deds:null;}
function getMergedPDD(){return PDD;} // kept for backward compat in rProfit display

function getTotal(r){for(const k of Object.keys(r)){if(k.replace(/[^A-Za-z]/g,'').toUpperCase()==='TOTALRM')return parseFloat(r[k])||0;}return 0;}
function fmt(n){return'RM '+Number(n).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtK(n){return n>=10000?'RM '+(n/1000).toFixed(0)+'K':fmt(n);}
function fi(n){return n?Math.round(n).toLocaleString():'—';}

// ===== DATA =====
async function loadData(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div><span>正在加载销售数据...</span></div>';
  document.getElementById('lastUpdated').textContent='加载中...';
  try{
    const res=await fetch(API_URL);const json=await res.json();
    allData=json.data||[];
    document.getElementById('lastUpdated').textContent='更新: '+new Date().toLocaleTimeString('zh-MY');
    populateYears();
    await loadProfitConfig();
    render();
    loadTargets();
  }catch(e){document.getElementById('content').innerHTML='<div class="empty">❌ 无法加载数据<br><small>'+e.message+'</small></div>';}
}

async function loadTargets(){
  try{
    const r=await fetch(SB+'/sales_targets?year=eq.'+state.year,{headers:SB_HDR});
    if(r.ok){const d=await r.json();if(d.length){state.targets={monthly:d[0].monthly_target,annual:d[0].annual_target};render();return;}}
  }catch(e){}
  state.targets={monthly:500000,annual:6000000};
}

function populateYears(){
  const years=[...new Set(allData.map(r=>String(r['YEAR'])).filter(Boolean))].sort();
  const sel=document.getElementById('selYear');
  sel.innerHTML=years.map(y=>`<option value="${y}">${y}年</option>`).join('');
  if(!state.year||!years.includes(String(state.year)))state.year=years.length?parseInt(years[years.length-1]):2026;
  sel.value=state.year;
}

// ===== FILTERS =====
function yearData(){return allData.filter(r=>String(r['YEAR'])===String(state.year));}
function filtered(){
  let d=yearData();
  if(state.month>0)d=d.filter(r=>String(r['MONTH']).trim()===String(state.month));
  return d;
}
function getMonth(r){return parseInt(String(r['MONTH']).trim())||0;}
function onFilter(){
  state.year=parseInt(document.getElementById('selYear').value);
  state.month=parseInt(document.getElementById('selMonth').value);
  render();
  loadTargets();
}

// ===== ANALYTICS =====
function monthlyStats(){
  const map={};
  yearData().forEach(r=>{const m=getMonth(r);if(!m)return;if(!map[m])map[m]={m,rev:0,orders:0,custs:new Set()};map[m].rev+=getTotal(r);map[m].orders++;map[m].custs.add(r['COMPANY']);});
  return Object.values(map).sort((a,b)=>a.m-b.m);
}
function customerStats(){
  const map={};
  filtered().forEach(r=>{const c=r['COMPANY']||'Unknown';if(!map[c])map[c]={name:c,rev:0,sp:r['SALES PERSON']||'',orders:0,type:r['TYPE']||''};map[c].rev+=getTotal(r);map[c].orders++;if(r['SALES PERSON'])map[c].sp=r['SALES PERSON'];});
  return Object.values(map).sort((a,b)=>b.rev-a.rev);
}
function teamStats(){
  const map={};
  filtered().forEach(r=>{const s=r['SALES PERSON']||'Unknown';if(!map[s])map[s]={name:s,rev:0,orders:0,custs:new Set()};map[s].rev+=getTotal(r);map[s].orders++;map[s].custs.add(r['COMPANY']);});
  return Object.values(map).sort((a,b)=>b.rev-a.rev);
}
function skuStats(){
  const map={};
  yearData().forEach(r=>{const m=getMonth(r);SKUS.forEach(s=>{const v=parseFloat(r[s])||0;if(!v)return;if(!map[s])map[s]={sku:s,total:0,months:{}};if(!map[s].months[m])map[s].months[m]=0;map[s].months[m]+=v;map[s].total+=v;});});
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function churnAnalysis(){
  const ms=monthlyStats().map(m=>m.m);if(ms.length<2)return[];
  const latest=state.month>0?state.month:Math.max(...ms);const prev=latest-1;if(prev<1)return[];
  const prevC={},currC=new Set();
  yearData().forEach(r=>{
    const m=getMonth(r),c=r['COMPANY'];
    if(m===prev){if(!prevC[c])prevC[c]={name:c,rev:0,sp:r['SALES PERSON']||''};prevC[c].rev+=getTotal(r);if(r['SALES PERSON'])prevC[c].sp=r['SALES PERSON'];}
    if(m===latest)currC.add(c);
  });
  const out=[];
  Object.values(prevC).forEach(c=>{if(!currC.has(c.name)){let p='low';if(c.rev>=10000)p='high';else if(c.rev>=3000)p='med';out.push({...c,priority:p,prevM:prev,currM:latest});}});
  return out.sort((a,b)=>b.rev-a.rev);
}
function momChange(name,curM){
  if(curM<=1)return null;let cur=0,prev=0;
  yearData().forEach(r=>{if(r['COMPANY']!==name)return;const m=getMonth(r);if(m===curM)cur+=getTotal(r);if(m===curM-1)prev+=getTotal(r);});
  if(!prev&&!cur)return null;if(!prev)return{pct:999,nw:true};return{pct:(cur-prev)/prev*100,nw:false};
}
function customerSkuDetail(name){
  const map={};const ms=new Set();
  yearData().forEach(r=>{
    if(r['COMPANY']!==name)return;const m=getMonth(r);ms.add(m);
    SKUS.forEach(s=>{const v=parseFloat(r[s])||0;if(!v)return;if(!map[s])map[s]={sku:s,months:{},total:0};if(!map[s].months[m])map[s].months[m]=0;map[s].months[m]+=v;map[s].total+=v;});
  });
  return{skus:Object.values(map).sort((a,b)=>b.total-a.total),months:[...ms].sort((a,b)=>a-b)};
}
function skuTopCustomers(sku){
  const map={};
  filtered().forEach(r=>{const v=parseFloat(r[sku])||0;if(!v)return;const c=r['COMPANY']||'Unknown';if(!map[c])map[c]={name:c,qty:0,sp:r['SALES PERSON']||''};map[c].qty+=v;if(r['SALES PERSON'])map[c].sp=r['SALES PERSON'];});
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,10);
}

// ===== RENDER =====
function render(){
  const c=document.getElementById('content');
  try{
  switch(state.tab){
    case'overview':c.innerHTML=rOverview();break;
    case'customers':c.innerHTML=rCustomers();break;
    case'products':c.innerHTML=rProducts();break;
    case'skutop':c.innerHTML=rSkuTop();break;
    case'profit':c.innerHTML=rProfit();break;
    case'team':c.innerHTML=rTeam();break;
    case'admin':rAdmin();break;
  }
  }catch(e){c.innerHTML=`<div class="card" style="border:2px solid var(--danger)"><h3 style="color:var(--danger)">❌ 渲染错误</h3><pre style="font-size:12px;white-space:pre-wrap">${e.message}\n${e.stack}</pre></div>`;}
}

function rOverview(){
  const ms=monthlyStats(),tgt=state.targets;
  const ytd=ms.reduce((s,m)=>s+m.rev,0);const am=ms.length||1;
  const isMonth=state.month>0;
  const curMonthData=isMonth?ms.find(m=>m.m===state.month):null;
  const curRev=isMonth?(curMonthData?curMonthData.rev:0):ytd;
  const curTarget=isMonth?tgt.monthly:tgt.annual;
  const curPct=curTarget?curRev/curTarget:0;
  const gap=curTarget-curRev;
  const prevMonthData=isMonth&&state.month>1?ms.find(m=>m.m===state.month-1):null;
  const momPct=prevMonthData&&prevMonthData.rev?((curRev-prevMonthData.rev)/prevMonthData.rev*100):null;
  const avg=ytd/am;const ep=am/12;const onTrack=(ytd/tgt.annual)>=ep;
  const churn=churnAnalysis(),team=teamStats(),topP=team.length?team[0]:null,totalRev=team.reduce((s,t)=>s+t.rev,0);
  const label=isMonth?`${state.month}月`:'YTD';

  let h=`<div style="background:${isMonth?'var(--primary-light)':'transparent'};border-radius:8px;padding:${isMonth?'8px 12px':'0'};margin-bottom:10px;font-size:13px;color:var(--primary);font-weight:600">${isMonth?'📅 当前显示：'+state.year+'年'+state.month+'月':'📅 '+state.year+'年 全年累计 YTD'}</div>
  <div class="kpi-grid">`;
  if(isMonth){
    h+=`<div class="kpi green"><div class="label">${state.month}月营业额</div><div class="value">${fmt(curRev)}</div><div class="sub">目标 ${fmtK(tgt.monthly)}</div></div>
    <div class="kpi ${curPct>=.8?'green':'red'}"><div class="label">${state.month}月达成率</div><div class="value">${(curPct*100).toFixed(1)}%</div><div class="sub">${curPct>=1?'✅ 已达标':curPct>=.8?'⚡ 接近目标':'⚠️ 未达标'}</div></div>
    <div class="kpi ${momPct!==null&&momPct>=0?'green':'gold'}"><div class="label">环比上月</div><div class="value">${momPct!==null?(momPct>=0?'▲':'▼')+Math.abs(momPct).toFixed(1)+'%':'—'}</div><div class="sub">${prevMonthData?'上月 '+fmtK(prevMonthData.rev):'无上月数据'}</div></div>
    <div class="kpi ${gap>0?'red':'green'}"><div class="label">距月目标</div><div class="value">${gap>0?fmtK(gap):'✅ 已超额'}</div><div class="sub">${gap>0?'还差 '+(curPct*100).toFixed(0)+'% → 100%':'超额 '+fmtK(-gap)}</div></div>`;
  }else{
    h+=`<div class="kpi green"><div class="label">年度累计 YTD</div><div class="value">${fmt(ytd)}</div><div class="sub">${am} 个月数据</div></div>
    <div class="kpi ${onTrack?'green':'red'}"><div class="label">年度达成率</div><div class="value">${(ytd/tgt.annual*100).toFixed(1)}%</div><div class="sub">预期 ${(ep*100).toFixed(0)}%${onTrack?' ✅':' ⚠️ 落后'}</div></div>
    <div class="kpi gold"><div class="label">月均营业额</div><div class="value">${fmtK(avg)}</div><div class="sub">目标 ${fmtK(tgt.monthly)}</div></div>
    <div class="kpi red"><div class="label">距年度目标</div><div class="value">${fmtK(tgt.annual-ytd)}</div><div class="sub">还需 ${Math.ceil((tgt.annual-ytd)/tgt.monthly)} 个满月</div></div>`;
  }
  h+=`</div>
  <div class="card"><h3><span class="dot"></span>${isMonth?state.month+'月目标进度':'年度目标进度'}</h3>
    <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(curPct*100,100)}%"></div><div class="progress-label">${(curPct*100).toFixed(1)}%</div></div>
    <div class="progress-info"><span>${fmt(curRev)}</span><span>目标 ${fmt(curTarget)}</span></div>
  </div>
  <div class="card"><h3><span class="dot"></span>月度业绩对比</h3><div class="bar-chart">`;
  const maxV=Math.max(tgt.monthly,...ms.map(m=>m.rev));
  ms.forEach(m=>{const w=(m.rev/maxV*100).toFixed(1),mp=m.rev/tgt.monthly;const hl=isMonth&&m.m===state.month;h+=`<div class="bar-row" style="${hl?'background:var(--primary-light);border-radius:6px;padding:2px 4px':''}"><div class="bar-label" style="${hl?'color:var(--primary);font-weight:700':''}">${m.m}月</div><div class="bar-track"><div class="bar-fill ${mp>=.8?'g':'r'}" style="width:${w}%"></div><div class="bar-val">${fmtK(m.rev)}</div></div><div class="bar-pct" style="${hl?'font-weight:700;color:var(--primary)':''}">${(mp*100).toFixed(0)}%</div></div>`;});
  h+=`</div></div><div class="card"><h3><span class="dot" style="background:var(--warn)"></span>快速提醒</h3>`;
  if(churn.length){const hi=churn.filter(c=>c.priority==='high');h+=`<div class="alert-card red"><div><div class="alert-title">⚠️ ${churn.length} 家客户流失预警</div><div class="alert-sub">${hi.length?hi.map(c=>c.name).join('、')+' 需立即跟进':'切换到"客户"查看详情'}</div></div></div>`;}
  if(topP&&totalRev){const sh=topP.rev/totalRev;h+=`<div class="alert-card ${sh>.7?'yellow':'green'}"><div><div class="alert-title">👤 ${topP.name} 贡献 ${(sh*100).toFixed(0)}% ${label}营业额</div><div class="alert-sub">${sh>.7?'⚠️ 人员依赖风险高':'团队分配正常'}</div></div></div>`;}
  const bigC=customerStats().filter(c=>c.rev>=10000);
  if(bigC.length)h+=`<div class="alert-card green"><div><div class="alert-title">⭐ ${bigC.length} 家大订单客户 (≥RM 10K) — ${label}</div><div class="alert-sub">${bigC.slice(0,3).map(c=>c.name).join('、')}${bigC.length>3?' 等':''}</div></div></div>`;
  h+=`</div>`;return h;
}

function rCustomers(){
  const allCusts=customerStats(),totalRev=allCusts.reduce((s,c)=>s+c.rev,0);
  const ms=monthlyStats(),latestM=state.month>0?state.month:(ms.length?Math.max(...ms.map(m=>m.m)):0);
  const churn=churnAnalysis();
  const spList=[...new Set(allCusts.map(c=>c.sp).filter(Boolean))].sort();
  let custs=allCusts;
  if(custSPFilter)custs=custs.filter(c=>c.sp===custSPFilter);
  if(custSearchTerm)custs=custs.filter(c=>c.name.toLowerCase().includes(custSearchTerm.toLowerCase()));
  let h=`<div class="card"><h3><span class="dot"></span>客户排名 ${state.month>0?state.month+'月':'(YTD)'}</h3>
    <div class="inline-filters">
      <input type="text" placeholder="🔍 搜索客户..." value="${custSearchTerm}" oninput="custSearchTerm=this.value;render()">
      <select onchange="custSPFilter=this.value;render()">
        <option value="">全部销售员</option>${spList.map(s=>`<option value="${s}"${s===custSPFilter?' selected':''}>${s}</option>`).join('')}
      </select>
      <span style="font-size:12px;color:var(--text3)">共 ${custs.length} 家 · 点击客户查看拿货明细</span>
    </div>
    <div style="overflow-x:auto"><table class="dt" id="custTable"><tr><th>排名</th><th>客户</th><th>类型</th><th>营业额</th><th>占比</th><th>销售员</th><th>环比</th></tr>`;
  custs.slice(0,20).forEach((c,i)=>{
    const rc=i===0?'g':i===1?'s':i===2?'b':'n',sh=(c.rev/totalRev*100).toFixed(1);
    let mt='';
    if(latestM>1){const ch=momChange(c.name,latestM);if(ch){if(ch.nw)mt='<span class="tag nw">🆕</span>';else if(ch.pct>0)mt=`<span class="tag up">▲${ch.pct.toFixed(0)}%</span>`;else if(ch.pct<0)mt=`<span class="tag dn">▼${Math.abs(ch.pct).toFixed(0)}%</span>`;}}
    const esc=c.name.replace(/'/g,"\\'");
    h+=`<tr class="clickable" onclick="toggleDetail('${esc}',this)"><td><span class="rank ${rc}">${i+1}</span></td><td><strong>📋 ${c.name}</strong></td><td><span class="tag" style="background:var(--warn-light);color:var(--warn)">${c.type||'-'}</span></td><td class="serif" style="color:var(--primary);font-weight:600">${fmt(c.rev)}</td><td>${sh}%</td><td>${c.sp}</td><td>${mt}</td></tr>`;
  });
  h+=`</table></div></div>`;
  if(churn.length){
    h+=`<div class="section-title">⚠️ 客户流失预警 — ${churn[0].prevM}月有单，${churn[0].currM}月未回购</div>`;
    churn.forEach(c=>{const cls=c.priority==='high'?'red':c.priority==='med'?'yellow':'green';const lb=c.priority==='high'?'🔴 高优先级 — 立即致电':c.priority==='med'?'🟡 中优先级 — 本周联络':'⚪ 低优先级 — 月内跟进';h+=`<div class="alert-card ${cls}"><div><div class="alert-title">${c.name}</div><div class="alert-sub">${c.prevM}月营业额 ${fmt(c.rev)} · ${c.sp} 负责</div><div class="alert-sub" style="margin-top:2px;font-weight:600">${lb}</div></div></div>`;});
  }
  return h;
}

function toggleDetail(name,row){
  const next=row.nextElementSibling;
  if(next&&next.classList.contains('detail-row')){next.remove();return;}
  document.querySelectorAll('.detail-row').forEach(r=>r.remove());
  const d=customerSkuDetail(name);
  if(!d.skus.length){toast('该客户无 SKU 数据','err');return;}
  const mns=['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let html=`<td colspan="7" style="padding:12px 16px!important;background:#f8faf8!important">
    <div style="font-weight:700;font-size:13px;color:var(--primary);margin-bottom:6px">📦 ${name} — SKU 拿货明细</div>
    <table class="detail-table"><tr><th>产品 SKU</th>`;
  d.months.forEach(m=>{html+=`<th>${mns[m]}</th>`;});
  html+=`<th>累计</th></tr>`;
  d.skus.forEach(s=>{
    html+=`<tr><td>${s.sku}</td>`;
    d.months.forEach(m=>{html+=`<td>${fi(s.months[m]||0)}</td>`;});
    html+=`<td>${fi(s.total)}</td></tr>`;
  });
  const totals={};d.skus.forEach(s=>{d.months.forEach(m=>{totals[m]=(totals[m]||0)+(s.months[m]||0);});});
  const grandTotal=d.skus.reduce((s,sk)=>s+sk.total,0);
  html+=`<tr><td>合计</td>`;d.months.forEach(m=>{html+=`<td>${fi(totals[m])}</td>`;});
  html+=`<td>${fi(grandTotal)}</td></tr></table></td>`;
  const tr=document.createElement('tr');tr.className='detail-row';tr.innerHTML=html;
  row.after(tr);
}

function rSkuTop(){

function rTeam(){
  const team=teamStats(),totalRev=team.reduce((s,t)=>s+t.rev,0);
  const colors=['#166534','#dc2626','#d97706','#3b82f6','#8b5cf6'];
  let h=`<div class="section-title">👤 团队业绩 ${state.month>0?state.month+'月':'(YTD)'}</div>`;
  team.forEach((t,i)=>{const share=totalRev?t.rev/totalRev:0;h+=`<div class="team-card"><div class="team-avatar" style="background:${colors[i%5]}">${t.name.charAt(0)}</div><div class="team-info"><div class="team-name">${t.name}</div><div class="team-stats">${fmt(t.rev)} · ${t.orders} 单 · ${t.custs.size} 家客户 · 占比 ${(share*100).toFixed(1)}%</div><div class="team-bar"><div class="team-bar-fill" style="width:${Math.min(share*100,100)}%;background:${colors[i%5]}"></div></div></div><div class="team-pct" style="color:${colors[i%5]}">${(share*100).toFixed(0)}%</div></div>`;});
  if(team.length){const mx=Math.max(...team.map(t=>t.rev));h+=`<div class="card" style="margin-top:12px"><h3><span class="dot"></span>贡献对比</h3><div class="bar-chart">`;team.forEach((t,i)=>{h+=`<div class="bar-row"><div class="bar-label">${t.name.substring(0,5)}</div><div class="bar-track"><div class="bar-fill g" style="width:${(t.rev/mx*100).toFixed(1)}%;background:${colors[i%5]}"></div><div class="bar-val">${fmtK(t.rev)}</div></div><div class="bar-pct">${(t.rev/totalRev*100).toFixed(0)}%</div></div>`;});h+=`</div></div>`;}
  return h;
}

function profitStats(){
  const data=filtered();const custMap={};
  data.forEach(r=>{
    const cust=r['COMPANY']||'Unknown';
    const m=getMonth(r);const ym=state.year+'-'+String(m).padStart(2,'0');
    const eff=getEffectiveConfig(cust,ym);if(!eff||!eff.skus)return;
    const cfg=eff.skus;
    if(!custMap[cust])custMap[cust]={name:cust,grossRev:0,deductions:0,netRev:0,cost:0,profit:0,skus:{},sp:r['SALES PERSON']||''};
    const cm=custMap[cust];
    SKUS.forEach(sku=>{
      const qty=parseFloat(r[sku])||0;if(!qty||!cfg[sku])return;
      const s=cfg[sku],gross=qty*s.w,ded=gross*s.d,net=gross-ded,cst=qty*s.c,pft=net-cst;
      cm.grossRev+=gross;cm.deductions+=ded;cm.netRev+=net;cm.cost+=cst;cm.profit+=pft;
      if(!cm.skus[sku])cm.skus[sku]={sku,qty:0,gross:0,ded:0,net:0,cost:0,profit:0,margin:0,wp:s.w,cp:s.c,dr:s.d};
      const sk=cm.skus[sku];sk.qty+=qty;sk.gross+=gross;sk.ded+=ded;sk.net+=net;sk.cost+=cst;sk.profit+=pft;
    });
    if(r['SALES PERSON'])cm.sp=r['SALES PERSON'];
  });
  Object.values(custMap).forEach(c=>{c.margin=c.netRev?c.profit/c.netRev:0;Object.values(c.skus).forEach(s=>{s.margin=s.net?s.profit/s.net:0;});});
  return Object.values(custMap).sort((a,b)=>b.profit-a.profit);
}

function rProfit(){
  const custs=profitStats();
  if(!custs.length){
    const data=filtered();
    const apiNames=[...new Set(data.map(r=>r['COMPANY']||'Unknown'))].sort();
    const cfgNames=Object.keys(PC).sort();
    return`<div class="empty">💰 当前筛选条件下无利润数据</div>
    <div class="card"><h3><span class="dot" style="background:var(--danger)"></span>诊断信息</h3>
    <p style="font-size:12px;margin-bottom:6px"><strong>API 数据客户名 (${apiNames.length}):</strong></p>
    <p style="font-size:11px;color:var(--text2);word-break:break-all">${apiNames.map(n=>'「'+n+'」').join(' · ')}</p>
    <p style="font-size:12px;margin:8px 0 6px"><strong>利润配置客户名 (${cfgNames.length}):</strong></p>
    <p style="font-size:11px;color:var(--text2);word-break:break-all">${cfgNames.map(n=>'「'+n+'」').join(' · ')}</p>
    <p style="font-size:12px;color:var(--danger);margin-top:8px">⚠️ 两边名称必须完全一致才能匹配。请检查空格、大小写、特殊符号。</p></div>`;}
  const label=state.month>0?`${state.year}年${state.month}月`:`${state.year}年 YTD`;
  const totalGross=custs.reduce((s,c)=>s+c.grossRev,0);
  const totalNet=custs.reduce((s,c)=>s+c.netRev,0);
  const totalCost=custs.reduce((s,c)=>s+c.cost,0);
  const totalProfit=custs.reduce((s,c)=>s+c.profit,0);
  const totalMargin=totalNet?totalProfit/totalNet:0;
  const lossCusts=custs.filter(c=>c.profit<0);

  let h=`<div style="background:${totalProfit<0?'var(--danger-light)':'var(--primary-light)'};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600;color:${totalProfit<0?'var(--danger)':'var(--primary)'}">💰 利润分析 — ${label}</div>
  <div class="kpi-grid">
    <div class="kpi green"><div class="label">总毛收入</div><div class="value">${fmtK(totalGross)}</div><div class="sub">扣款前</div></div>
    <div class="kpi gold"><div class="label">总净收入</div><div class="value">${fmtK(totalNet)}</div><div class="sub">扣款后</div></div>
    <div class="kpi blue"><div class="label">总成本</div><div class="value">${fmtK(totalCost)}</div></div>
    <div class="kpi ${totalProfit>=0?'green':'red'}"><div class="label">总毛利</div><div class="value">${fmt(totalProfit)}</div><div class="sub">综合 Margin ${(totalMargin*100).toFixed(1)}%</div></div>
  </div>`;

  if(lossCusts.length){
    h+=`<div class="alert-card red" style="margin-bottom:12px"><div><div class="alert-title">⚠️ ${lossCusts.length} 家客户在亏钱</div><div class="alert-sub">${lossCusts.map(c=>c.name+' ('+fmt(c.profit)+')').join(' · ')}</div></div></div>`;
  }

  h+=`<div class="card"><h3><span class="dot"></span>客户利润排名 · 点击查看 SKU 明细</h3>
    <div style="overflow-x:auto"><table class="dt" id="profitTable"><tr><th>客户</th><th>扣款明细</th><th>毛收入</th><th>扣款额</th><th>净收入</th><th>成本</th><th>毛利</th><th>Margin</th></tr>`;
  const ms=monthlyStats();
  const latestYM=state.month>0?state.year+'-'+String(state.month).padStart(2,'0'):state.year+'-'+String(ms.length?Math.max(...ms.map(m=>m.m)):1).padStart(2,'0');
  custs.forEach(c=>{
    const isLoss=c.profit<0;const esc=c.name.replace(/'/g,"\\'");
    const effCfg=getEffectiveConfig(c.name,latestYM);
    const dd=effCfg?effCfg.deds:null;
    let ddHtml='—';
    if(dd){
      if(dd.uniform){ddHtml=dd.items.map(i=>'<span style="background:#f3f4f6;padding:1px 5px;border-radius:3px;margin:1px;display:inline-block;font-size:10px">'+i[0]+' '+i[1]+'</span>').join(' ')+'<br><span style="font-weight:700;font-size:11px">合计 '+dd.total+'</span>';}
      else{ddHtml='<span style="font-size:10px;color:var(--warn)">因产品而异</span><br><span style="font-size:10px">'+Object.entries(dd.bysku).map(([k,v])=>k+': '+v.total).join(' · ')+'</span>';}
    }
    h+=`<tr class="clickable" onclick="toggleProfitDetail('${esc}',this)" style="${isLoss?'background:var(--danger-light)':''}">
      <td><strong>${isLoss?'🔴':'🟢'} ${c.name}</strong><br><span style="font-size:11px;color:var(--text3)">${c.sp}</span></td>
      <td style="max-width:200px">${ddHtml}</td>
      <td>${fmtK(c.grossRev)}</td>
      <td style="color:var(--danger)">-${fmtK(c.deductions)}</td>
      <td>${fmtK(c.netRev)}</td>
      <td>${fmtK(c.cost)}</td>
      <td style="font-weight:700;color:${isLoss?'var(--danger)':'var(--primary)'}">${fmt(c.profit)}</td>
      <td><span class="tag ${isLoss?'dn':'up'}">${(c.margin*100).toFixed(1)}%</span></td>
    </tr>`;
  });
  h+=`</table></div></div>`;

  // Loss-making SKUs summary
  const lossSkus=[];
  custs.forEach(c=>{Object.values(c.skus).forEach(s=>{if(s.profit<0)lossSkus.push({cust:c.name,...s});});});
  lossSkus.sort((a,b)=>a.profit-b.profit);
  if(lossSkus.length){
    h+=`<div class="section-title">🔴 亏损 SKU 清单 — 建议停止/调价</div>`;
    lossSkus.forEach(s=>{
      h+=`<div class="alert-card red"><div>
        <div class="alert-title">${s.cust} × ${s.sku}</div>
        <div class="alert-sub">批发 RM ${s.wp.toFixed(2)} · 成本 RM ${s.cp.toFixed(2)} · 扣款 ${(s.dr*100).toFixed(1)}% · 数量 ${s.qty.toLocaleString()}</div>
        <div class="alert-sub" style="font-weight:700;color:var(--danger)">亏损 ${fmt(s.profit)} · Margin ${(s.margin*100).toFixed(1)}%</div>
      </div></div>`;
    });
  }
  return h;
}

function toggleProfitDetail(name,row){
  const next=row.nextElementSibling;
  if(next&&next.classList.contains('detail-row')){next.remove();return;}
  document.querySelectorAll('#profitTable .detail-row').forEach(r=>r.remove());
  const cust=profitStats().find(c=>c.name===name);if(!cust)return;
  const skus=Object.values(cust.skus).sort((a,b)=>b.profit-a.profit);
  const ms=monthlyStats();const latestYM=state.month>0?state.year+'-'+String(state.month).padStart(2,'0'):state.year+'-'+String(ms.length?Math.max(...ms.map(m=>m.m)):1).padStart(2,'0');
  const effCfg=getEffectiveConfig(name,latestYM);
  const dd=effCfg?effCfg.deds:null;
  let html=`<td colspan="8" style="padding:14px 16px!important;background:#f8faf8!important">`;

  // Deduction breakdown section
  if(dd){
    html+=`<div style="margin-bottom:10px;padding:10px;background:var(--warn-light);border-radius:8px;border-left:3px solid var(--warn)">
      <div style="font-weight:700;font-size:12px;color:var(--warn);margin-bottom:4px">📋 ${name} 扣款明细</div>`;
    if(dd.uniform){
      html+=`<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">`;
      dd.items.forEach((item,i)=>{
        html+=`<span style="background:#fff;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:500">${item[0]} <strong>${item[1]}</strong></span>`;
        if(i<dd.items.length-1)html+=`<span style="color:var(--text3)">+</span>`;

      html+=`<span style="color:var(--text3)">=</span><span style="background:var(--primary);color:#fff;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:700">合计 ${dd.total}</span></div>`;
    }else{
      html+=`<div style="font-size:11px;color:var(--text2);margin-bottom:4px">⚠️ 扣款因产品而异：</div><div style="display:flex;flex-wrap:wrap;gap:4px">`;

      });
      html+=`</div>`;
    }
    html+=`</div>`;
  }

  html+=`<div style="font-weight:700;font-size:13px;color:var(--primary);margin-bottom:6px">📦 SKU 利润明细</div>
    <table class="detail-table"><tr><th>SKU</th><th>批发价</th><th>成本</th><th>扣款率</th><th>数量</th><th>净收入</th><th>成本合计</th><th>毛利</th><th>Margin</th></tr>`;
  skus.forEach(s=>{
    const isLoss=s.profit<0;
    html+=`<tr style="${isLoss?'background:#fee2e2':''}"><td>${s.sku}</td><td>RM ${s.wp.toFixed(2)}</td><td>RM ${s.cp.toFixed(2)}</td><td>${(s.dr*100).toFixed(1)}%</td><td>${s.qty.toLocaleString()}</td><td>${fmt(s.net)}</td><td>${fmt(s.cost)}</td><td style="font-weight:700;color:${isLoss?'var(--danger)':'var(--primary)'}">${fmt(s.profit)}</td><td><span class="tag ${isLoss?'dn':'up'}">${(s.margin*100).toFixed(1)}%</span></td></tr>`;
  });
  const totNet=skus.reduce((s,sk)=>s+sk.net,0),totCost=skus.reduce((s,sk)=>s+sk.cost,0),totP=skus.reduce((s,sk)=>s+sk.profit,0);
  html+=`<tr><td>合计</td><td></td><td></td><td></td><td></td><td>${fmt(totNet)}</td><td>${fmt(totCost)}</td><td style="font-weight:700">${fmt(totP)}</td><td>${(totNet?totP/totNet*100:0).toFixed(1)}%</td></tr></table></td>`;

function initCfgForm(name,isEdit){
  if(isEdit){
    const eff=getEffectiveConfig(name,cfgMonth);
    const pc=eff?eff.skus:{};const pdd=eff?eff.deds:{};
    cfgForm={name,isEdit:true,uniform:pdd&&pdd.uniform!==false,
      deds:pdd&&pdd.items?pdd.items.map(i=>({n:i[0],r:i[1].replace('%','')})):[{n:'',r:''}],
      skus:Object.entries(pc).map(([sku,v])=>({sku,w:String(v.w),c:String(v.c),d:(v.d*100).toFixed(1),
        dd:pdd&&pdd.bysku&&pdd.bysku[sku]?pdd.bysku[sku].items.map(i=>i[0]+' '+i[1]).join(' + '):''}))};
    if(!cfgForm.skus.length)cfgForm.skus=[{sku:'',w:'',c:'',d:'',dd:''}];
    if(!cfgForm.deds.length)cfgForm.deds=[{n:'',r:''}];
  }else{cfgForm={name:'',isEdit:false,uniform:true,deds:[{n:'',r:''}],skus:[{sku:'',w:'',c:'',d:'',dd:''}]};}
  render();
}

    h+=`<button style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px" onclick="cfgForm.skus.splice(${i},1);if(!cfgForm.skus.length)cfgForm.skus=[{sku:'',w:'',c:'',d:'',dd:''}];render()">✕</button></div>`;
  });
  h+=`<button class="btn btn-outline" style="font-size:11px;padding:4px 10px;margin-top:6px" onclick="cfgForm.skus.push({sku:'',w:'',c:'',d:'',dd:''});render()">+ 添加产品</button></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="saveProfitCfg()">💾 保存 (${mLabel}起生效)</button>
      <button class="btn btn-outline" onclick="cfgForm=null;render()">取消</button></div></div>`;
  return h;
}

async function saveProfitCfg(){
  const name=cfgForm.isEdit?cfgForm.name:(document.getElementById('cfgName').value||'').trim();
  if(!name){toast('请填写客户名称','err');return;}
  const skus={};const totDR=cfgForm.uniform?cfgForm.deds.reduce((s,d)=>s+(parseFloat(d.r)||0),0)/100:0;
  cfgForm.skus.forEach(s=>{if(!s.sku)return;skus[s.sku]={w:parseFloat(s.w)||0,c:parseFloat(s.c)||0,d:cfgForm.uniform?totDR:(parseFloat(s.d)||0)/100};});
  let deductions={};
  if(cfgForm.uniform){
    deductions={uniform:true,items:cfgForm.deds.filter(d=>d.n&&d.r).map(d=>[d.n,parseFloat(d.r).toFixed(1)+'%']),total:(totDR*100).toFixed(1)+'%'};
  }else{
    deductions={uniform:false,bysku:{}};
    cfgForm.skus.forEach(s=>{if(!s.sku||!s.d)return;
      const items=s.dd?s.dd.split('+').map(x=>{const p=x.trim().split(/\s+/);return p.length>=2?[p.slice(0,-1).join(' '),p[p.length-1]]:[x.trim(),''];}):[];
      deductions.bysku[s.sku]={items,total:parseFloat(s.d).toFixed(1)+'%'};});
  }
  try{
    await fetch(SB+'/profit_config?customer_name=eq.'+encodeURIComponent(name)+'&year_month=eq.'+cfgMonth,{method:'DELETE',headers:SB_HDR});
    const r=await fetch(SB+'/profit_config',{method:'POST',headers:{...SB_HDR,'Prefer':'return=minimal'},body:JSON.stringify([{customer_name:name,year_month:cfgMonth,skus,deductions}])});
    if(!r.ok)throw new Error('保存失败');
    toast('✅ 已保存 '+name+' ('+cfgMonth+')','ok');cfgForm=null;await loadProfitConfig();render();
  }catch(e){toast('保存失败（表可能未创建或缺 year_month 列）','err');}
}

async function deleteProfitCfg(name){
  if(!confirm('确定删除 '+name+' 在 '+cfgMonth+' 的配置？'))return;
  try{await fetch(SB+'/profit_config?customer_name=eq.'+encodeURIComponent(name)+'&year_month=eq.'+cfgMonth,{method:'DELETE',headers:SB_HDR});
    toast('✅ 已删除','ok');await loadProfitConfig();render();
  }catch(e){toast('删除失败','err');}
}

  const c=document.getElementById('content');
  if(sessionStorage.getItem('hq_auth')!=='1'){document.getElementById('authModal').classList.add('show');c.innerHTML='<div class="empty">🔐 请先验证 HQ 密码</div>';return;}
  c.innerHTML=`
    <div class="section-title">🎯 年度目标设置 (${state.year}年)</div>
    <div class="card"><div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="form-group" style="flex:1;min-width:140px"><label>月度目标 (RM)</label><input type="number" id="fM" value="${state.targets.monthly}"></div>
      <div class="form-group" style="flex:1;min-width:140px"><label>年度目标 (RM)</label><input type="number" id="fA" value="${state.targets.annual}"></div>
    </div><button class="btn btn-primary" onclick="saveTargets()">💾 保存目标</button></div>

    ${rProfitCfgList()}

    <div class="section-title">🛠️ 数据库表（首次使用请运行）</div>
    <div class="card"><pre id="sqlPre" style="background:#1f2937;color:#e5e7eb;padding:12px;border-radius:8px;font-size:11px;overflow-x:auto;white-space:pre-wrap">-- 目标表
CREATE TABLE IF NOT EXISTS sales_targets (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  year integer NOT NULL UNIQUE,
  monthly_target numeric(12,2) DEFAULT 500000,
  annual_target numeric(12,2) DEFAULT 6000000,
  created_at timestamptz DEFAULT now()
);
ALTER TABLE sales_targets ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Allow all" ON sales_targets FOR ALL USING (true) WITH CHECK (true);
INSERT INTO sales_targets (year, monthly_target, annual_target) VALUES (2026, 500000, 6000000) ON CONFLICT (year) DO NOTHING;

-- 利润配置表（按月份）
CREATE TABLE IF NOT EXISTS profit_config (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  customer_name text NOT NULL,
  year_month text NOT NULL DEFAULT '2026-01',
  skus jsonb NOT NULL DEFAULT '{}',
  deductions jsonb NOT NULL DEFAULT '{}',
  created_at timestamptz DEFAULT now(),
  UNIQUE(customer_name, year_month)
);
ALTER TABLE profit_config ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Allow all" ON profit_config FOR ALL USING (true) WITH CHECK (true);</pre>
    <button class="btn btn-outline" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('sqlPre').textContent);toast('已复制','ok')">📋 复制 SQL</button></div>`;
}

async function saveTargets(){
  const m=parseFloat(document.getElementById('fM').value)||500000,a=parseFloat(document.getElementById('fA').value)||6000000;
  try{await fetch(SB+'/sales_targets?year=eq.'+state.year,{method:'DELETE',headers:SB_HDR});
    const r=await fetch(SB+'/sales_targets',{method:'POST',headers:{...SB_HDR,'Prefer':'return=minimal'},body:JSON.stringify([{year:state.year,monthly_target:m,annual_target:a}])});
    if(!r.ok)throw new Error();state.targets={monthly:m,annual:a};toast('✅ 目标已保存','ok');
  }catch(e){toast('保存失败（目标表可能未创建）','err');}
}

async function verifyHQ(){
  const pwd=document.getElementById('authPwd').value;
  try{const r=await fetch(SB+'/settings?key=eq.hq_password',{headers:SB_HDR});const d=await r.json();
    if(d.length&&d[0].value===pwd){sessionStorage.setItem('hq_auth','1');closeAuth();render();}else toast('密码错误','err');
  }catch(e){toast('验证失败','err');}
}
function closeAuth(){document.getElementById('authModal').classList.remove('show');document.getElementById('authPwd').value='';if(state.tab==='admin'&&sessionStorage.getItem('hq_auth')!=='1')go('overview',document.querySelector('nav.tabs button'));}

function go(tab,btn){state.tab=tab;custSearchTerm='';custSPFilter='';document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');render();}
function toast(msg,t){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+t;setTimeout(()=>el.classList.remove('show'),3000);}

loadData();
</script>
