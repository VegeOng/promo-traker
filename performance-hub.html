<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MamaVege 业绩管理中心</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--primary:#166534;--primary-light:#f0fdf4;--primary-mid:#dcfce7;--danger:#dc2626;--danger-light:#fef2f2;--warn:#f59e0b;--warn-light:#fffbeb;--text:#1f2937;--text2:#6b7280;--text3:#9ca3af;--border:#e5e7eb;--white:#fff;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,.serif{font-family:'DM Serif Display',serif}

header{background:var(--primary);color:#fff;padding:20px 24px 16px;position:sticky;top:0;z-index:100}
header h1{font-size:20px;font-weight:400;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.7;margin-top:2px}
.controls{display:flex;gap:8px;margin-top:12px}
.controls select{padding:6px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:rgba(255,255,255,.15);color:#fff;font-family:inherit;font-size:13px;cursor:pointer}
.controls select option{color:var(--text);background:#fff}

nav.tabs{display:flex;gap:0;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:76px;z-index:99}
nav.tabs button{flex:1;padding:12px 8px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
nav.tabs button:hover{background:var(--primary-light)}

main{padding:16px;max-width:900px;margin:0 auto}
.card{background:var(--white);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{font-size:14px;color:var(--text2);font-family:'DM Sans',sans-serif;font-weight:600;margin-bottom:12px}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--white);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.kpi .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-family:'DM Serif Display',serif;font-size:22px;color:var(--primary);margin-top:4px}
.kpi .sub{font-size:11px;color:var(--text3);margin-top:2px}
.kpi.danger .value{color:var(--danger)}
.kpi.warn .value{color:var(--warn)}

.progress-wrap{margin-bottom:16px}
.progress-bar{height:28px;background:var(--border);border-radius:14px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#166534,#22c55e);border-radius:14px;transition:width .8s ease;min-width:2px}
.progress-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:600;color:var(--text)}
.progress-info{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text2)}

.bar-chart .bar-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.bar-chart .bar-label{width:32px;font-size:12px;font-weight:600;color:var(--text2);text-align:right;flex-shrink:0}
.bar-chart .bar-track{flex:1;height:28px;background:var(--border);border-radius:6px;overflow:hidden;position:relative}
.bar-chart .bar-fill{height:100%;border-radius:6px;transition:width .6s ease}
.bar-chart .bar-fill.green{background:linear-gradient(90deg,#166534,#22c55e)}
.bar-chart .bar-fill.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.bar-chart .bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--text)}
.bar-chart .bar-pct{width:44px;font-size:11px;color:var(--text2);text-align:right;flex-shrink:0}
.bar-chart .target-line{position:absolute;right:0;top:0;height:100%;width:2px;background:var(--primary);opacity:.4}

table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--border);font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
table.data td{padding:8px 6px;border-bottom:1px solid var(--border)}
table.data tr:hover{background:var(--primary-light)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700}
.rank.gold{background:#fef3c7;color:#92400e}
.rank.silver{background:#f3f4f6;color:#374151}
.rank.bronze{background:#fed7aa;color:#9a3412}
.rank.normal{background:var(--border);color:var(--text2)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag.up{background:#dcfce7;color:#166534}
.tag.down{background:#fef2f2;color:#dc2626}
.tag.new{background:#dbeafe;color:#1e40af}
.tag.flat{background:#f3f4f6;color:#6b7280}

.alert-card{padding:12px;border-radius:8px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.alert-card.red{background:var(--danger-light);border-left:3px solid var(--danger)}
.alert-card.yellow{background:var(--warn-light);border-left:3px solid var(--warn)}
.alert-card.green{background:var(--primary-light);border-left:3px solid var(--primary)}
.alert-card .alert-title{font-weight:600;font-size:13px}
.alert-card .alert-sub{font-size:12px;color:var(--text2);margin-top:2px}

.team-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--white);border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px}
.team-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.team-info{flex:1}
.team-name{font-weight:600;font-size:15px}
.team-stats{font-size:12px;color:var(--text2);margin-top:2px}
.team-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:6px}
.team-bar-fill{height:100%;border-radius:3px;background:var(--primary);transition:width .6s}
.team-pct{font-size:20px;font-weight:700;color:var(--primary);font-family:'DM Serif Display',serif}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px}
.form-group textarea{height:160px;font-size:12px;font-family:'Courier New',monospace}
.btn{padding:10px 20px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:none;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn+.btn{margin-left:8px}

.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:14px}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:12px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px}

.section-title{font-size:16px;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--primary)}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);cursor:pointer;transition:.2s}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.setup-box{background:var(--white);border-radius:12px;padding:24px;margin:20px auto;max-width:700px;box-shadow:var(--shadow)}
.setup-box h2{color:var(--primary);margin-bottom:12px}
.setup-box pre{background:#1f2937;color:#e5e7eb;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;margin:10px 0;line-height:1.5}
.setup-box .step{display:flex;gap:10px;margin-bottom:16px}
.setup-box .step-num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;z-index:300;opacity:0;transition:.3s}
.toast.show{opacity:1}
.toast.success{background:var(--primary)}
.toast.error{background:var(--danger)}

@media(max-width:600px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi .value{font-size:18px}
  header h1{font-size:17px}
  table.data{font-size:12px}
  table.data th,table.data td{padding:6px 4px}
}
</style>
</head>
<body>

<header>
  <h1>MamaVege 业绩管理中心</h1>
  <div class="sub">Performance Management Hub</div>
  <div class="controls">
    <select id="selYear" onchange="onYearChange()"></select>
    <select id="selMonth" onchange="onMonthChange()">
      <option value="0">📅 全年 YTD</option>
      <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
      <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
      <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
      <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
    </select>
  </div>
</header>

<nav class="tabs">
  <button class="active" onclick="switchTab('overview',this)">📊 总览</button>
  <button onclick="switchTab('customers',this)">👥 客户</button>
  <button onclick="switchTab('products',this)">🏷️ 产品</button>
  <button onclick="switchTab('team',this)">👤 团队</button>
  <button onclick="switchTab('admin',this)">⚙️ 管理</button>
</nav>

<main id="content"></main>

<div class="modal-bg" id="authModal">
  <div class="modal">
    <h2>🔐 HQ 验证</h2>
    <div class="form-group">
      <label>请输入 HQ 密码</label>
      <input type="password" id="authPwd" placeholder="密码" onkeydown="if(event.key==='Enter')verifyHQ()">
    </div>
    <button class="btn btn-primary" onclick="verifyHQ()">验证</button>
    <button class="btn btn-outline" onclick="closeAuth()" style="margin-left:8px">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB='https://wjhgezvrxlhpexocfsea.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE';
const HDR={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};

let state={year:2026,month:0,tab:'overview',orders:[],targets:null,ready:false,dbOk:false};

// ===== API =====
async function sbGet(table,q=''){
  const r=await fetch(`${SB}/${table}?${q}`,{headers:HDR});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function sbPost(table,data){
  const r=await fetch(`${SB}/${table}`,{method:'POST',headers:{...HDR,'Prefer':'return=minimal'},body:JSON.stringify(data)});
  if(!r.ok){const t=await r.text();throw new Error(t);}
  return true;
}
async function sbDelete(table,q){
  const r=await fetch(`${SB}/${table}?${q}`,{method:'DELETE',headers:HDR});
  return r.ok;
}

// ===== INIT =====
async function init(){
  const y=document.getElementById('selYear');
  for(let i=2026;i<=2030;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'年';y.appendChild(o);}
  y.value=state.year;
  try{
    await loadData();
    state.dbOk=true;
  }catch(e){
    state.dbOk=false;
    renderSetup();
    return;
  }
  state.ready=true;
  render();
}

async function loadData(){
  const yStart=state.year+'-01-01',yEnd=state.year+'-12-31';
  state.orders=await sbGet('sales_orders',`order_date=gte.${yStart}&order_date=lte.${yEnd}&order=order_date.asc`);
  try{
    const t=await sbGet('sales_targets',`year=eq.${state.year}`);
    state.targets=t.length?t[0]:{monthly_target:500000,annual_target:6000000};
  }catch(e){state.targets={monthly_target:500000,annual_target:6000000};}
}

// ===== ANALYTICS =====
function filtered(){
  if(state.month===0)return state.orders;
  return state.orders.filter(o=>{const m=new Date(o.order_date).getMonth()+1;return m===state.month;});
}
function monthNum(d){return new Date(d).getMonth()+1;}

function monthlyStats(){
  const map={};
  state.orders.forEach(o=>{
    const m=monthNum(o.order_date);
    if(!map[m])map[m]={month:m,revenue:0,orders:0,customers:new Set()};
    map[m].revenue+=parseFloat(o.amount)||0;
    map[m].orders++;
    map[m].customers.add(o.customer_name);
  });
  return Object.values(map).sort((a,b)=>a.month-b.month);
}

function customerStats(){
  const data=filtered();
  const map={};
  data.forEach(o=>{
    const k=o.customer_name;
    if(!map[k])map[k]={name:k,revenue:0,salesperson:o.salesperson,orders:0,months:new Set()};
    map[k].revenue+=parseFloat(o.amount)||0;
    map[k].orders++;
    map[k].months.add(monthNum(o.order_date));
    if(o.salesperson)map[k].salesperson=o.salesperson;
  });
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
}

function skuStats(){
  const map={};
  state.orders.forEach(o=>{
    if(!o.product_sku)return;
    const s=o.product_sku;
    const m=monthNum(o.order_date);
    if(!map[s])map[s]={sku:s,total:0,months:{}};
    if(!map[s].months[m])map[s].months[m]=0;
    map[s].months[m]+=parseInt(o.quantity)||0;
    map[s].total+=parseInt(o.quantity)||0;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function teamStats(){
  const data=filtered();
  const map={};
  data.forEach(o=>{
    const s=o.salesperson||'未知';
    if(!map[s])map[s]={name:s,revenue:0,orders:0,customers:new Set()};
    map[s].revenue+=parseFloat(o.amount)||0;
    map[s].orders++;
    map[s].customers.add(o.customer_name);
  });
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
}

function churnAnalysis(){
  const months=monthlyStats().map(m=>m.month);
  if(months.length<2)return[];
  const latestM=state.month>0?state.month:Math.max(...months);
  const prevM=latestM-1;
  if(prevM<1)return[];
  const prevCust={},currCust=new Set();
  state.orders.forEach(o=>{
    const m=monthNum(o.order_date);
    if(m===prevM){
      const k=o.customer_name;
      if(!prevCust[k])prevCust[k]={name:k,revenue:0,salesperson:o.salesperson,lastDate:o.order_date};
      prevCust[k].revenue+=parseFloat(o.amount)||0;
      if(o.order_date>prevCust[k].lastDate)prevCust[k].lastDate=o.order_date;
      if(o.salesperson)prevCust[k].salesperson=o.salesperson;
    }
    if(m===latestM)currCust.add(o.customer_name);
  });
  const churned=[];
  Object.values(prevCust).forEach(c=>{
    if(!currCust.has(c.name)){
      const days=Math.floor((new Date()-new Date(c.lastDate))/(86400000));
      let priority='low';
      if(c.revenue>=10000)priority='high';
      else if(c.revenue>=3000)priority='medium';
      churned.push({...c,days,priority,currentMonth:latestM,prevMonth:prevM});
    }
  });
  return churned.sort((a,b)=>b.revenue-a.revenue);
}

function momChange(custName,currentMonth){
  if(currentMonth<=1)return null;
  let curr=0,prev=0;
  state.orders.forEach(o=>{
    if(o.customer_name!==custName)return;
    const m=monthNum(o.order_date);
    if(m===currentMonth)curr+=parseFloat(o.amount)||0;
    if(m===currentMonth-1)prev+=parseFloat(o.amount)||0;
  });
  if(prev===0&&curr===0)return null;
  if(prev===0)return{pct:999,isNew:true};
  return{pct:((curr-prev)/prev*100),isNew:false};
}

// ===== RENDER =====
function render(){
  if(!state.ready)return;
  const c=document.getElementById('content');
  switch(state.tab){
    case'overview':c.innerHTML=renderOverview();break;
    case'customers':c.innerHTML=renderCustomers();break;
    case'products':c.innerHTML=renderProducts();break;
    case'team':c.innerHTML=renderTeam();break;
    case'admin':renderAdmin();break;
  }
}

function fmt(n){return'RM '+n.toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtK(n){return n>=1000?'RM '+(n/1000).toFixed(0)+'K':fmt(n);}
function pct(n){return(n*100).toFixed(1)+'%';}

function renderOverview(){
  const ms=monthlyStats();
  const tgt=state.targets;
  const ytd=ms.reduce((s,m)=>s+m.revenue,0);
  const activeMonths=ms.length||1;
  const monthAvg=ytd/activeMonths;
  const annualPct=ytd/tgt.annual_target;
  const gap=tgt.annual_target-ytd;
  const expectedPct=activeMonths/12;
  const onTrack=annualPct>=expectedPct;
  const latestM=ms.length?ms[ms.length-1]:null;
  const latestPct=latestM?latestM.revenue/tgt.monthly_target:0;
  const churn=churnAnalysis();
  const bigOrders=customerStats().filter(c=>c.revenue>=10000);

  let html=`
    <div class="kpi-grid">
      <div class="kpi"><div class="label">年度累计 YTD</div><div class="value">${fmt(ytd)}</div><div class="sub">${activeMonths} 个月数据</div></div>
      <div class="kpi ${onTrack?'':'danger'}"><div class="label">年度达成率</div><div class="value">${pct(annualPct)}</div><div class="sub">预期 ${pct(expectedPct)}${onTrack?' ✅':' ⚠️ 落后'}</div></div>
      <div class="kpi"><div class="label">月均营业额</div><div class="value">${fmtK(monthAvg)}</div><div class="sub">目标 ${fmtK(tgt.monthly_target)}</div></div>
      <div class="kpi danger"><div class="label">距离年度目标</div><div class="value">${fmtK(gap)}</div><div class="sub">还需 ${Math.ceil(gap/tgt.monthly_target)} 个满月</div></div>
    </div>

    <div class="card">
      <h3>📊 年度目标进度</h3>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${Math.min(annualPct*100,100)}%"></div>
          <div class="progress-label">${pct(annualPct)}</div>
        </div>
        <div class="progress-info">
          <span>${fmt(ytd)}</span>
          <span>目标 ${fmt(tgt.annual_target)}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📈 月度业绩对比</h3>
      <div class="bar-chart">`;

  const maxVal=Math.max(tgt.monthly_target,...ms.map(m=>m.revenue));
  ms.forEach(m=>{
    const w=(m.revenue/maxVal*100).toFixed(1);
    const mp=m.revenue/tgt.monthly_target;
    const color=mp>=0.8?'green':'red';
    html+=`<div class="bar-row">
      <div class="bar-label">${m.month}月</div>
      <div class="bar-track">
        <div class="bar-fill ${color}" style="width:${w}%"></div>
        <div class="bar-val">${fmtK(m.revenue)}</div>
      </div>
      <div class="bar-pct">${(mp*100).toFixed(0)}%</div>
    </div>`;
  });
  html+=`</div></div>`;

  if(churn.length||bigOrders.length){
    html+=`<div class="card"><h3>⚡ 快速提醒</h3>`;
    if(churn.length){
      const highP=churn.filter(c=>c.priority==='high');
      html+=`<div class="alert-card red"><div><div class="alert-title">⚠️ ${churn.length} 家客户流失预警</div><div class="alert-sub">${highP.length?highP.map(c=>c.name).join('、')+' 需立即跟进':'切换到"客户"查看详情'}</div></div></div>`;
    }
    const team=teamStats();
    if(team.length>1){
      const top=team[0];
      const totalRev=team.reduce((s,t)=>s+t.revenue,0);
      html+=`<div class="alert-card ${top.revenue/totalRev>0.7?'yellow':'green'}"><div><div class="alert-title">👤 ${top.name} 贡献 ${(top.revenue/totalRev*100).toFixed(0)}% 营业额</div><div class="alert-sub">${top.revenue/totalRev>0.7?'⚠️ 人员依赖风险高，需分散业绩来源':'团队分配健康'}</div></div></div>`;
    }
    html+=`</div>`;
  }
  return html;
}

function renderCustomers(){
  const custs=customerStats();
  const totalRev=custs.reduce((s,c)=>s+c.revenue,0);
  const ms=monthlyStats();
  const latestM=state.month>0?state.month:(ms.length?Math.max(...ms.map(m=>m.month)):0);
  const churn=churnAnalysis();

  let html=`<div class="card"><h3>🏆 客户排名 ${state.month>0?state.month+'月':'(YTD累计)'} — Top ${Math.min(custs.length,20)}</h3>
    <div style="overflow-x:auto"><table class="data">
    <tr><th>排名</th><th>客户</th><th>营业额</th><th>占比</th><th>销售员</th><th>环比</th></tr>`;

  custs.slice(0,20).forEach((c,i)=>{
    const rCls=i===0?'gold':i===1?'silver':i===2?'bronze':'normal';
    const share=(c.revenue/totalRev*100).toFixed(1);
    let momTag='';
    if(latestM>1){
      const ch=momChange(c.name,latestM);
      if(ch){
        if(ch.isNew)momTag='<span class="tag new">🆕 新</span>';
        else if(ch.pct>0)momTag=`<span class="tag up">▲ ${ch.pct.toFixed(0)}%</span>`;
        else if(ch.pct<0)momTag=`<span class="tag down">▼ ${Math.abs(ch.pct).toFixed(0)}%</span>`;
        else momTag='<span class="tag flat">— 持平</span>';
      }
    }
    html+=`<tr>
      <td><span class="rank ${rCls}">${i+1}</span></td>
      <td style="font-weight:600">${c.name}</td>
      <td>${fmt(c.revenue)}</td>
      <td>${share}%</td>
      <td>${c.salesperson||'-'}</td>
      <td>${momTag}</td>
    </tr>`;
  });
  html+=`</table></div></div>`;

  if(churn.length){
    html+=`<div class="section-title">⚠️ 客户流失预警 — ${churn[0].prevMonth}月有单, ${churn[0].currentMonth}月未回购</div>`;
    churn.forEach(c=>{
      const cls=c.priority==='high'?'red':c.priority==='medium'?'yellow':'green';
      const label=c.priority==='high'?'🔴 高优先级 — 立即致电':c.priority==='medium'?'🟡 中优先级 — 本周内联络':'⚪ 低优先级 — 月内跟进';
      html+=`<div class="alert-card ${cls}"><div>
        <div class="alert-title">${c.name}</div>
        <div class="alert-sub">${c.prevMonth}月营业额 ${fmt(c.revenue)} · ${c.salesperson} 负责 · 已 ${c.days} 天未下单</div>
        <div class="alert-sub" style="margin-top:4px;font-weight:600">${label}</div>
      </div></div>`;
    });
  }
  return html;
}

function renderProducts(){
  const skus=skuStats();
  if(!skus.length)return`<div class="empty"><div class="icon">🏷️</div><p>暂无 SKU 数据</p><p style="font-size:12px;margin-top:8px">在"管理"页导入含 SKU 的订单数据</p></div>`;

  const ms=monthlyStats().map(m=>m.month);
  let html=`<div class="card"><h3>🏷️ SKU 产品销量排名</h3>
    <div style="overflow-x:auto"><table class="data">
    <tr><th>产品</th>`;
  ms.forEach(m=>{html+=`<th>${m}月</th>`;});
  html+=`<th>累计</th><th>趋势</th></tr>`;

  skus.forEach(s=>{
    html+=`<tr><td style="font-weight:600">${s.sku}</td>`;
    let prevVal=0;
    ms.forEach(m=>{
      const v=s.months[m]||0;
      html+=`<td>${v?v.toLocaleString():'—'}</td>`;
      prevVal=v;
    });
    html+=`<td style="font-weight:600">${s.total.toLocaleString()}</td>`;
    if(ms.length>=2){
      const last=s.months[ms[ms.length-1]]||0;
      const prev=s.months[ms[ms.length-2]]||0;
      if(prev===0&&last>0)html+=`<td><span class="tag new">🆕</span></td>`;
      else if(prev===0)html+=`<td>—</td>`;
      else{
        const ch=((last-prev)/prev*100);
        html+=`<td><span class="tag ${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(0)}%</span></td>`;
      }
    }else html+=`<td>—</td>`;
    html+=`</tr>`;
  });
  html+=`</table></div></div>`;
  return html;
}

// ===== ACTIONS =====
async function importBulk(){
  const raw=document.getElementById('importData').value.trim();
  if(!raw){toast('请粘贴数据','error');return;}
  const lines=raw.split('\n').filter(l=>l.trim());
  const records=[];
  let errors=0;
  lines.forEach((line,i)=>{
    const cols=line.split('\t');
    if(cols.length===4){
      records.push({order_date:cols[0].trim(),customer_name:cols[1].trim(),salesperson:cols[2].trim(),product_sku:'',quantity:0,amount:parseFloat(cols[3])||0});
    }else if(cols.length>=6){
      records.push({order_date:cols[0].trim(),customer_name:cols[1].trim(),salesperson:cols[2].trim(),product_sku:cols[3].trim(),quantity:parseInt(cols[4])||0,amount:parseFloat(cols[5])||0});
    }else{errors++;}
  });
  if(!records.length){toast('格式不正确，请检查','error');return;}
  try{
    const chunk=200;
    for(let i=0;i<records.length;i+=chunk){
      await sbPost('sales_orders',records.slice(i,i+chunk));
    }
    toast(`✅ 成功导入 ${records.length} 条${errors?' ('+errors+' 行格式错误跳过)':''}`, 'success');
    document.getElementById('importData').value='';
    await loadData();render();
  }catch(e){toast('导入失败: '+e.message,'error');}
}

async function addSingle(){

    document.getElementById('fQty').value='0';

}

async function saveTargets(){
  const m=parseFloat(document.getElementById('fMonthly').value)||500000;
  const a=parseFloat(document.getElementById('fAnnual').value)||6000000;
  try{
    await sbDelete('sales_targets',`year=eq.${state.year}`);

    state.targets={monthly_target:m,annual_target:a};

}
