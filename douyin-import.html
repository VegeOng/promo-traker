<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MamaVege | 抖店数据导入</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{ --green:#166534; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --text:#1a1a1a; --muted:#6b7280; --border:#e5e7eb; --card:#fff; --bg:#f4f6f3; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .mv-top-main{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#166534}
  .mv-top-left{display:flex;align-items:center;gap:12px}
  .mv-top-logo{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;text-decoration:none}
  .mv-top-logo img{height:26px}
  .mv-top-sep{width:1px;height:24px;background:rgba(255,255,255,.2)}
  .mv-top-tool{color:#fff;font-size:14px;font-weight:700;letter-spacing:.3px}
  .mv-top-back{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}
  .wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 3rem;}
  .page-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--green);margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
  .card-title{font-size:14px;font-weight:700;margin-bottom:14px;}
  .drop{border:2px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:.2s;}
  .drop:hover,.drop.over{border-color:var(--green);background:#f0fdf4;}
  .drop-icon{font-size:40px;margin-bottom:10px;}
  .btn{background:var(--green);color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn:disabled{background:#9ca3af;cursor:not-allowed;}
  .btn.sec{background:#fff;color:var(--text);border:1.5px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#9ca3af;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:7px 8px;border-bottom:1px solid #f3f4f6;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .msg{padding:12px 14px;border-radius:8px;font-size:13px;margin-top:12px;}
  .msg.ok{background:#dcfce7;color:var(--green);}
  .msg.err{background:#fee2e2;color:var(--red);}
  .msg.info{background:#dbeafe;color:var(--blue);}
  .tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
  .tag.compass{background:#fef3c7;color:var(--amber);}
  .tag.order{background:#dbeafe;color:var(--blue);}
  .steps{font-size:12px;color:var(--muted);line-height:1.9;}
  .kpi{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
  .kpi>div span{font-size:11px;color:#9ca3af;font-weight:700;text-transform:uppercase}
  .kpi>div div{font-size:22px;font-weight:800;color:var(--green)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mv-top-main">
  <div class="mv-top-left">
    <a href="index.html" class="mv-top-logo"><img src="Mamavege_Logo.png" alt="MamaVege"></a>
    <div class="mv-top-sep"></div>
    <span class="mv-top-tool">🎵 抖店数据导入</span>
  </div>
  <a href="china-dashboard.html" class="mv-top-back">← 返回中国仪表板</a>
</div>

<div class="wrap">
  <div class="page-title">抖店数据导入</div>
  <div class="page-sub">支持两种文件，系统自动识别：<span class="tag compass">罗盘·成交分析</span>（SKU/达人/复购）与 <span class="tag order">订单明细</span>（单笔+省份）。软著审核期间的过渡方案。</div>

  <div class="card">
    <div class="card-title">① 从哪里导出</div>
    <div class="steps">
      <b>罗盘·成交分析</b>（推荐）：抖店后台 → 电商罗盘 → 成交分析 → 右上「下载数据」→ 得到「抖音电商罗盘-成交分析-…xlsx」<br>
      <b>订单明细</b>：抖店后台 → 订单 → 订单管理 → 导出 → 到导出记录下载<br>
      两种都直接拖到下面即可，系统会自动分辨。
    </div>
  </div>

  <div class="card">
    <div class="card-title">② 上传文件</div>
    <div class="drop" id="drop">
      <div class="drop-icon">📄</div>
      <div style="font-weight:700;margin-bottom:4px">点击选择 或 拖拽 Excel/CSV</div>
      <div style="font-size:12px;color:var(--muted)">支持 .xlsx / .xls / .csv</div>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
    <div id="fileMsg"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div id="resultBody"></div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn" id="importBtn" onclick="doImport()">✓ 确认导入</button>
      <button class="btn sec" onclick="location.reload()">取消/换文件</button>
    </div>
    <div id="importMsg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wjhgezvrxlhpexocfsea.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE';

const drop = document.getElementById('drop'), fileInput = document.getElementById('file');
drop.onclick = ()=>fileInput.click();
drop.ondragover = e=>{e.preventDefault();drop.classList.add('over');};
drop.ondragleave = ()=>drop.classList.remove('over');
drop.ondrop = e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);};
fileInput.onchange = e=>{if(e.target.files[0])handleFile(e.target.files[0]);};

let importMode = null;   // 'compass' | 'order'
let importPayload = null; // {table, records}

function handleFile(file){
  const fm = document.getElementById('fileMsg');
  fm.innerHTML = `<div class="msg info">正在解析 <b>${escH(file.name)}</b>…</div>`;
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      let wb;
      if(isCsv){
        // CSV 多为 UTF-8（抖店导出带 BOM），按文本读避免编码误判
        let txt = e.target.result;
        if(txt.charCodeAt(0)===0xFEFF) txt = txt.slice(1);
        wb = XLSX.read(txt, {type:'string'});
      } else {
        wb = XLSX.read(e.target.result, {type:'array'});
      }
      const names = wb.SheetNames;
      if(names.includes('成交概览') || names.includes('商品构成') || names.includes('账号构成')){
        parseCompass(wb, fm);
      } else {
        parseOrders(wb, fm);
      }
    }catch(err){ fm.innerHTML = `<div class="msg err">解析失败：${escH(err.message)}</div>`; }
  };
  if(isCsv) reader.readAsText(file, 'UTF-8'); else reader.readAsArrayBuffer(file);
}

// 抖店商家编码/规格 → 内部SKU名（与仪表板一致）
function mapDouyinSku(code, spec, title){
  code = String(code||'').replace(/\t/g,'').trim().replace(/^0+/,'');
  const M = {'9555988500819-3':'香椿干盘面 3袋装','9555988500819-6':'香椿干盘面 6袋装','9555988500819-32':'香椿干盘面 32袋装','955988501076-3':'青柠干盘面 3袋装','955988501076-6':'青柠干盘面 6袋装','955988501051-3':'香椿杯面 3杯装','955988501051-6':'香椿杯面 6杯装','955988501052-3':'青柠杯面 3杯装','955988501052-6':'青柠杯面 6杯装','955988501052-33':'混合装（香椿杯面3+青柠杯面3）'};
  if(M[code]) return M[code];
  const s = String(spec||'').replace(/\t/g,'').trim();
  if(/香椿摇摇面.*青柠/.test(s)) return '混合装（香椿杯面3+青柠杯面3）';
  if(/香椿摇摇面/.test(s)) return '香椿杯面 '+(/6[桶盒]/.test(s)?'6':'3')+'杯装';
  if(/青柠.*摇摇面/.test(s)) return '青柠杯面 '+(/6[桶盒]/.test(s)?'6':'3')+'杯装';
  const p=(s.match(/(\d+)袋/)||[])[1]||'?';
  if(/青柠|辣椒/.test(s)) return '青柠干盘面 '+p+'袋装';
  if(/袋|原味/.test(s)) return '香椿干盘面 '+p+'袋装';
  return String(title||spec||'未知').replace(/\t/g,'').trim().slice(0,20);
}

// ── 表头名 → 列号 ──
function headIndex(rows){
  const h = rows[0].map(x=>String(x).trim());
  const find = (...keys)=> h.findIndex(x=> keys.some(k=> x===k)) ;
  const findLoose = (...keys)=> h.findIndex(x=> keys.some(k=> x.includes(k)));
  return {h, find, findLoose};
}
function ymd(s){ s=String(s).replace(/\D/g,''); return s.length>=8 ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : null; }
function num(v){ return parseFloat(String(v).replace(/[^0-9.\-]/g,''))||0; }
// 日期→ISO（视为北京时间 UTC+8）。兼容 XLSX 美式格式化「6/30/26」与标准「2026-06-30 14:30:22」
function toISO(v){
  if(v==null||v==='') return null;
  let s=String(v).trim(); if(!s) return null;
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m){ let yr=+m[3]; if(yr<100)yr+=2000; const d=new Date(Date.UTC(yr,+m[1]-1,+m[2],+(m[4]||0),+(m[5]||0),+(m[6]||0))-8*3600000); return isNaN(d)?null:d.toISOString(); }
  s=s.replace(/\//g,'-'); const d=new Date(s.includes('T')?s:s.replace(' ','T')+'+08:00'); return isNaN(d)?null:d.toISOString();
}

// ── 罗盘·成交分析 ──
function parseCompass(wb, fm){
  const records = [];
  const sheet = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:''}) : null;

  // 成交概览：取 载体类型=全部 且 投放时段=不限 的每日总计
  let ov = sheet('成交概览'), ovDays=0;
  if(ov && ov.length>1){
    const {find,findLoose} = headIndex(ov);
    const iCarrier=find('载体类型'), iSlot=find('投放时段'), iDate=find('日期');
    const iGmv=find('用户支付金额'), iOrd=find('成交订单数'), iUnit=find('成交件数'), iAov=find('客单价');
    ov.slice(1).forEach(r=>{
      if(String(r[iCarrier]).trim()!=='全部') return;
      if(iSlot>=0 && String(r[iSlot]).trim()!=='不限') return;
      const d = ymd(r[iDate]); if(!d) return;
      records.push({ dim:'overview', ymd:d, name:'', gmv:num(r[iGmv]), orders:num(r[iOrd]), units:num(r[iUnit]), commission:0, extra:{客单价:num(r[iAov])} });
      ovDays++;
    });
  }

  // 商品构成：取 载体类型=全部，按日+商品
  let pd = sheet('商品构成'), prodCount=0; const prodSet=new Set();
  if(pd && pd.length>1){
    const {find} = headIndex(pd);
    const iCarrier=find('载体类型'), iDate=find('日期'), iName=find('商品名称'), iGmv=find('用户支付金额'), iAvg=find('成交笔单价');
    pd.slice(1).forEach(r=>{
      if(iCarrier>=0 && String(r[iCarrier]).trim()!=='全部') return;
      const d = ymd(r[iDate]); if(!d) return;
      const name = String(r[iName]).trim(); if(!name) return;
      records.push({ dim:'product', ymd:d, name, gmv:num(r[iGmv]), orders:0, units:0, commission:0, extra:{成交笔单价:num(r[iAvg])} });
      prodSet.add(name); prodCount++;
    });
  }

  // 账号构成：按日+达人
  let ac = sheet('账号构成'), talentCount=0; const talentSet=new Set();
  if(ac && ac.length>1){
    const {find,findLoose} = headIndex(ac);
    const iDate=find('日期'), iName=find('账号名称'), iCoop=find('自营/合作'), iDy=find('抖音号');
    const iGmv=find('用户支付金额'), iOrd=find('成交订单数'), iUnit=find('成交件数'), iAov=find('客单价');
    const iComm=findLoose('达人佣金');
    ac.slice(1).forEach(r=>{
      const d = ymd(r[iDate]); if(!d) return;
      const name = String(r[iName]).trim(); if(!name) return;
      records.push({ dim:'talent', ymd:d, name, gmv:num(r[iGmv]), orders:num(r[iOrd]), units:num(r[iUnit]),
        commission: iComm>=0?num(r[iComm]):0, extra:{ 合作:String(r[iCoop]||'').trim(), 抖音号:String(r[iDy]||'').trim(), 客单价:num(r[iAov]) } });
      talentSet.add(name); talentCount++;
    });
  }

  importMode='compass'; importPayload={ table:'douyin_compass', records };

  // 汇总预览
  const sum = dim => records.filter(r=>r.dim===dim).reduce((s,r)=>s+r.gmv,0);
  const topProd = aggTop(records.filter(r=>r.dim==='product'), 6);
  const topTal = aggTop(records.filter(r=>r.dim==='talent'), 8, true);
  fm.innerHTML = `<div class="msg ok">✓ 识别为 <span class="tag compass">罗盘·成交分析</span>：总览 ${ovDays} 天、商品 ${prodSet.size} 个、达人 ${talentSet.size} 个</div>`;
  document.getElementById('resultCard').style.display='block';
  document.getElementById('resultBody').innerHTML = `
    <div class="kpi">
      <div><span>期间 GMV（总览）</span><div>¥${sum('overview').toLocaleString('zh-CN',{maximumFractionDigits:0})}</div></div>
      <div><span>商品数</span><div style="color:var(--text)">${prodSet.size}</div></div>
      <div><span>达人数</span><div style="color:var(--text)">${talentSet.size}</div></div>
    </div>
    <div class="grid2">
      <div><div class="card-title">🍜 商品 GMV 排行 TOP6</div><table><thead><tr><th>商品</th><th class="num">GMV</th></tr></thead><tbody>${topProd}</tbody></table></div>
      <div><div class="card-title">🤝 达人贡献 TOP8</div><table><thead><tr><th>达人</th><th class="num">GMV</th><th class="num">单</th><th class="num">佣金</th></tr></thead><tbody>${topTal}</tbody></table></div>
    </div>`;
}
function aggTop(rows, n, talent){
  const m={};
  rows.forEach(r=>{ if(!m[r.name])m[r.name]={gmv:0,orders:0,comm:0}; m[r.name].gmv+=r.gmv; m[r.name].orders+=r.orders; m[r.name].comm+=r.commission; });
  return Object.entries(m).sort((a,b)=>b[1].gmv-a[1].gmv).slice(0,n).map(([k,d])=>
    talent ? `<tr><td>${escH(k)}</td><td class="num">${d.gmv.toFixed(0)}</td><td class="num">${d.orders}</td><td class="num">${d.comm.toFixed(2)}</td></tr>`
           : `<tr><td style="max-width:280px">${escH(k)}</td><td class="num">${d.gmv.toFixed(0)}</td></tr>`
  ).join('') || `<tr><td colspan="4" style="color:#9ca3af">无</td></tr>`;
}

// ── 订单明细 ──
const FIELD_HINTS = {
  order_id:['主订单编号','订单号','订单编号','子订单编号'], pay_time:['支付完成时间','支付时间','订单提交时间','付款时间','成交时间','下单时间'],
  status:['订单状态','售后状态','状态'], revenue:['订单应付金额','用户实际支付金额','用户支付金额','订单实付金额','实付金额'],
  title:['选购商品','商品名称','商品标题'], spec:['商品规格','规格','商品属性'], qty:['商品数量','成交件数','购买数量','件数','数量'],
  price:['商品单价','单价'], sku_code:['商家编码','商品编码','规格编码'], pay_time2:['订单提交时间','下单时间','成交时间'],
  province:['省','收件人所在省','收货省份'], source_name:['达人昵称','推广者昵称','推广者','带货达人','作者昵称','流量来源'],
};
function parseOrders(wb, fm){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
  let hi=0; for(let i=0;i<Math.min(5,json.length);i++){ if(json[i].filter(c=>String(c).trim()).length>json[hi].filter(c=>String(c).trim()).length) hi=i; }
  const headers = json[hi].map(h=>String(h).trim());
  const rows = json.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));
  const norm=s=>String(s).toLowerCase().replace(/\s/g,''); const map={}, used=new Set();
  // 提示按顺序优先（达人昵称 优先于 流量来源，不受列位置影响）；三档精度全局精确优先
  for(const tier of ['exact','starts','includes']) for(const [f,hints] of Object.entries(FIELD_HINTS)){
    if(map[f]!=null) continue;
    let found=-1;
    for(const k of hints){ const kn=norm(k);
      const idx=headers.findIndex((h,i)=>{ if(used.has(i))return false; const hn=norm(h); return tier==='exact'?hn===kn:tier==='starts'?hn.startsWith(kn):hn.includes(kn); });
      if(idx>=0){ found=idx; break; }
    }
    if(found>=0){ map[f]=found; used.add(found); }
  }
  const g=(r,f)=> map[f]!=null?String(r[map[f]]??'').trim():'';
  let parsed = rows.map(r=>{
    const rev=num(g(r,'revenue')), qty=parseInt(num(g(r,'qty')))||1;
    const unit=num(g(r,'price'))|| (qty?+(rev/qty).toFixed(2):rev);
    const spec=g(r,'spec'), code=g(r,'sku_code'), title=g(r,'title');
    const iso = toISO(g(r,'pay_time')) || toISO(g(r,'pay_time2'));
    return { order_id:g(r,'order_id'), pay_time: iso, status:g(r,'status')||null, revenue:rev,
      products:[{title, spec, sku_code:code, internal_sku:mapDouyinSku(code,spec,title), qty, price:unit}],
      province:g(r,'province')||null, source_name:g(r,'source_name')||'自然流量' };
  }).filter(r=>r.order_id);
  // 合并同主订单
  const mm={}; parsed.forEach(r=>{ if(!mm[r.order_id])mm[r.order_id]={...r,products:[...r.products]}; else {mm[r.order_id].products.push(...r.products); mm[r.order_id].revenue+=r.revenue;} });
  parsed=Object.values(mm).map(r=>({...r, imported_at:new Date().toISOString()}));

  importMode='order'; importPayload={ table:'douyin_orders', records:parsed };
  const missing=['order_id','pay_time','revenue'].filter(f=>map[f]==null);
  fm.innerHTML = `<div class="msg ok">✓ 识别为 <span class="tag order">订单明细</span>：${parsed.length} 笔订单</div>`
    + (missing.length?`<div class="msg err">缺少必要列：${missing.join('、')}，请检查文件是否为订单导出</div>`:'');
  document.getElementById('resultCard').style.display='block';
  const head=['订单编号','支付时间','状态','实付','内部SKU（规格）','单价','省份','达人/来源'];
  document.getElementById('resultBody').innerHTML = `<div class="card-title">数据预览（前8笔 / 共 ${parsed.length}）</div><div style="overflow-x:auto"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
    + parsed.slice(0,8).map(r=>{ const p0=r.products[0]||{}; return `<tr><td>${escH(r.order_id)}</td><td>${escH((r.pay_time||'').slice(0,10))}</td><td>${escH(r.status||'')}</td><td class="num">${r.revenue.toFixed(2)}</td><td style="max-width:220px">${escH(r.products.map(p=>`${p.internal_sku||''}（${p.spec||''}）×${p.qty}`).join('；'))}</td><td class="num">${(p0.price||0).toFixed(2)}</td><td>${escH(r.province||'')}</td><td>${escH(r.source_name)}</td></tr>`; }).join('')
    + `</tbody></table></div>`;
}

async function doImport(){
  const btn=document.getElementById('importBtn'), msg=document.getElementById('importMsg');
  if(!importPayload || !importPayload.records.length){ msg.innerHTML=`<div class="msg err">没有可导入的数据</div>`; return; }
  const {table, records} = importPayload;
  const conflict = table==='douyin_compass' ? 'dim,ymd,name' : 'order_id';
  btn.disabled=true; msg.innerHTML=`<div class="msg info">正在导入 ${records.length} 条…</div>`;
  try{
    let done=0;
    for(let i=0;i<records.length;i+=300){
      const batch=records.slice(i,i+300);
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`,{
        method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
        body: JSON.stringify(batch) });
      if(!r.ok) throw new Error(await r.text());
      done+=batch.length;
    }
    msg.innerHTML=`<div class="msg ok">✅ 成功导入 ${done} 条！<a href="china-dashboard.html" style="color:var(--green);font-weight:700">→ 去仪表板查看</a></div>`;
  }catch(err){ btn.disabled=false; msg.innerHTML=`<div class="msg err">导入失败：${escH(err.message)}</div>`; }
}
function escH(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
