<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MamaVege AI 管理团队</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --surface2: #1c2030;
      --border: #252a3a;
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --text-dim: #9ca3af;

      --xuanxuan: #6366f1;
      --xiaoxiao: #10b981;
      --qianqian: #f59e0b;
      --chongchong: #ec4899;
      --shunshun: #8b5cf6;
      --diandian: #06b6d4;
      --longlong: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
    }
    .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-title h1 {
      font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
    }
    .header-title p {
      font-size: 12px; color: var(--text-muted); margin-top: 1px;
    }
    .header-status {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 73px);
    }

    /* ── Sidebar — Director Cards ── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 12px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      text-transform: uppercase;
      padding: 4px 8px 8px;
    }

    .director-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      position: relative;
    }
    .director-card:hover {
      background: var(--surface2);
      border-color: var(--border);
    }
    .director-card.active {
      background: var(--surface2);
      border-color: var(--active-color, #6366f1);
    }
    .director-card.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--active-color, #6366f1);
    }

    .director-avatar {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .director-info { flex: 1; min-width: 0; }
    .director-name {
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .director-role {
      font-size: 11px; color: var(--text-muted);
      margin-top: 1px;
    }
    .director-badge {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Chat Area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Director Header */
    .chat-header {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
    }
    .chat-header-avatar {
      width: 46px; height: 46px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .chat-header-info h2 {
      font-size: 16px; font-weight: 700;
    }
    .chat-header-info p {
      font-size: 12px; color: var(--text-muted); margin-top: 2px;
    }
    .chat-header-actions {
      margin-left: auto;
      display: flex; gap: 8px;
    }
    .btn-icon {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Welcome Screen */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      padding: 32px;
      text-align: center;
    }
    .welcome-emoji { font-size: 48px; margin-bottom: 8px; }
    .welcome h3 { font-size: 18px; font-weight: 600; color: var(--text-dim); }
    .welcome p { font-size: 14px; max-width: 380px; line-height: 1.6; }

    /* Quick Prompts */
    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      border-color: var(--active-color, #6366f1);
      color: var(--text);
    }

    /* Message Bubbles */
    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
    }
    .message.user {
      flex-direction: row-reverse;
      align-self: flex-end;
    }
    .message-avatar {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      align-self: flex-start;
    }
    .message.user .message-avatar {
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-dim);
    }
    .message-content {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.7;
      max-width: calc(100% - 48px);
    }
    .message.user .message-content {
      background: var(--surface);
      border-color: var(--border);
    }
    .message-content p { margin: 0 0 8px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content strong { color: var(--text); }
    .message-content ul, .message-content ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .message-content li { margin: 3px 0; }
    .message-content pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      font-size: 12px;
      margin: 8px 0;
    }
    .message-content code {
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }

    /* Loading indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 6px 2px;
      align-items: center;
    }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.2s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Data loading badge */
    .data-loading-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .data-loading-badge .spin {
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Input Area */
    .input-area {
      padding: 16px 28px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.15s;
    }
    .input-wrapper:focus-within {
      border-color: var(--active-color, #6366f1);
    }
    #chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      min-height: 24px;
    }
    #chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 36px; height: 36px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all 0.15s;
      flex-shrink: 0;
      background: var(--active-color, #6366f1);
      color: white;
    }
    .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text);
      z-index: 1000;
      transform: translateY(10px);
      opacity: 0;
      transition: all 0.25s ease;
      max-width: 300px;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast.error { border-color: #ef4444; }
    .toast.success { border-color: #10b981; }

    /* Scrollbar for sidebar */
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Mobile responsive */
    @media (max-width: 640px) {
      .sidebar { width: 200px; min-width: 200px; }
      .messages { padding: 16px; }
      .input-area { padding: 12px 16px 20px; }
      .chat-header { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🥗</div>
  <div class="header-title">
    <h1>MamaVege AI 管理团队</h1>
    <p>7 个 AI 总监 · 实时 Supabase 数据</p>
  </div>
  <div class="header-status">
    <div class="status-dot"></div>
    <span id="connection-status">连接中...</span>
  </div>
</header>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-label">AI 管理团队</div>
    <!-- Cards injected by JS -->
  </aside>

  <!-- Chat Area -->
  <section class="chat-area">

    <!-- Director Header -->
    <div class="chat-header" id="chat-header">
      <div class="chat-header-avatar" id="header-avatar" style="background: #1c2030">🤖</div>
      <div class="chat-header-info">
        <h2 id="header-name">选择 AI 总监</h2>
        <p id="header-desc">从左侧选择一个 AI 总监开始对话</p>
      </div>
      <div class="chat-header-actions">
        <button class="btn-icon" onclick="clearChat()" title="清空对话">🗑️ 清空</button>
        <button class="btn-icon" onclick="refreshData()" title="刷新数据" id="refresh-btn">🔄 刷新数据</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome-screen">
        <div class="welcome-emoji">👋</div>
        <h3>你好，HQ！</h3>
        <p>选择左侧任意 AI 总监，直接提问即可。<br/>每次回答前会自动读取最新 Supabase 数据。</p>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="chat-input"
          placeholder="问 AI 总监任何问题..."
          rows="1"
          disabled
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➤</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>

  </section>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Scripts -->
<script type="module">
  import AI_TEAM from './js/ai-team-prompts.js';
  import { fetchDataForRole, formatDataAsContext } from './js/ai-team-data.js';

  // ── State ──
  let activeDirector = null;
  let conversationHistory = {};  // roleId -> [{role, content}]
  let isLoading = false;
  let cachedData = {};           // roleId -> { data, timestamp }
  const CACHE_TTL = 60 * 1000;  // 1 minute cache

  // ── Init ──
  window.addEventListener('DOMContentLoaded', () => {
    renderSidebar();
    testSupabaseConnection();
  });

  function renderSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const label = sidebar.querySelector('.sidebar-label');

    Object.values(AI_TEAM).forEach(director => {
      const card = document.createElement('div');
      card.className = 'director-card';
      card.id = `card-${director.id}`;
      card.style.setProperty('--active-color', director.color);
      card.onclick = () => selectDirector(director.id);
      card.innerHTML = `
        <div class="director-avatar" style="background: ${director.color}22">
          ${director.emoji}
        </div>
        <div class="director-info">
          <div class="director-name">
            ${director.name}
            <span style="font-size:11px; font-weight:400; color:${director.color}">
              ${director.title}
            </span>
          </div>
          <div class="director-role">${director.description}</div>
        </div>
        <div class="director-badge" style="background: ${director.color}"></div>
      `;
      sidebar.appendChild(card);

      // Init conversation history
      conversationHistory[director.id] = [];
    });
  }

  async function testSupabaseConnection() {
    const statusEl = document.getElementById('connection-status');
    try {
      const resp = await fetch(
        'https://wjhgezvrxlhpexocfsea.supabase.co/rest/v1/sales_orders?limit=1',
        {
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE',
          }
        }
      );
      if (resp.ok) {
        statusEl.textContent = 'Supabase 已连接';
        statusEl.style.color = '#10b981';
      } else {
        statusEl.textContent = 'Supabase 连接异常';
        statusEl.style.color = '#f59e0b';
      }
    } catch (e) {
      statusEl.textContent = '无法连接 Supabase';
      statusEl.style.color = '#ef4444';
    }
  }

  // ── Select Director ──
  window.selectDirector = function(id) {
    activeDirector = AI_TEAM[id];

    // Update sidebar active state
    document.querySelectorAll('.director-card').forEach(c => c.classList.remove('active'));
    const card = document.getElementById(`card-${id}`);
    card.classList.add('active');
    card.style.setProperty('--active-color', activeDirector.color);

    // Update header
    document.getElementById('header-avatar').textContent = activeDirector.emoji;
    document.getElementById('header-avatar').style.background = `${activeDirector.color}22`;
    document.getElementById('header-name').textContent = `${activeDirector.name} · ${activeDirector.title}`;
    document.getElementById('header-desc').textContent = activeDirector.description;

    // Update input color
    document.querySelector('.input-wrapper').style.setProperty('--active-color', activeDirector.color);
    document.querySelector('.send-btn').style.background = activeDirector.color;

    // Enable input
    document.getElementById('chat-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('chat-input').placeholder = `问 ${activeDirector.name}...`;
    document.getElementById('chat-input').focus();

    // Render messages
    renderMessages();
  };

  function renderMessages() {
    const container = document.getElementById('messages');
    const history = conversationHistory[activeDirector.id];

    if (history.length === 0) {
      container.innerHTML = getWelcomeScreen();
    } else {
      container.innerHTML = '';
      history.forEach(msg => appendMessage(msg.role, msg.content));
    }
  }

  function getWelcomeScreen() {
    const quickPrompts = getQuickPrompts(activeDirector.id);
    const promptsHtml = quickPrompts.map(p =>
      `<button class="quick-btn" onclick="useQuickPrompt('${escapeHtml(p)}')">${p}</button>`
    ).join('');

    return `
      <div class="welcome">
        <div class="welcome-emoji">${activeDirector.emoji}</div>
        <h3>你好！我是${activeDirector.name}</h3>
        <p style="color: ${activeDirector.color}; font-weight:600">${activeDirector.title}</p>
        <p style="margin-top:6px">${activeDirector.description}</p>
        <div class="quick-prompts" style="--active-color: ${activeDirector.color}">
          ${promptsHtml}
        </div>
      </div>
    `;
  }

  function getQuickPrompts(id) {
    const prompts = {
      xuanxuan: ['给我今天的简报', '有哪些未提交报告？', '本月目标达成率？', '今天必做的3件事'],
      xiaoxiao: ['本月各人业绩进度', 'KPM vs 上月对比', 'MT客户本月状况', '新人Chris/Chin/Raymond表现'],
      qianqian: ['7-Eleven这个月亏了多少？', '各客户margin排名', '有没有margin跌破10%的客户？', '本月财务总结'],
      chongchong: ['帮我写Kampua Mee文案', '针对荤食者的推广方向', '本月促销活动ROI', '7-Eleven/MYNEWS推广建议'],
      shunshun: ['哪些产品快到期？', '各销售员拜访次数排名', 'Wan巡店进度', '有哪些逾期任务？'],
      diandian: ['电商本月总业绩', 'Shopee vs TikTok对比', '重点SKU电商表现', '下月电商策略建议'],
      longlong: ['Jason本月中国市场进度', '各渠道贡献比例', '博主合作效果如何？', '下月中国策略建议'],
    };
    return prompts[id] || ['帮我分析一下', '本月总结', '有什么需要注意的？'];
  }

  window.useQuickPrompt = function(text) {
    document.getElementById('chat-input').value = text;
    sendMessage();
  };

  // ── Send Message ──
  window.sendMessage = async function() {
    if (!activeDirector || isLoading) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    // Hide welcome, add user message
    document.getElementById('messages').innerHTML = '';
    conversationHistory[activeDirector.id].push({ role: 'user', content: text });
    renderMessages();

    // Add typing indicator
    const typingId = addTypingIndicator();

    try {
      // Step 1: Fetch Supabase data
      updateTyping(typingId, '正在读取 Supabase 数据...');
      const data = await getDataWithCache(activeDirector.id);
      const dataContext = formatDataAsContext(data);

      // Step 2: Build messages for Claude
      const history = conversationHistory[activeDirector.id];
      const messages = history.map(m => ({ role: m.role, content: m.content }));

      // Inject data context into last user message
      messages[messages.length - 1].content = text + dataContext;

      updateTyping(typingId, `${activeDirector.name} 正在思考...`);

      // Step 3: Call Claude via API route
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system: activeDirector.systemPrompt,
          messages: messages,
        }),
      });

      removeTyping(typingId);

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error || 'API error');
      }

      const result = await response.json();
      const reply = result.response;

      // Save and render reply
      conversationHistory[activeDirector.id].push({ role: 'assistant', content: reply });
      renderMessages();
      scrollToBottom();

    } catch (error) {
      removeTyping(typingId);
      console.error('Error:', error);
      showToast(`错误：${error.message}`, 'error');
      // Remove failed user message
      conversationHistory[activeDirector.id].pop();
      renderMessages();
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  };

  async function getDataWithCache(roleId) {
    const cache = cachedData[roleId];
    const now = Date.now();
    if (cache && (now - cache.timestamp) < CACHE_TTL) {
      return cache.data;
    }
    const data = await fetchDataForRole(roleId);
    cachedData[roleId] = { data, timestamp: now };
    return data;
  }

  window.refreshData = async function() {
    if (!activeDirector) return;
    cachedData[activeDirector.id] = null;
    showToast('数据已刷新 ✓', 'success');
  };

  window.clearChat = function() {
    if (!activeDirector) return;
    conversationHistory[activeDirector.id] = [];
    renderMessages();
  };

  // ── Message Rendering ──
  function appendMessage(role, content) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatarContent = role === 'user' ? 'HQ' : activeDirector.emoji;
    const avatarStyle = role === 'assistant'
      ? `background: ${activeDirector.color}22`
      : '';

    div.innerHTML = `
      <div class="message-avatar" style="${avatarStyle}">${avatarContent}</div>
      <div class="message-content">${markdownToHtml(content)}</div>
    `;
    container.appendChild(div);
  }

  function markdownToHtml(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```[\s\S]*?```/g, m => `<pre><code>${m.slice(3, -3).replace(/^[a-z]+\n/, '')}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/^### (.*$)/gm, '<h4>$1</h4>')
      .replace(/^## (.*$)/gm, '<h3>$1</h3>')
      .replace(/^# (.*$)/gm, '<h2>$1</h2>')
      .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(?!<[h|u|l|p])(.+)$/gm, '<p>$1</p>')
      .replace(/<p><\/p>/g, '');
  }

  function addTypingIndicator() {
    const id = 'typing-' + Date.now();
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.id = id;
    div.className = 'message assistant';
    div.innerHTML = `
      <div class="message-avatar" style="background: ${activeDirector.color}22">${activeDirector.emoji}</div>
      <div class="message-content">
        <div class="data-loading-badge" id="loading-badge-${id}">
          <span class="spin">⟳</span> 正在加载数据...
        </div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
    container.appendChild(div);
    scrollToBottom();
    return id;
  }

  function updateTyping(id, text) {
    const badge = document.getElementById(`loading-badge-${id}`);
    if (badge) badge.innerHTML = `<span class="spin">⟳</span> ${text}`;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function scrollToBottom() {
    const container = document.getElementById('messages');
    setTimeout(() => container.scrollTop = container.scrollHeight, 50);
  }

  function escapeHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  // ── Toast ──
  function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast ${type} show`;
    setTimeout(() => toast.className = 'toast', 3000);
  }

  // ── Keyboard ──
  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
</script>

</body>
</html>
