<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MamaVege AI Team</title>
  <script>
    // HQ only — 没登录或不是 HQ 跳回主页
    (function() {
      function lsGet(key) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return null;
          const item = JSON.parse(raw);
          if (Date.now() > item.expiry) { localStorage.removeItem(key); return null; }
          return item.value;
        } catch { return null; }
      }
      const role = lsGet('userRole');
      const name = lsGet('userName');
      if (!name || role !== 'hq') {
        window.location.href = '/';
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface2: #f3f4f6;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --text-dim: #374151;
      --accent: #166534;
      --accent-light: #dcfce7;
      --accent-hover: #14532d;
      --danger: #dc2626;
      --danger-light: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #166534, #16a34a);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-title h1 { font-size: 16px; font-weight: 700; }
    .header-title p { font-size: 11px; color: var(--text-muted); }
    .header-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 12px;
    }
    .status-pill {
      font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 20px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #166534;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 65px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px; min-width: 240px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-top {
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 1.2px; color: var(--text-muted);
      text-transform: uppercase; padding: 0 4px 8px;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      flex: 1; padding: 6px 4px;
      border: none; border-radius: 6px;
      cursor: pointer; font-size: 11px; font-weight: 600;
      font-family: inherit;
      color: var(--text-muted);
      background: transparent;
      transition: all .15s;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: #166534;
      color: #ffffff;
      border: 1px solid #166534;
    }

    /* Multi-select hint */
    .multi-hint {
      font-size: 11px; color: var(--text-muted);
      padding: 6px 4px 0;
      display: none;
    }
    .multi-hint.show { display: block; }

    /* Director cards */
    .directors-list {
      flex: 1; overflow-y: auto;
      padding: 10px 10px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .directors-list::-webkit-scrollbar { width: 3px; }
    .directors-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .director-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
      position: relative;
      user-select: none;
    }
    .director-card:hover { background: var(--surface2); border-color: var(--border); }

    /* Single mode active */
    .director-card.single-active {
      background: var(--surface2);
      border-color: var(--card-color);
    }
    .director-card.single-active::before {
      content: '';
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; border-radius: 0 2px 2px 0;
      background: var(--card-color);
    }

    /* Multi mode selected */
    .director-card.multi-selected {
      background: var(--surface2);
      border-color: var(--card-color);
    }

    .director-avatar {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .director-info { flex: 1; min-width: 0; }
    .director-name {
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
    }
    .director-title { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    /* Checkbox for multi mode */
    .director-check {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 5px;
      flex-shrink: 0;
      display: none;
      align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      transition: all .15s;
    }
    .multi-mode .director-check { display: flex; }
    .director-card.multi-selected .director-check {
      background: var(--card-color);
      border-color: var(--card-color);
      color: white;
    }

    /* Ask selected button */
    .ask-selected-wrap {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .ask-selected-wrap.show { display: block; }
    .ask-selected-btn {
      width: 100%;
      padding: 9px;
      border: none; border-radius: 8px;
      background: #166534;
      color: white;
      font-size: 13px; font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s;
    }
    .ask-selected-btn:hover { opacity: .85; }
    .ask-selected-btn:disabled { opacity: .4; cursor: not-allowed; }
    .selected-count {
      font-size: 11px; color: var(--text-muted);
      text-align: center; margin-top: 5px;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Chat header */
    .chat-header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .chat-header-avatar {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    /* Multi header — show all selected avatars */
    .multi-avatars {
      display: flex; gap: -8px;
    }
    .multi-avatars span {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; border: 2px solid var(--surface);
      margin-left: -6px;
    }
    .multi-avatars span:first-child { margin-left: 0; }

    .chat-header-info h2 { font-size: 15px; font-weight: 700; }
    .chat-header-info p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .chat-header-actions { margin-left: auto; display: flex; gap: 6px; }
    .btn-icon {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); padding: 6px 10px;
      border-radius: 7px; cursor: pointer; font-size: 12px;
      transition: all .15s; font-family: inherit;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--text-muted); }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Welcome */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: var(--text-muted);
      padding: 32px; text-align: center;
    }
    .welcome-emoji { font-size: 44px; margin-bottom: 4px; }
    .welcome h3 { font-size: 17px; font-weight: 600; color: var(--text-dim); }
    .welcome p { font-size: 13px; max-width: 360px; line-height: 1.6; }
    .quick-prompts {
      display: flex; flex-wrap: wrap; gap: 7px;
      justify-content: center; margin-top: 6px;
    }
    .quick-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); padding: 7px 13px;
      border-radius: 18px; cursor: pointer;
      font-size: 12px; font-family: inherit; transition: all .15s;
    }
    .quick-btn:hover { border-color: #166534; color: #166534; }

    /* Single message */
    .message {
      display: flex; gap: 10px;
      max-width: 820px;
    }
    .message.user { flex-direction: row-reverse; align-self: flex-end; }
    .message-avatar {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0; align-self: flex-start;
    }
    .message.user .message-avatar {
      background: var(--surface2); border: 1px solid var(--border);
      font-size: 12px; color: var(--text-dim);
    }
    .message-content {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 11px; padding: 12px 16px;
      font-size: 13.5px; line-height: 1.75;
      max-width: calc(100% - 44px);
    }
    .message.user .message-content { background: var(--surface); }
    .message-content p { margin: 0 0 7px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content strong { color: var(--text); }
    .message-content ul, .message-content ol { padding-left: 18px; margin: 5px 0; }
    .message-content li { margin: 3px 0; }
    .message-content h3, .message-content h4 {
      margin: 10px 0 5px; color: var(--text);
    }
    .message-content code {
      background: var(--bg); padding: 1px 5px;
      border-radius: 4px; font-size: 12px; font-family: monospace;
    }
    .message-content pre {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px; overflow-x: auto;
      font-size: 12px; margin: 7px 0;
    }

    /* ── Multi-response block ── */
    .multi-response-block {
      display: flex; flex-direction: column; gap: 12px;
      max-width: 100%;
    }

    /* User message in multi mode */
    .multi-user-msg {
      display: flex; gap: 10px;
      flex-direction: row-reverse; align-self: flex-end;
    }
    .multi-user-msg .message-avatar {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface2); border: 1px solid var(--border);
      font-size: 12px; color: var(--text-dim); flex-shrink: 0;
    }
    .multi-user-msg .message-content {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 11px; padding: 12px 16px;
      font-size: 13.5px; line-height: 1.75;
    }

    /* Director responses grid */
    .director-responses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 12px;
    }
    .director-response-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .director-response-header {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600;
    }
    .director-response-header span { font-size: 18px; }
    .director-response-header .title-tag {
      font-size: 10px; font-weight: 400;
      padding: 2px 7px; border-radius: 10px;
      margin-left: auto;
    }
    .director-response-body {
      padding: 14px;
      font-size: 13px; line-height: 1.75;
      color: var(--text);
    }
    .director-response-body p { margin: 0 0 7px; }
    .director-response-body p:last-child { margin-bottom: 0; }
    .director-response-body strong { color: var(--text); }
    .director-response-body ul, .director-response-body ol {
      padding-left: 18px; margin: 5px 0;
    }
    .director-response-body li { margin: 2px 0; }
    .director-response-body h3, .director-response-body h4 {
      margin: 8px 0 4px; color: var(--text);
    }
    .director-response-body code {
      background: var(--bg); padding: 1px 5px;
      border-radius: 4px; font-size: 12px; font-family: monospace;
    }

    /* Loading card */
    .director-response-card.loading .director-response-body {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-muted); font-size: 12px;
    }
    .typing-indicator {
      display: flex; gap: 4px; align-items: center;
    }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #166534;
      animation: typing 1.2s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes typing {
      0%,60%,100%{transform:translateY(0);opacity:.4}
      30%{transform:translateY(-5px);opacity:1}
    }
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .spin { animation: spin 1s linear infinite; display: inline-block; }

    /* Input area */
    .input-area {
      padding: 14px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-wrapper {
      display: flex; gap: 9px; align-items: flex-end;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 12px;
      transition: border-color .15s;
    }
    .input-wrapper:focus-within { border-color: #166534; }
    #chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: inherit;
      font-size: 13.5px; line-height: 1.5;
      resize: none; max-height: 120px; min-height: 22px;
    }
    #chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: all .15s; flex-shrink: 0;
      background: #166534; color: white;
    }
    .send-btn:hover { opacity: .85; transform: scale(1.05); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .input-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }

    /* Toast */
    .toast {
      position: fixed; bottom: 22px; right: 22px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 9px; padding: 10px 16px;
      font-size: 13px; color: var(--text);
      z-index: 1000; transform: translateY(10px); opacity: 0;
      transition: all .25s; max-width: 280px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: #dc2626; }
    .toast.success { border-color: #166534; }

</style>
</head>
<body>

<div class="mv-top">
  <div class="mv-top-main">
    <div class="mv-top-left">
      <a href="index.html" class="mv-top-logo"><img src="Mamavege_Logo.png" alt="MamaVege"></a>
      <div class="mv-top-sep"></div>
      <span class="mv-top-tool">AI Team</span>

      <a href="index.html" class="mv-top-back">← Hub</a>

<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">AI 管理团队</div>
      <!-- Mode toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-single" onclick="setMode('single')">👤 单问</button>
        <button class="mode-btn" id="btn-multi" onclick="setMode('multi')">👥 多问</button>
      </div>
      <div class="multi-hint" id="multi-hint">勾选要问的总监，再输入问题</div>
    </div>

    <div class="directors-list" id="directors-list">
      <!-- injected by JS -->
    </div>

    <!-- Ask selected button (multi mode) -->
    <div class="ask-selected-wrap" id="ask-selected-wrap">
      <button class="ask-selected-btn" id="ask-selected-btn" onclick="triggerMultiAsk()" disabled>
        问选中的总监
      </button>
      <div class="selected-count" id="selected-count">请勾选至少 1 位总监</div>
    </div>
  </aside>

  <!-- Chat -->
  <section class="chat-area">
    <div class="chat-header" id="chat-header">
      <div class="chat-header-avatar" id="header-avatar" style="background:#f3f4f6">🤖</div>
      <div class="chat-header-info">
        <h2 id="header-name">选择 AI 总监</h2>
        <p id="header-desc">从左侧选择一个或多个 AI 总监</p>
      </div>
      <div class="chat-header-actions">
        <button class="btn-icon" onclick="clearChat()">🗑️ 清空</button>
        <button class="btn-icon" onclick="refreshData()">🔄 刷新数据</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome-screen">
        <div class="welcome-emoji">👋</div>
        <h3>你好，HQ！</h3>
        <p>
          <b>单问模式</b>：左侧点一个总监，直接提问<br/>
          <b>多问模式</b>：切换到"多问"，勾选多个总监同时提问
        </p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="问 AI 总监..." rows="1" disabled></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➤</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// AI TEAM PROMPTS (inline)
// ═══════════════════════════════════════
// ai-team-prompts.js
// MamaVege 7个 AI 总监的 system prompts

const COMPANY_CONTEXT = `
你是 MamaVege (Mama Global International Sdn Bhd) 的 AI 管理团队成员。
公司品牌：MamaVege（马来西亚）/ 妈子素（中国）
成立：2014年，2020年转型生产方便素食食品

产品：方便面、泡面、素食零食、Shakemee（杯装摇摇面，供7-Eleven）、Kampua Mee（KPM）
重要：Kampua Mee 是全马来西亚唯一获得卫生部认证"较健康选择"的面类。

核心销售目标客户：荤食者（不是素食者！）
品牌口号方向：好吃、方便、大众化、一家大小安心吃
绝对不用：健康养生、素食主义语言

年度目标：RM 6,000,000 / 月目标：RM 500,000
YTD（截至6月）：RM 1,915,395 / 达成率：31.9%

重点追踪 SKU：KPM / CLM / SMTS / SMCL

销售团队：

// ── 日期工具 ──
function getDateRanges() {
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const yesterday = new Date(now - 86400000).toISOString().split('T')[0];
  const weekAgo = new Date(now - 7 * 86400000).toISOString().split('T')[0];
  return { today, yesterday, year, month, weekAgo };
}

// ── Supabase 查询 ──
async function supabaseQuery(table, params = '') {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params ? '?' + params : ''}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
      }
    });
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

// ── Google Sheets 数据（主力销售数据）──
async function fetchGoogleSheets() {
  try {
    const r = await fetch(GOOGLE_SHEETS_API);
    const json = await r.json();
    return json.data || [];
  } catch (e) {
    console.warn('Google Sheets fetch failed:', e.message);
    return [];
  }
}

// ── 主数据获取函数 ──
async function fetchCalendar() {
  try {
    const r = await fetch('/api/calendar');
    if (!r.ok) return [];
    const data = await r.json();
    return data.events || [];
  } catch (e) {
    console.warn('Calendar fetch failed:', e.message);
    return [];
  }
}

async function fetchSalesData() {
  const { year, month, yesterday, weekAgo, today } = getDateRanges();

  const [allOrders, visitYesterday, reports, tasks] = await Promise.all([
    fetchGoogleSheets(),
    supabaseQuery('visit_records', `visit_date=gte.${yesterday}&visit_date=lte.${today}&limit=100`),
    supabaseQuery('daily_reports', `date=gte.${yesterday}&limit=20`),
    supabaseQuery('tasks', `limit=50`),
  ]);

  // 筛选本月数据
  const thisMonthOrders = allOrders.filter(r =>
    parseInt(r['YEAR']) === year && parseInt(r['MONTH']) === month
  );

  // 筛选上月数据
  const lastMonth = month === 1 ? 12 : month - 1;
  const lastMonthYear = month === 1 ? year - 1 : year;
  const lastMonthOrders = allOrders.filter(r =>
    parseInt(r['YEAR']) === lastMonthYear && parseInt(r['MONTH']) === lastMonth
  );

  return {
    allOrders,
    thisMonthOrders,
    lastMonthOrders,
    visitYesterday: visitYesterday || [],
    reports: reports || [],
    tasks: tasks || [],
    dateRanges: getDateRanges(),
  };
}

  const thisMonthOrders = allOrders.filter(r =>
    parseInt(r['YEAR']) === year && parseInt(r['MONTH']) === month
  );
  return {
    thisMonthOrders,
    promotions: promotions || [],
    promoActivities: promoActivities || [],
    activities: activities || [],
    activityReports: activityReports || [],
    dateRanges: getDateRanges(),
  };
}

// ── 根据角色返回数据 ──
async function fetchDataForRole(roleId) {
  if (roleId === 'xuanxuan') {
    const [salesData, opsData, cal] = await Promise.all([
      fetchSalesData(), fetchOpsData(), fetchCalendar()
    ]);
    const combined = Object.assign({}, salesData, opsData);
    combined.calendarEvents = cal;  // 明确赋值，不用 spread
    return combined;
  }
  const loaders = {
    xiaoxiao:   fetchSalesData,
    qianqian:   fetchFinanceData,
    chongchong: fetchMarketingData,
    shunshun:   fetchOpsData,
    diandian:   fetchSalesData,
    longlong:   fetchSalesData,
  };
  return await (loaders[roleId] || fetchSalesData)();
}

// ── 格式化数据给 AI 读 ──
function formatDataAsContext(data) {
  const { today, month, year } = getDateRanges();
  let ctx = `\n\n【实时数据 — ${today}】\n`;

  // 本月销售（来自 Google Sheets）
  if (data.thisMonthOrders && data.thisMonthOrders.length > 0) {
    const orders = data.thisMonthOrders;
    const totalSales = orders.reduce((s, r) => s + (parseFloat(r['TOTAL (RM)']) || 0), 0);
    ctx += `\n📊 本月销售（${year}年${month}月）：\n`;
    ctx += `  总销售额：RM ${totalSales.toFixed(2)}\n`;
    ctx += `  订单数：${orders.length} 笔\n`;

    // 按销售员汇总
    const bySP = {};
    orders.forEach(r => {
      const sp = r['SALES PERSON'] || 'Unknown';
      bySP[sp] = (bySP[sp] || 0) + (parseFloat(r['TOTAL (RM)']) || 0);
    });
    ctx += `\n各销售员本月业绩：\n`;
    const targets = { VEGE: 200000, CAROL: 100000, CHRIS: 100000, CHIN: 50000, RAYMOND: 50000 };
    Object.entries(bySP).sort((a, b) => b[1] - a[1]).forEach(([name, amt]) => {
      const target = targets[name.toUpperCase()] || 0;
      const pct = target > 0 ? ((amt / target) * 100).toFixed(1) : '-';
      ctx += `  - ${name}: RM ${amt.toFixed(2)}${target ? ` / 目标 RM ${target.toLocaleString()} (${pct}%)` : ''}\n`;
    });

    // 重点 SKU 本月 vs 上月
    ctx += `\n重点 SKU 本月销量：\n`;
    CORE_SKUS.forEach(sku => {
      const thisQty = orders.reduce((s, r) => s + (parseFloat(r[sku]) || 0), 0);
      const lastQty = (data.lastMonthOrders || []).reduce((s, r) => s + (parseFloat(r[sku]) || 0), 0);
      const trend = thisQty > lastQty ? '↑' : thisQty < lastQty ? '↓' : '→';
      const diff = lastQty > 0 ? (((thisQty - lastQty) / lastQty) * 100).toFixed(1) : '-';
      ctx += `  - ${sku}: ${thisQty} 件 ${trend}（上月 ${lastQty} 件${lastQty > 0 ? `，${diff}%` : ''}）\n`;
    });

    // 按客户汇总 top 5
    const byCompany = {};
    orders.forEach(r => {
      const co = r['COMPANY'] || 'Unknown';
      byCompany[co] = (byCompany[co] || 0) + (parseFloat(r['TOTAL (RM)']) || 0);
    });
    const top5 = Object.entries(byCompany).sort((a, b) => b[1] - a[1]).slice(0, 5);
    ctx += `\nTop 5 客户本月：\n`;
    top5.forEach(([name, amt]) => {
      ctx += `  - ${name}: RM ${amt.toFixed(2)}\n`;
    });

    // MT 客户有没有下单
    const mtClients = ['LOTUS', '7 ELEVEN', 'AEON', 'MYNEWS', 'JAYA GROCER', 'VILLAGE GROCER'];
    const orderedMT = Object.keys(byCompany).map(k => k.toUpperCase());
    const missingMT = mtClients.filter(mt => !orderedMT.some(o => o.includes(mt)));
    if (missingMT.length > 0) {
      ctx += `\n⚠️ 本月还未下单的 MT 客户：${missingMT.join(', ')}\n`;
    }
  } else {
    ctx += `\n本月销售数据：暂无\n`;
  }

  // 昨日拜访（来自 Supabase）
  if (data.visitYesterday && data.visitYesterday.length > 0) {
    const byPerson = {};
    data.visitYesterday.forEach(v => {
      const name = v.rep_name || 'Unknown';
      byPerson[name] = (byPerson[name] || 0) + 1;
    });
    ctx += `\n👣 昨日拜访记录：\n`;
    Object.entries(byPerson).forEach(([n, c]) => ctx += `  - ${n}: ${c} 家\n`);
  } else {
    ctx += `\n👣 昨日拜访：暂无记录\n`;
  }

  // 本周拜访
  if (data.visitRecent && data.visitRecent.length > 0) {
    const byPerson = {};
    data.visitRecent.forEach(v => {
      const name = v.rep_name || 'Unknown';
      byPerson[name] = (byPerson[name] || 0) + 1;
    });
    ctx += `\n本周拜访汇总：\n`;
    Object.entries(byPerson).forEach(([n, c]) => ctx += `  - ${n}: ${c} 次\n`);
  }

  // 日报提交情况
  if (data.reports) {
    const submitted = data.reports.map(r => (r.name || '').toUpperCase());
    const allSales = ['VEGE', 'CAROL', 'CHRIS', 'CHIN', 'RAYMOND'];
    const missing = allSales.filter(n => !submitted.includes(n));
    ctx += `\n📋 昨日日报：\n`;
    ctx += `  已提交：${submitted.length > 0 ? submitted.join(', ') : '无'}\n`;
    ctx += `  未提交：${missing.length > 0 ? missing.join(', ') : '全部已提交 ✅'}\n`;
  }

  // 任务
  if (data.tasks && data.tasks.length > 0) {
    const overdue = data.tasks.filter(t => t.due_date && new Date(t.due_date) < new Date(today));
    const pending = data.tasks.filter(t => !t.status || t.status !== 'completed');
    ctx += `\n📌 任务状态：${pending.length} 个进行中`;
    if (overdue.length > 0) {
      ctx += `，${overdue.length} 个已逾期⚠️\n`;
      overdue.slice(0, 5).forEach(t => {
        ctx += `  - [逾期] ${t.description || t.title}（${t.assigned_to || '-'}）截止 ${t.due_date}\n`;
      });
    } else {
      ctx += `，无逾期 ✅\n`;
    }
  }

  // 促销
  if (data.promotions && data.promotions.length > 0) {
    const active = data.promotions.filter(p => p.status === 'active' || p.is_active);
    if (active.length > 0) {
      ctx += `\n🎯 进行中促销：${active.length} 个\n`;
      active.slice(0, 3).forEach(p => ctx += `  - ${p.name || p.promo_name}: ${p.start_date} ~ ${p.end_date}\n`);
    }
  }

  // 活动报告（Activity Report — Sampling/Roadshow/Exhibition 等）
  if (data.activities && data.activities.length > 0) {
    const acts = data.activities.map(a => {
      const reps = (data.activityReports || []).filter(r => r.activity_id === a.activity_id);
      const rev = reps.reduce((s, r) => s + (r.revenue || 0), 0);
      const cost = reps.reduce((s, r) => s + (r.cost || 0), 0);
      const roas = cost > 0 ? (rev / cost) : 0;
      return { ...a, rev, cost, roas, reportCount: reps.length };
    });
    const activeActs = acts.filter(a => a.status === 'active');
    ctx += `\n🎪 活动报告（Sampling/Roadshow/Exhibition等）：共 ${acts.length} 个，进行中 ${activeActs.length} 个\n`;
    acts.slice(0, 5).forEach(a => {
      const roasStr = a.roas > 0 ? a.roas.toFixed(2) + 'x' : '—';
      ctx += `  - ${a.name}（${a.type}${a.location ? ' · ' + a.location : ''}）：营收 RM ${a.rev.toFixed(2)} / 成本 RM ${a.cost.toFixed(2)} / ROAS ${roasStr} / ${a.status === 'active' ? '进行中' : '已结束'}\n`;
    });
  }

  // ── 钱钱：财务分析（只有财务角色才显示）──
  if (data.isFinanceRole && data.thisMonthOrders) {
    const { year, month } = getDateRanges();
    const thisMonth = data.thisMonthOrders;
    const lastMonth = month === 1
      ? data.allOrders.filter(r => parseInt(r['YEAR']) === year - 1 && parseInt(r['MONTH']) === 12)
      : data.allOrders.filter(r => parseInt(r['YEAR']) === year && parseInt(r['MONTH']) === month - 1);

    const thisTotal = thisMonth.reduce((s, r) => s + (parseFloat(r['TOTAL (RM)']) || 0), 0);
    const lastTotal = lastMonth.reduce((s, r) => s + (parseFloat(r['TOTAL (RM)']) || 0), 0);

    ctx += `\n💰 财务数据：\n`;
    ctx += `  本月总销售：RM ${thisTotal.toFixed(2)}\n`;
    ctx += `  上月总销售：RM ${lastTotal.toFixed(2)}\n`;

    const marginConfig = {
      'LOTUS': { name: "Lotus's", deduction: 13.9 },
      'MYNEWS': { name: 'MYNEWS/MYCU', deduction: 9.0 },
      'AEON': { name: 'AEON', deduction: 10.0 },
      'JAYA GROCER': { name: 'Jaya Grocer', deduction: 6.5 },
      '7 ELEVEN': { name: '7-Eleven', deduction: 61.0, warning: true },
    };
    ctx += `\nMT 客户扣款后净收入：\n`;
    ctx += `  🚨 重要：7-Eleven 是结构性亏损，绝对不能建议提高销量！\n`;
    Object.entries(marginConfig).forEach(([key, cfg]) => {
      const orders = thisMonth.filter(r => (r['COMPANY'] || '').toUpperCase().includes(key));
      const gross = orders.reduce((s, r) => s + (parseFloat(r['TOTAL (RM)']) || 0), 0);
      const net = gross * (1 - cfg.deduction / 100);
      if (gross > 0) {
        const warn = cfg.warning ? ' 🚨 卖越多亏越多！建议：重谈扣款/换产品/重新评估合作' : '';
        ctx += `  - ${cfg.name}: 毛 RM ${gross.toFixed(2)} → 净 RM ${net.toFixed(2)}（扣 ${cfg.deduction}%）${warn}\n`;
      }
    });
  }

  // ── 顺顺：运营数据 ──
  if (data.visitRecent && data.visitRecent.length > 0) {
    const { today } = getDateRanges();
    const byPerson = {};
    data.visitRecent.forEach(v => {
      const name = v.rep_name || 'Unknown';
      byPerson[name] = (byPerson[name] || 0) + 1;
    });
    ctx += `\n👣 本周拜访汇总：\n`;
    const salesTeam = ['VEGE', 'CAROL', 'CHRIS', 'CHIN', 'RAYMOND'];
    salesTeam.forEach(name => {
      const count = byPerson[name] || byPerson[name.toLowerCase()] || 0;
      const warn = count === 0 ? ' ⚠️ 本周零拜访！' : '';
      ctx += `  - ${name}: ${count} 次${warn}\n`;
    });
  }

  if (data.stockChecks && data.stockChecks.length > 0) {
    const low = data.stockChecks.filter(s => s.stock_level === 'low' || s.quantity <= 5);
    if (low.length > 0) {
      ctx += `\n📦 库存告急门店：${low.length} 家\n`;
      low.slice(0, 5).forEach(s => ctx += `  - ${s.outlet_name || s.outlet_id}: ${s.product_code || ''}\n`);
    }
  }

  // ── 日历行程（萱萱专用）──
  if (data.calendarEvents !== undefined) {
    const { today } = getDateRanges();
    const todayStr = today;
    const in3Days = new Date(Date.now() + 3 * 86400000).toISOString().split('T')[0];

    if (data.calendarEvents && data.calendarEvents.length > 0) {
      ctx += `\n📅 未来3天行程：\n`;
      data.calendarEvents.forEach(e => {
        const start = e.start ? new Date(e.start) : null;
        const dateStr = start ? start.toLocaleDateString('zh-MY', { month: 'short', day: 'numeric', weekday: 'short' }) : '-';
        const timeStr = e.allDay ? '全天' : start ? start.toLocaleTimeString('zh-MY', { hour: '2-digit', minute: '2-digit' }) : '';
        const loc = e.location ? ` 📍${e.location}` : '';
        ctx += `  - ${dateStr} ${timeStr}：${e.title}${loc}\n`;
      });
    } else {
      ctx += `\n📅 未来3天行程：暂无行程\n`;
    }
  }

  return ctx;
}

// ── Supabase: 保存一条消息 ──
async function saveMessage(directorId, directorName, role, content) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/ai_conversations`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ director_id: directorId, director_name: directorName, role, content }),
    });
  } catch (e) {
    console.warn('Save message failed:', e.message);
  }
}

// ── Supabase: 读取某个总监的历史记录 ──
async function loadHistory(directorId) {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/ai_conversations?director_id=eq.${directorId}&order=created_at.asc&limit=100`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
        },
      }
    );
    if (!r.ok) return [];
    const data = await r.json();
    return data.map(row => ({ role: row.role, content: row.content }));
  } catch (e) {
    console.warn('Load history failed:', e.message);
    return [];
  }
}

// ── Supabase: 清除某个总监的历史记录 ──
async function clearHistory(directorId) {
  try {
    await fetch(
      `${SUPABASE_URL}/rest/v1/ai_conversations?director_id=eq.${directorId}`,
      {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
        },
      }
    );
  } catch (e) {
    console.warn('Clear history failed:', e.message);
  }
}

// ── Mode switching ──
window.setMode = function(m) {
  mode = m;
  document.getElementById('btn-single').classList.toggle('active', m === 'single');
  document.getElementById('btn-multi').classList.toggle('active', m === 'multi');
  document.getElementById('multi-hint').classList.toggle('show', m === 'multi');
  document.getElementById('ask-selected-wrap').classList.toggle('show', m === 'multi');
  document.getElementById('sidebar').classList.toggle('multi-mode', m === 'multi');

  // Reset selections
  selectedDirectors.clear();
  updateMultiUI();

  // In single mode, re-activate previously selected director
  if (m === 'single') {
    document.querySelectorAll('.director-card').forEach(c => {
      c.classList.remove('multi-selected');
    });
    if (activeDirector) {
      document.getElementById(`card-${activeDirector.id}`)?.classList.add('single-active');
      enableInput(`问 ${activeDirector.name}...`);
    } else {
      disableInput();
    }
    renderSingleMessages();
  } else {
    // multi mode — remove single-active highlights
    document.querySelectorAll('.director-card').forEach(c => {
      c.classList.remove('single-active');
    });
    disableInput();
    updateMultiHeader();
  }

// ── Card click ──

// ── Single mode ──
async function selectSingle(id) {
  activeDirector = AI_TEAM[id];

  document.getElementById(`card-${id}`).classList.add('single-active');

function renderSingleMessages() {

    msgs.innerHTML = getSingleWelcome();
  } else {
    msgs.innerHTML = '';
    history.forEach(m => appendSingleMessage(m.role, m.content));
  }
  scrollToBottom();
}

function getSingleWelcome() {

function appendSingleMessage(role, content) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const avatarContent = role === 'user' ? 'HQ' : activeDirector.emoji;
  const avatarStyle = role === 'assistant' ? `background:${activeDirector.color}22` : '';
  div.innerHTML = `
    <div class="message-avatar" style="${avatarStyle}">${avatarContent}</div>
    <div class="message-content">${md(content)}</div>

// ── Multi mode ──
function toggleMultiSelect(id) {
  const card = document.getElementById(`card-${id}`);
  if (selectedDirectors.has(id)) {
    selectedDirectors.delete(id);
    card.classList.remove('multi-selected');
  } else {
    selectedDirectors.add(id);
    card.classList.add('multi-selected');
  }
  updateMultiUI();
}

function updateMultiUI() {
  const count = selectedDirectors.size;
  const btn = document.getElementById('ask-selected-btn');
  const countEl = document.getElementById('selected-count');

  btn.disabled = count === 0 || isLoading;
  countEl.textContent = count === 0
    ? '请勾选至少 1 位总监'
    : `已选 ${count} 位总监`;

  if (count > 0) {
    const names = [...selectedDirectors].map(id => AI_TEAM[id].name).join('、');
    btn.textContent = `问 ${names}`;
    enableInput('输入问题，问选中的总监...');
    updateMultiHeader();
  } else {
    btn.textContent = '问选中的总监';
    disableInput();
    updateMultiHeader();
  }
}

function updateMultiHeader() {
  const selected = [...selectedDirectors];
  if (selected.length === 0) {
    document.getElementById('header-avatar').textContent = '🤖';
    document.getElementById('header-avatar').style.background = '#f3f4f6';
    document.getElementById('header-name').textContent = '多问模式';
    document.getElementById('header-desc').textContent = '勾选左侧总监，同时向多人提问';
    return;
  }
  const avatars = selected.map(id =>
    `<span style="background:${AI_TEAM[id].color}22">${AI_TEAM[id].emoji}</span>`
  ).join('');
  const headerAvatar = document.getElementById('header-avatar');
  headerAvatar.innerHTML = `<div class="multi-avatars">${avatars}</div>`;
  headerAvatar.style.background = 'transparent';
  const names = selected.map(id => AI_TEAM[id].name).join('、');
  document.getElementById('header-name').textContent = names;
  document.getElementById('header-desc').textContent = `${selected.length} 位总监同时回答你的问题`;
}

  const input = document.getElementById('chat-input');

    sendMessage();
  } else {
    input.focus();
    showToast('请先输入问题 👆', '');
  }
};

// ── Send ──
window.sendMessage = async function() {
  if (isLoading) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  if (mode === 'single' && !activeDirector) {
    showToast('请先选择一个 AI 总监', 'error'); return;
  }
  if (mode === 'multi' && selectedDirectors.size === 0) {
    showToast('请先勾选至少一位总监', 'error'); return;
  }

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('ask-selected-btn').disabled = true;

  if (mode === 'single') {
    await sendSingle(text);
  } else {
    await sendMulti(text);
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  if (mode === 'multi') document.getElementById('ask-selected-btn').disabled = selectedDirectors.size === 0;
  input.focus();
};

// Single send
async function sendSingle(text) {
  singleHistory[activeDirector.id].push({ role: 'user', content: text });
  document.getElementById('messages').innerHTML = '';
  singleHistory[activeDirector.id].forEach(m => appendSingleMessage(m.role, m.content));

  // 保存用户消息到 Supabase
  saveMessage(activeDirector.id, activeDirector.name, 'user', text);

  // Typing indicator
  const typingEl = addSingleTyping();
  scrollToBottom();

  try {
    const data = await fetchDataForRole(activeDirector.id);
    const context = formatDataAsContext(data);
    const messages = singleHistory[activeDirector.id].map(m => ({
      role: m.role,
      content: m.role === 'user' && m === singleHistory[activeDirector.id].at(-1)
        ? text + context : m.content
    }));

    const reply = await callClaude(activeDirector.systemPrompt, messages);
    typingEl.remove();
    singleHistory[activeDirector.id].push({ role: 'assistant', content: reply });
    appendSingleMessage('assistant', reply);

    // 保存 AI 回复到 Supabase
    saveMessage(activeDirector.id, activeDirector.name, 'assistant', reply);

    scrollToBottom();
  } catch (e) {
    typingEl.remove();
    singleHistory[activeDirector.id].pop();
    showToast(`错误：${e.message}`, 'error');
    renderSingleMessages();
  }
}

// Multi send
async function sendMulti(text) {
  const msgs = document.getElementById('messages');

  // Show question
  const block = document.createElement('div');
  block.className = 'multi-response-block';

  const userMsgHtml = `
    <div class="multi-user-msg" style="align-self:flex-end">
      <div class="message-avatar">HQ</div>
      <div class="message-content">${escHtml(text)}</div>
    </div>`;

  // Build loading cards for each selected director
  const selectedIds = [...selectedDirectors];
  const cardsHtml = selectedIds.map(id => {
    const d = AI_TEAM[id];
    return `
      <div class="director-response-card loading" id="resp-${id}">
        <div class="director-response-header" style="border-bottom-color:${d.color}33">
          <span>${d.emoji}</span>
          <span>${d.name}</span>
          <span class="title-tag" style="background:${d.color}22;color:${d.color}">${d.title}</span>
        </div>
        <div class="director-response-body">
          <span class="spin" style="margin-right:6px">⟳</span>
          <span style="color:var(--text-muted);font-size:12px">正在读取数据并思考...</span>
        </div>
      </div>`;
  }).join('');

  block.innerHTML = userMsgHtml + `<div class="director-responses">${cardsHtml}</div>`;
  msgs.appendChild(block);
  scrollToBottom();

  // Fetch all in parallel
  const promises = selectedIds.map(async (id) => {
    const d = AI_TEAM[id];
    try {
      const data = await fetchDataForRole(id);
      const context = formatDataAsContext(data);
      const messages = [{ role: 'user', content: text + context }];
      const reply = await callClaude(d.systemPrompt, messages);

      const card = document.getElementById(`resp-${id}`);
      if (card) {
        card.classList.remove('loading');
        card.querySelector('.director-response-body').innerHTML = md(reply);
      }
    } catch (e) {
      const card = document.getElementById(`resp-${id}`);
      if (card) {
        card.classList.remove('loading');
        card.querySelector('.director-response-body').innerHTML =
          `<span style="color:#dc2626">⚠️ 错误：${escHtml(e.message)}</span>`;
      }
    }
  });

  await Promise.allSettled(promises);
  scrollToBottom();
}

// ── Claude API call ──
async function callClaude(system, messages) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, messages }),
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error || `API error ${response.status}`);
  }
  const result = await response.json();
  return result.response;
}

// ── Helpers ──
function addSingleTyping() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `
    <div class="message-avatar" style="background:${activeDirector.color}22">${activeDirector.emoji}</div>
    <div class="message-content">
      <span style="font-size:11px;color:var(--text-muted)"><span class="spin">⟳</span> 读取数据中...</span>
      <div class="typing-indicator" style="margin-top:6px">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>`;
  container.appendChild(div);
  return div;
}

window.clearChat = async function() {
  if (mode === 'single' && activeDirector) {
    singleHistory[activeDirector.id] = [];
    await clearHistory(activeDirector.id);
    renderSingleMessages();
    showToast('对话记录已清除 ✓', 'success');
  } else if (mode === 'multi') {
    document.getElementById('messages').innerHTML = `
      <div class="welcome">
        <div class="welcome-emoji">👥</div>
        <h3>多问模式</h3>
        <p>勾选左侧总监，同时向多人提问</p>
      </div>`;
  }
};

window.refreshData = function() {
  showToast('下次提问将重新读取最新数据 ✓', 'success');
};

window.useQuickPrompt = function(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
};

function enableInput(placeholder) {
  const input = document.getElementById('chat-input');
  input.disabled = false;
  input.placeholder = placeholder || '问 AI 总监...';
  document.getElementById('send-btn').disabled = false;
}

function disableInput() {
  document.getElementById('chat-input').disabled = true;
  document.getElementById('chat-input').placeholder = '问 AI 总监...';
  document.getElementById('send-btn').disabled = true;
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  setTimeout(() => c.scrollTop = c.scrollHeight, 60);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function md(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```[\s\S]*?```/g, m => `<pre><code>${m.slice(3,-3).replace(/^[a-z]+\n/,'')}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n\n+/g,'</p><p>')
    .replace(/^(?!<[hpuo])(.+)$/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}

    xiaoxiao: ['本月各人业绩进度','KPM vs 上月对比','MT客户本月状况'],

    chongchong: ['写Kampua Mee文案','针对荤食者推广方向','本月促销ROI'],
    shunshun: ['哪些产品快到期？','各人拜访次数排名','有哪些逾期任务？'],

// Keyboard
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
