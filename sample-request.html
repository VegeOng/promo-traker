<!DOCTYPE html>
<html lang="zh-MY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>样品申请 — MamaVege</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--s1:#fff;--s2:#f3f4f6;
  --b1:#e5e7eb;--b2:#d1d5db;
  --t1:#111827;--t2:#4b5563;--t3:#9ca3af;
  --green:#166534;--green2:#22c55e;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fca5a5;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;}

/* ── HEADER ── */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--s1);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand-icon{width:32px;height:32px;background:var(--green);color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.brand-name{font-size:13px;font-weight:800;letter-spacing:.02em;}
.brand-tag{font-size:10px;font-family:var(--mono);color:var(--t3);letter-spacing:.06em;text-transform:uppercase;}
.back-link{font-size:12px;color:var(--t3);text-decoration:none;display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--b1);border-radius:8px;transition:all .15s;}
.back-link:hover{background:var(--s2);color:var(--t2);}

/* ── TABS ── */
.tab-bar{display:flex;background:var(--s1);border-bottom:1px solid var(--b1);padding:0 24px;}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:600;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:var(--font);}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}
.tab-btn:hover:not(.active){color:var(--t2);}

/* ── MAIN ── */
.main{max-width:700px;margin:0 auto;padding:28px 20px 60px;}
.panel{display:none;}.panel.active{display:block;}

/* ── PAGE TITLE ── */
.page-title{margin-bottom:24px;}
.page-title h2{font-size:20px;font-weight:800;margin-bottom:4px;}
.page-title p{font-size:13px;color:var(--t3);}

/* ── CARD ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--b1);}

/* ── FORM ── */
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
label .req{color:var(--red);}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--b1);border-radius:10px;font-size:14px;font-family:var(--font);background:var(--s2);color:var(--t1);transition:all .2s;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--green);background:white;box-shadow:0 0 0 3px rgba(22,101,52,.06);}
input.err,select.err,textarea.err{border-color:var(--red);}
textarea{resize:vertical;min-height:80px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:500px){.row2{grid-template-columns:1fr;}}

/* ── PRODUCT TABLE ── */
.prod-header{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:6px;}
.prod-header span{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;}
.prod-row{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:8px;align-items:center;}
.prod-row input{font-size:13px;}
.rm-btn{width:32px;height:32px;border:none;background:var(--red-bg);color:var(--red);border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.rm-btn:hover{background:#fca5a5;}
.add-row-btn{width:100%;padding:9px;background:var(--green-bg);color:var(--green);border:1.5px dashed var(--green-border);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s;margin-top:4px;}
.add-row-btn:hover{background:#dcfce7;}

/* ── BUTTONS ── */
.btn-primary{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary:hover{background:#14532d;}
.btn-primary:disabled{background:var(--b2);cursor:not-allowed;}
.btn-outline{padding:9px 16px;background:transparent;color:var(--green);border:1.5px solid var(--green);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-outline:hover{background:var(--green-bg);}
.btn-red-outline{padding:9px 16px;background:transparent;color:var(--red);border:1.5px solid var(--red-border);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-red-outline:hover{background:var(--red-bg);}
.btn-approve{padding:9px 18px;background:var(--green);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-approve:hover{background:#14532d;}
.btn-reject{padding:9px 18px;background:var(--red);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-reject:hover{background:#b91c1c;}

/* ── ALERTS ── */
.alert{border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px;display:none;}
.alert.show{display:block;}
.alert-success{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green);}
.alert-error{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);}
.alert-info{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber);}

/* ── STATUS BADGE ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono);}
.badge-pending{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.badge-approved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.badge-rejected{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}

/* ── REQUEST LIST ── */
.req-item{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:all .15s;}
.req-item:hover{border-color:var(--b2);box-shadow:0 4px 12px rgba(0,0,0,.07);}
.req-item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.req-ref{font-size:12px;font-family:var(--mono);color:var(--green);font-weight:700;}
.req-meta{font-size:12px;color:var(--t3);margin-top:3px;}
.req-customer{font-size:14px;font-weight:700;color:var(--t1);}
.req-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--b1);}
.req-body.open{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
@media(max-width:480px){.detail-grid{grid-template-columns:1fr;}}
.detail-item label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:3px;display:block;}
.detail-item p{font-size:13px;color:var(--t1);font-weight:500;}
.prod-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px;}
.prod-table th{background:var(--s2);padding:7px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);border-bottom:1px solid var(--b1);}
.prod-table td{padding:8px 10px;border-bottom:1px solid var(--s2);}
.prod-table tr:last-child td{border-bottom:none;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ── APPROVAL CARD ── */
.approve-card{background:var(--s1);border:2px solid var(--green-border);border-radius:16px;padding:24px;margin-bottom:16px;}
.approve-card h3{font-size:16px;font-weight:800;color:var(--green);margin-bottom:4px;}
.approve-card .sub{font-size:13px;color:var(--t3);margin-bottom:20px;}

/* ── SHARE BOX ── */
.share-box{background:var(--green-bg);border:1px solid var(--green-border);border-radius:12px;padding:16px;margin-bottom:16px;}
.share-box h4{font-size:13px;font-weight:700;color:var(--green);margin-bottom:10px;}
.share-url{display:flex;gap:8px;align-items:center;}
.share-url input{flex:1;font-family:var(--mono);font-size:12px;background:white;border-color:var(--green-border);color:var(--t2);}
.copy-btn{padding:9px 14px;background:var(--green);color:white;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--font);}
.copy-btn:hover{background:#14532d;}
.wa-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#25d366;color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);width:100%;justify-content:center;margin-top:10px;}
.wa-btn:hover{background:#22bf5b;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--t3);}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty p{font-size:13px;}

/* ── LOADING ── */
.loading{text-align:center;padding:30px;color:var(--t3);font-size:13px;}

/* ── PRINT ONLY ── */
@media print{
  .top,.tab-bar,.action-row,.share-box,.btn-primary,
  .add-row-btn,.rm-btn,.back-link{display:none!important;}
  body{background:white;}
  .main{padding:0;max-width:100%;}
  .card,.approve-card{box-shadow:none;border:1px solid #ddd;}
  .print-only{display:block!important;}
}
.print-only{display:none;}

/* ── REJECT MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{font-size:16px;font-weight:800;margin-bottom:6px;}
.modal p{font-size:13px;color:var(--t3);margin-bottom:16px;}
.modal textarea{width:100%;padding:10px 12px;border:1.5px solid var(--b1);border-radius:10px;font-size:14px;font-family:var(--font);min-height:90px;resize:vertical;outline:none;}
.modal textarea:focus{border-color:var(--red);}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.btn-cancel{padding:9px 16px;background:var(--s2);color:var(--t2);border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
</style>
</head>
<body>

<!-- ── REJECT REASON MODAL ── -->
<div class="modal-overlay" id="rejectModal">
  <div class="modal">
    <h3>❌ 拒绝申请</h3>
    <p>请填写拒绝原因，申请人将会看到此备注。</p>
    <textarea id="rejectReason" placeholder="例如：样品库存不足，请下月再申请…"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeRejectModal()">取消</button>
      <button class="btn-reject" onclick="confirmReject()">确认拒绝</button>
    </div>
  </div>
</div>

<!-- ── HEADER ── -->
<div class="top">
  <a class="brand" href="index.html">
    <div class="brand-icon">M</div>
    <div>
      <div class="brand-name">MAMAVEGE HUB</div>
      <div class="brand-tag">Internal Tools</div>
    </div>
  </a>
  <a class="back-link" href="index.html">← 返回首页</a>
</div>

<!-- ── TAB BAR ── -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('apply',this)">📝 提交申请</button>
  <button class="tab-btn" onclick="switchTab('history',this)">📋 我的申请</button>
  <button class="tab-btn" id="approveTabBtn" onclick="switchTab('approve',this)" style="display:none">✅ 审批申请</button>
</div>

<div class="main">

  <!-- ════════════════════════════════
       PANEL 1 — 提交申请
  ════════════════════════════════ -->
  <div class="panel active" id="panel-apply">
    <div class="page-title">
      <h2>🧪 样品申请</h2>
      <p>填写以下表格，提交后将生成审批链接，发给上司批准。</p>
    </div>

    <div class="alert alert-success" id="applySuccess"></div>
    <div class="alert alert-error" id="applyError"></div>

    <!-- 申请人信息 -->
    <div class="card">
      <div class="card-title">申请人信息</div>
      <div class="row2">
        <div class="field">
          <label>申请人姓名 <span class="req">*</span></label>
          <input type="text" id="f_name" placeholder="你的名字">
        </div>
        <div class="field">
          <label>客户名称 <span class="req">*</span></label>
          <input type="text" id="f_customer" placeholder="例如：Giant Subang Jaya">
        </div>
      </div>
    </div>

    <!-- 申请产品 -->
    <div class="card">
      <div class="card-title">申请产品明细</div>
      <div class="prod-header">
        <span>产品名称 / SKU</span>
        <span>数量</span>
        <span></span>
      </div>
      <div id="prodRows">
        <div class="prod-row">
          <input type="text" class="prod-name" placeholder="例如：KPM / 凉拌菜">
          <input type="number" class="prod-qty" placeholder="数量" min="1">
          <button class="rm-btn" onclick="removeRow(this)" title="删除">×</button>
        </div>
      </div>
      <button class="add-row-btn" onclick="addRow()">＋ 添加产品</button>
    </div>

    <!-- 申请详情 -->
    <div class="card">
      <div class="card-title">申请详情</div>
      <div class="field">
        <label>申请用途 <span class="req">*</span></label>
        <textarea id="f_purpose" placeholder="例如：新客户展示、活动促销试吃、门店陈列展示…"></textarea>
      </div>
      <div class="field">
        <label>送货地址 <span class="req">*</span></label>
        <input type="text" id="f_address" placeholder="例如：No. 12, Jalan SS15/4, Subang Jaya">
      </div>
    </div>

    <button class="btn-primary" id="submitBtn" onclick="submitRequest()">
      📤 提交申请
    </button>

    <!-- 成功后：显示审批链接 -->
    <div class="share-box" id="shareBox" style="display:none;margin-top:16px;">
      <h4>✅ 申请已提交！请将以下链接发给上司审批：</h4>
      <div class="share-url">
        <input type="text" id="approveLink" readonly>
        <button class="copy-btn" onclick="copyLink()">复制</button>
      </div>
      <button class="wa-btn" id="waBtn" onclick="shareWhatsApp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp 发给上司
      </button>
    </div>
  </div>

  <!-- ════════════════════════════════
       PANEL 2 — 我的申请记录
  ════════════════════════════════ -->
  <div class="panel" id="panel-history">
    <div class="page-title">
      <h2>📋 我的申请记录</h2>
      <p>查看你提交过的所有样品申请状态。</p>
    </div>

    <div class="field" style="margin-bottom:16px;">
      <label>输入姓名查看记录</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="historyName" placeholder="你的名字" style="flex:1;">
        <button class="btn-outline" onclick="loadHistory()">查询</button>
      </div>
    </div>

    <div id="historyList"><div class="empty"><div class="empty-icon">🔍</div><p>输入姓名后按查询</p></div></div>
  </div>

  <!-- ════════════════════════════════
       PANEL 3 — 审批 (上司)
  ════════════════════════════════ -->
  <div class="panel" id="panel-approve">
    <div class="page-title">
      <h2>✅ 审批样品申请</h2>
      <p>查看所有待审批申请，批准或拒绝。</p>
    </div>

    <!-- 密码入口 -->
    <div id="approveGate">
      <div class="card">
        <div class="card-title">身份验证</div>
        <div class="field">
          <label>上司密码</label>
          <input type="password" id="approvePassword" placeholder="输入审批密码" onkeydown="if(event.key==='Enter')verifyApprover()">
        </div>
        <div class="alert alert-error" id="pwError"></div>
        <button class="btn-primary" onclick="verifyApprover()" style="margin-top:8px;">🔓 进入审批</button>
      </div>
    </div>

    <!-- 审批内容 (密码正确后显示) -->
    <div id="approveContent" style="display:none;">
      <div class="alert alert-success" id="approveSuccess"></div>
      <div class="alert alert-error" id="approveError"></div>
      <div id="approveList"><div class="loading">加载中…</div></div>
    </div>
  </div>

</div><!-- /main -->

function addRow() {
  const row = document.createElement('div');
  row.className = 'prod-row';
  row.innerHTML = `
    <input type="text" class="prod-name" placeholder="例如：KPM / 凉拌菜">
    <input type="number" class="prod-qty" placeholder="数量" min="1">
    <button class="rm-btn" onclick="removeRow(this)" title="删除">×</button>`;

}
function removeRow(btn) {
  const rows = document.querySelectorAll('.prod-row');
  if (rows.length <= 1) { alert('至少保留一行产品'); return; }
  btn.closest('.prod-row').remove();
}

// ══════════════════════════════════════════
// GENERATE REF NO
// ══════════════════════════════════════════
function genRef() {
  const now = new Date();
  const yy = String(now.getFullYear()).slice(2);
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const rnd = Math.floor(Math.random()*900+100);
  return `SR${yy}${mm}${dd}-${rnd}`;
}

// ══════════════════════════════════════════
// SUBMIT REQUEST
// ══════════════════════════════════════════
async function submitRequest() {
  const name     = document.getElementById('f_name').value.trim();
  const customer = document.getElementById('f_customer').value.trim();
  const purpose  = document.getElementById('f_purpose').value.trim();
  const address  = document.getElementById('f_address').value.trim();

  const products = [];
  document.querySelectorAll('.prod-row').forEach(row => {
    const n = row.querySelector('.prod-name').value.trim();
    const q = row.querySelector('.prod-qty').value.trim();
    if (n && q) products.push({ name: n, qty: q });
  });

  // Validate
  let hasErr = false;
  ['f_name','f_customer','f_purpose','f_address'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('err');
    if (!el.value.trim()) { el.classList.add('err'); hasErr = true; }
  });
  if (!products.length) {
    showAlert('applyError', '请至少填写一项产品。'); return;
  }
  if (hasErr) { showAlert('applyError', '请填写所有必填栏位（红框部分）。'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';
  hideAlert('applyError');

  const now = new Date();
  const ref = genRef();
  const record = {
    ref_no:      ref,
    applicant:   name,
    customer:    customer,
    products:    JSON.stringify(products),
    purpose:     purpose,
    address:     address,
    status:      'pending',
    submitted_at: now.toISOString(),
    submitted_date: now.toLocaleDateString('en-MY', {year:'numeric',month:'2-digit',day:'2-digit'}),
    submitted_time: now.toLocaleTimeString('en-MY', {hour:'2-digit',minute:'2-digit'})
  };

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/sample_requests', {
      method: 'POST',
      headers: { ...H, 'Prefer': 'return=representation' },
      body: JSON.stringify(record)
    });
    if (!res.ok) throw new Error(await res.text());

    // Build approve link
    const link = `${location.origin}${location.pathname}?approve=${ref}`;
    document.getElementById('approveLink').value = link;
    document.getElementById('shareBox').style.display = 'block';
    document.getElementById('waBtn').dataset.ref = ref;
    document.getElementById('waBtn').dataset.name = name;

    showAlert('applySuccess', `✅ 申请 ${ref} 已成功提交！请将审批链接发给上司。`);
    // Reset form
    document.getElementById('f_name').value = '';
    document.getElementById('f_customer').value = '';
    document.getElementById('f_purpose').value = '';
    document.getElementById('f_address').value = '';
    document.getElementById('prodRows').innerHTML = `
      <div class="prod-row">
        <input type="text" class="prod-name" placeholder="例如：KPM / 凉拌菜">
        <input type="number" class="prod-qty" placeholder="数量" min="1">
        <button class="rm-btn" onclick="removeRow(this)" title="删除">×</button>
      </div>`;
  } catch(e) {
    console.error(e);
    showAlert('applyError', '提交失败，请重试。错误：' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = '📤 提交申请';
}

let approverVerified = false;

async function verifyApprover() {
  const pw = document.getElementById('approvePassword').value;
  if (pw !== APPROVE_PASSWORD) {
    showAlert('pwError', '密码错误，请重试。');
    return;
  }
  approverVerified = true;
  document.getElementById('approveGate').style.display = 'none';
  document.getElementById('approveContent').style.display = 'block';
  await loadApproveList();
}

async function loadApproveList() {
  const list = document.getElementById('approveList');
  list.innerHTML = '<div class="loading">加载中…</div>';
  try {
    // If came from link, load that specific request; else load all pending
    let url;
    if (approveId) {
      url = SUPABASE_URL + '/rest/v1/sample_requests?ref_no=eq.' + encodeURIComponent(approveId);
    } else {
      url = SUPABASE_URL + '/rest/v1/sample_requests?order=submitted_at.desc';
    }
    const res = await fetch(url, { headers: H });
    const data = await res.json();

    if (!data.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">🎉</div><p>暂无申请记录。</p></div>';
      return;
    }

    // Group: pending first
    const pending  = data.filter(r => r.status === 'pending');
    const rest     = data.filter(r => r.status !== 'pending');

    let html = '';
    if (pending.length) {
      html += `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:10px;">⏳ 待审批 (${pending.length})</div>`;
      html += pending.map(r => renderApproveItem(r)).join('');
    }
    if (rest.length) {
      html += `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin:20px 0 10px;">历史记录</div>`;
      html += rest.map(r => renderApproveItem(r)).join('');
    }
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><p>加载失败，请刷新重试。</p></div>';
  }
}

// ── APPROVE ──
async function approveRequest(refNo) {
  if (!confirm(`批准申请 ${refNo}？批准后将生成PDF并通知开单同事。`)) return;
  const now = new Date();
  const approvedAt = now.toLocaleDateString('en-MY',{year:'numeric',month:'2-digit',day:'2-digit'})
                   + ' ' + now.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/sample_requests?ref_no=eq.' + encodeURIComponent(refNo),
      { method:'PATCH', headers:{...H,'Prefer':'return=representation'}, body: JSON.stringify({ status:'approved', approved_at: approvedAt }) }
    );
    const updated = await res.json();
    showAlert('approveSuccess', `✅ 申请 ${refNo} 已批准！正在发送通知邮件给开单同事…`);

    // Send email via EmailJS
    if (updated && updated[0]) {
      await sendBillingEmail(updated[0]);
    }
    await loadApproveList();
  } catch(e) {
    showAlert('approveError', '操作失败：' + e.message);
  }
}

// ── REJECT ──
let pendingRejectRef = '';
function openRejectModal(refNo) {
  pendingRejectRef = refNo;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').classList.add('open');
}
function closeRejectModal() {
  document.getElementById('rejectModal').classList.remove('open');
  pendingRejectRef = '';
}
async function confirmReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { alert('请填写拒绝原因'); return; }
  closeRejectModal();
  try {
    await fetch(
      SUPABASE_URL + '/rest/v1/sample_requests?ref_no=eq.' + encodeURIComponent(pendingRejectRef),
      { method:'PATCH', headers:{...H,'Prefer':'return=minimal'}, body: JSON.stringify({ status:'rejected', reject_reason: reason }) }
    );
    showAlert('approveSuccess', `❌ 申请 ${pendingRejectRef} 已拒绝。`);
    await loadApproveList();
  } catch(e) {
    showAlert('approveError', '操作失败：' + e.message);
  }
}

// ══════════════════════════════════════════
// EMAILJS — 发送通知给开单同事
// ══════════════════════════════════════════
async function sendBillingEmail(r) {
  // Check if EmailJS is configured
  if (EMAILJS_SERVICE_ID === 'YOUR_SERVICE_ID') {
    showAlert('approveSuccess', `✅ 申请 ${r.ref_no} 已批准！（EmailJS 尚未设置，邮件未发送）`);
    return;
  }
  try {
    emailjs.init(EMAILJS_PUBLIC_KEY);
    const products = tryParseProducts(r.products);
    const prodText = products.map(p => `• ${p.name} × ${p.qty}`).join('\n');
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:       BILLING_EMAIL,
      ref_no:         r.ref_no,
      applicant:      r.applicant,
      submitted_date: r.submitted_date,
      submitted_time: r.submitted_time,
      customer:       r.customer,
      purpose:        r.purpose,
      address:        r.address,
      products_text:  prodText,
      approved_at:    r.approved_at
    });
    showAlert('approveSuccess', `✅ 申请 ${r.ref_no} 已批准！通知邮件已发送至 ${BILLING_EMAIL}`);
  } catch(e) {
    console.error('EmailJS error:', e);
    showAlert('approveSuccess', `✅ 申请 ${r.ref_no} 已批准！（邮件发送失败，请手动通知开单同事）`);
  }
}

// ══════════════════════════════════════════
// PDF GENERATION
// ══════════════════════════════════════════
function printPDF(r) {
  // If string (from HTML attribute), parse it
  if (typeof r === 'string') {
    try { r = JSON.parse(r); } catch(e) { console.error(e); return; }
  }
  const products = tryParseProducts(r.products);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const pageW = 210;
  const margin = 20;
  let y = 20;

  // Header bar
  doc.setFillColor(22, 101, 52);
  doc.rect(0, 0, pageW, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16);
  doc.setFont('helvetica', 'bold');
  doc.text('MamaVege Management Hub', margin, 12);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text('Sample Request Form / 样品申请单', margin, 20);

  // Ref & status top-right
  doc.setFontSize(9);
  doc.text(r.ref_no, pageW - margin, 12, { align: 'right' });
  doc.text(r.status === 'approved' ? 'APPROVED' : r.status.toUpperCase(), pageW - margin, 20, { align: 'right' });

  y = 38;
  doc.setTextColor(0, 0, 0);

  // Info block
  doc.setFillColor(245, 247, 250);
  doc.roundedRect(margin, y, pageW - 2*margin, 40, 3, 3, 'F');
  doc.setFontSize(8);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(100, 100, 100);

  const col1x = margin + 5;
  const col2x = pageW / 2 + 5;
  const lineH = 8;

  const fields = [
    ['Applicant / 申请人', r.applicant,    'Date / 日期', r.submitted_date],
    ['Customer / 客户',    r.customer,     'Time / 时间', r.submitted_time],
    ['Purpose / 用途',     r.purpose,      'Approved At', r.approved_at || 'N/A'],
    ['Address / 地址',     r.address,      'Status', r.status === 'approved' ? 'Approved ✓' : r.status],
  ];

  fields.forEach(([l1, v1, l2, v2], i) => {
    const ry = y + 6 + i * lineH;
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(80, 80, 80);
    doc.setFontSize(7);
    doc.text(l1 + ':', col1x, ry);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(30, 30, 30);
    doc.setFontSize(8);
    doc.text(String(v1 || ''), col1x + 38, ry);

    doc.setFont('helvetica', 'bold');
    doc.setTextColor(80, 80, 80);
    doc.setFontSize(7);
    doc.text(l2 + ':', col2x, ry);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(30, 30, 30);
    doc.setFontSize(8);
    doc.text(String(v2 || ''), col2x + 32, ry);
  });

  y += 48;

  // Products table header
  doc.setFillColor(22, 101, 52);
  doc.rect(margin, y, pageW - 2*margin, 8, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(8);
  doc.setFont('helvetica', 'bold');
  doc.text('Product / SKU', margin + 4, y + 5.5);
  doc.text('Qty / 数量', pageW - margin - 4, y + 5.5, { align: 'right' });
  y += 8;

  // Product rows
  products.forEach((p, i) => {
    const rowBg = i % 2 === 0 ? [255,255,255] : [248,250,252];
    doc.setFillColor(...rowBg);
    doc.rect(margin, y, pageW - 2*margin, 8, 'F');
    doc.setTextColor(30, 30, 30);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text(String(p.name || ''), margin + 4, y + 5.5);
    doc.setFont('helvetica', 'bold');
    doc.text(String(p.qty || ''), pageW - margin - 4, y + 5.5, { align: 'right' });
    y += 8;
  });

  // Table border
  doc.setDrawColor(220, 220, 220);
  doc.rect(margin, y - products.length * 8 - 8, pageW - 2*margin, products.length * 8 + 8, 'S');

  y += 14;

  // Signature section
  doc.setDrawColor(200, 200, 200);
  doc.setFontSize(8);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(80, 80, 80);
  doc.text('Applicant Signature / 申请人签名:', margin, y);
  doc.line(margin, y + 12, margin + 60, y + 12);
  doc.text('Manager Approval / 上司批准:', pageW/2 + 5, y);
  doc.line(pageW/2 + 5, y + 12, pageW/2 + 65, y + 12);

  y += 22;

  // Footer
  doc.setFillColor(240, 253, 244);
  doc.rect(margin, y, pageW - 2*margin, 12, 'F');
  doc.setTextColor(22, 101, 52);
  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'normal');
  doc.text(`Generated: ${new Date().toLocaleString('en-MY')} · MamaVege Management Hub · Internal Use Only`, pageW/2, y + 7.5, { align: 'center' });

  // Save / print
  doc.save(`SampleRequest_${r.ref_no}.pdf`);
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function statusBadge(status) {
  const map = {
    pending:  ['badge-pending',  '⏳ 待审批'],
    approved: ['badge-approved', '✅ 已批准'],
    rejected: ['badge-rejected', '❌ 已拒绝'],
  };
  const [cls, txt] = map[status] || ['badge-pending', status];
  return `<span class="badge ${cls}">${txt}</span>`;
}

function tryParseProducts(raw) {
  try { return JSON.parse(raw) || []; }
  catch { return [{ name: String(raw || ''), qty: '' }]; }
}

function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 7000);
}
function hideAlert(id) {
  document.getElementById(id).classList.remove('show');
}
function escH(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Auto-detect approve link on load
window.addEventListener('load', () => {
  if (approveId && approverVerified === false) {
    // Show approve tab
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-approve').classList.add('active');
    // Highlight approve tab
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(t => { if (t.textContent.includes('审批')) t.classList.add('active'); });
  }
});
</script>
