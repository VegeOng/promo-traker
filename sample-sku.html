<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKU Management — MamaVege</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--s1:#fff;--s2:#f3f4f6;--b1:#e5e7eb;--b2:#d1d5db;
  --t1:#111827;--t2:#4b5563;--t3:#9ca3af;
  --green:#166534;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fca5a5;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--s1);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand-icon{width:32px;height:32px;background:var(--green);color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.brand-name{font-size:13px;font-weight:800;}
.brand-tag{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.06em;}
.back-link{font-size:12px;color:var(--t3);text-decoration:none;padding:6px 10px;border:1px solid var(--b1);border-radius:8px;}
.back-link:hover{background:var(--s2);}
.main{max-width:560px;margin:0 auto;padding:28px 20px 60px;}
.page-title{margin-bottom:24px;}
.page-title h2{font-size:20px;font-weight:800;margin-bottom:4px;}
.page-title p{font-size:13px;color:var(--t3);}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--b1);}
label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
input{width:100%;padding:10px 12px;border:1.5px solid var(--b1);border-radius:10px;font-size:14px;font-family:var(--font);background:var(--s2);color:var(--t1);outline:none;transition:all .2s;}
input:focus{border-color:var(--green);background:white;box-shadow:0 0 0 3px rgba(22,101,52,.06);}
.add-row{display:flex;gap:8px;margin-bottom:6px;}
.add-row input{flex:1;}
.btn-add{padding:10px 16px;background:var(--green);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;}
.btn-add:hover{background:#14532d;}
.alert{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:none;}
.alert.show{display:block;}
.alert-success{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green);}
.alert-error{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);}
.sku-list{display:flex;flex-direction:column;gap:8px;}
.sku-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--s2);border-radius:10px;border:1px solid var(--b1);gap:10px;}
.sku-name{font-size:14px;font-weight:600;font-family:var(--mono);flex:1;}
.sku-cost-wrap{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.sku-cost-label{font-size:11px;color:var(--t3);font-weight:600;}
.sku-cost-input{width:80px;padding:5px 8px;border:1.5px solid var(--b1);border-radius:7px;font-size:13px;font-family:var(--mono);font-weight:600;color:var(--green);background:#fff;text-align:right;outline:none;}
.sku-cost-input:focus{border-color:var(--green);}
.sku-save{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);}
.sku-save:hover{background:#bbf7d0;}
.sku-del{background:var(--red-bg);color:var(--red);border:none;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);}
.sku-del:hover{background:#fca5a5;}
.loading{text-align:center;padding:20px;color:var(--t3);font-size:13px;}
.empty{text-align:center;padding:24px;color:var(--t3);font-size:13px;}
/* GATE */
.gate{display:none;}.content{display:block;}
.btn-primary{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px;}
.btn-primary:hover{background:#14532d;}

.mv-top{overflow:hidden}
.mv-top-main{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#166534}
.mv-top-left{display:flex;align-items:center;gap:12px}
.mv-top-logo{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;text-decoration:none}
.mv-top-logo img{height:26px}
.mv-top-sep{width:1px;height:24px;background:rgba(255,255,255,.2)}
.mv-top-tool{color:#fff;font-size:14px;font-weight:700;letter-spacing:.3px}
.mv-top-right{display:flex;align-items:center;gap:12px}
.mv-top-back{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}
.mv-top-back:hover{color:#fff}
.mv-top-btn{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.mv-top-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.mv-top-sub{display:flex;justify-content:space-between;align-items:center;padding:5px 24px;background:#15532d;color:rgba(255,255,255,.6);font-size:11px}
</style>
</head>
<body>
<div class="mv-top">
  <div class="mv-top-main">
    <div class="mv-top-left">
      <a href="index.html" class="mv-top-logo"><img src="Mamavege_Logo.png" alt="MamaVege"></a>
      <div class="mv-top-sep"></div>
      <span class="mv-top-tool">SKU Management</span>
    </div>
    <div class="mv-top-right">
      <a href="index.html" class="mv-top-back">← Hub</a>
      
    </div>
  </div>
  <div class="mv-top-sub">
    <span class="mv-top-date"></span>
    <span>MamaVege Management Hub</span>
  </div>
</div>
<script>document.querySelectorAll('.mv-top-date').forEach(e=>e.textContent=new Date().toLocaleDateString('en-MY',{weekday:'short',year:'numeric',month:'short',day:'numeric'}));</script>
  </a>
  <a class="back-link" href="index.html">← Back</a>
</div>

<div class="main">
  <div class="page-title">
    <h2>📦 SKU & Cost Management</h2>
    <p>Manage SKUs and their standard cost prices. Used by the Sample Request form and Profit Calculator.</p>
  </div>

  <!-- PASSWORD GATE -->
  <div class="gate" id="gate">
    <div class="card">
      <div class="card-title">HQ Access</div>
      <div style="margin-bottom:12px;">
        <label>HQ Password</label>
        <input type="password" id="gatePw" placeholder="Enter password" onkeydown="if(event.key==='Enter')unlock()">
      </div>
      <div class="alert alert-error" id="gateErr"></div>
      <button class="btn-primary" onclick="unlock()">🔓 Enter</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <div class="alert alert-success" id="msgSuccess"></div>
    <div class="alert alert-error" id="msgError"></div>

    <!-- Add SKU -->
    <div class="card">
      <div class="card-title">Add New SKU</div>
      <div class="add-row">
        <input type="text" id="newSku" placeholder="e.g. KPM, CLM, SHCR…" onkeydown="if(event.key==='Enter')addSku()">
        <div style="position:relative;flex:0 0 140px">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--t3);font-weight:600">RM</span>
          <input type="number" id="newCost" placeholder="0.00" min="0" step="0.01" style="padding-left:30px" onkeydown="if(event.key==='Enter')addSku()">
        </div>
        <button class="btn-add" onclick="addSku()">＋ Add</button>
      </div>
    </div>

    <!-- SKU List -->
    <div class="card">
      <div class="card-title">Current SKUs</div>
      <div id="skuList"><div class="loading">Loading…</div></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wjhgezvrxlhpexocfsea.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqaGdlenZyeGxocGV4b2Nmc2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDU4NzgsImV4cCI6MjA5NDA4MTg3OH0.jENcrgEDYDlSRUCqve-T6rxYRJfz-dnZQHnXpPLJ_RE';
const APPROVE_PASSWORD = 'mamavege2026'; // ← same as sample-request.html
const H = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };

function unlock() {
  const pw = document.getElementById('gatePw').value;
  if (pw !== APPROVE_PASSWORD) {
    const e = document.getElementById('gateErr');
    e.textContent = 'Incorrect password.'; e.classList.add('show'); return;
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  loadSkus();
}

async function loadSkus() {
  const list = document.getElementById('skuList');
  list.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/sample_skus?order=sku_name.asc', { headers: H });
    const data = await res.json();
    if (!data.length) { list.innerHTML = '<div class="empty">No SKUs yet. Add your first one above.</div>'; return; }
    list.innerHTML = `<div class="sku-list">${data.map(d => `
      <div class="sku-item" id="sku-row-${d.id}">
        <span class="sku-name">${escH(d.sku_name)}</span>
        <div class="sku-cost-wrap">
          <span class="sku-cost-label">RM</span>
          <input class="sku-cost-input" type="number" min="0" step="0.01" value="${parseFloat(d.cost_price||0).toFixed(2)}" id="cost-${d.id}" onkeydown="if(event.key==='Enter')saveCost(${d.id})">
          <button class="sku-save" onclick="saveCost(${d.id})">Save</button>
        </div>
        <button class="sku-del" onclick="deleteSku(${d.id}, '${escH(d.sku_name)}')">Remove</button>
      </div>`).join('')}</div>`;
  } catch(e) {
    list.innerHTML = '<div class="empty">Failed to load SKUs.</div>';
  }
}

async function saveCost(id) {
  const val = parseFloat(document.getElementById('cost-' + id).value) || 0;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/sample_skus?id=eq.' + id, {
      method: 'PATCH', headers: { ...H, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ cost_price: val })
    });
    if (!res.ok) throw new Error(await res.text());
    showMsg('success', '✅ Cost price updated.');
  } catch(e) {
    showMsg('error', 'Failed to save: ' + e.message);
  }
}

async function addSku() {
  const val = document.getElementById('newSku').value.trim().toUpperCase();
  const cost = parseFloat(document.getElementById('newCost').value) || 0;
  if (!val) { alert('Please enter a SKU name.'); return; }
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/sample_skus', {
      method: 'POST', headers: { ...H, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ sku_name: val, cost_price: cost })
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById('newSku').value = '';
    document.getElementById('newCost').value = '';
    showMsg('success', `✅ SKU "${val}" added.`);
    await loadSkus();
  } catch(e) {
    showMsg('error', 'Failed to add SKU: ' + e.message);
  }
}

async function deleteSku(id, name) {
  if (!confirm(`Remove SKU "${name}"? This cannot be undone.`)) return;
  try {
    await fetch(SUPABASE_URL + '/rest/v1/sample_skus?id=eq.' + id, { method: 'DELETE', headers: H });
    const row = document.getElementById('sku-row-' + id);
    if (row) row.remove();
    showMsg('success', `SKU "${name}" removed.`);
  } catch(e) {
    showMsg('error', 'Failed to remove SKU.');
  }
}

function showMsg(type, msg) {
  const id = type === 'success' ? 'msgSuccess' : 'msgError';
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}
loadSkus();

function escH(s) {
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
