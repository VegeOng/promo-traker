<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MamaVege | China Market Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --green:#166534; --green-light:#dcfce7; --red:#dc2626; --red-light:#fee2e2;
    --amber:#d97706; --amber-light:#fef3c7; --blue:#2563eb; --blue-light:#dbeafe;
    --text:#1a1a1a; --muted:#6b7280; --border:#e5e7eb; --card:#ffffff; --bg:#f4f6f3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* Unified header */
  .mv-top{overflow:hidden}
  .mv-top-main{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#166534}
  .mv-top-left{display:flex;align-items:center;gap:12px}
  .mv-top-logo{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;text-decoration:none}
  .mv-top-logo img{height:26px}
  .mv-top-sep{width:1px;height:24px;background:rgba(255,255,255,.2)}
  .mv-top-tool{color:#fff;font-size:14px;font-weight:700;letter-spacing:.3px}
  .mv-top-right{display:flex;align-items:center;gap:12px}
  .mv-top-back{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}
  .mv-top-back:hover{color:#fff}
  .mv-top-btn{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
  .mv-top-btn:hover{background:rgba(255,255,255,.2);color:#fff}
  .mv-top-sub{display:flex;justify-content:space-between;align-items:center;padding:5px 24px;background:#15532d;color:rgba(255,255,255,.6);font-size:11px}

  .wrap{max-width:1320px;margin:0 auto;padding:1.5rem 1.5rem 3rem;}
  .page-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--green);margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--green);}
  .kpi-card.red::before{background:var(--red);}
  .kpi-card.amber::before{background:var(--amber);}
  .kpi-card.blue::before{background:var(--blue);}
  .kpi-label{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .kpi-val{font-size:24px;font-weight:800;line-height:1.1;color:var(--green);}
  .kpi-val.red{color:var(--red);}
  .kpi-val.amber{color:var(--amber);}
  .kpi-val.blue{color:var(--blue);}
  .kpi-sub{font-size:11px;color:#9ca3af;margin-top:4px;}

  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  .grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.grid-2,.grid-2b{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
  .card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .chart-box{position:relative;height:280px;}
  .chart-box.sm{height:240px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#9ca3af;font-weight:700;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid #f3f4f6;}
  tr:last-child td{border-bottom:none;}
  .rank{font-weight:800;color:var(--green);width:30px;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;}
  .pill.ec{background:var(--blue-light);color:var(--blue);}
  .pill.ot{background:var(--green-light);color:var(--green);}

  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
  .spinner{width:30px;height:30px;border:3px solid #e5e7eb;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{background:var(--red-light);color:var(--red);border-radius:10px;padding:14px;font-size:13px;}

  .legend-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:13px;}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle;}
</style>
</head>
<body>

<div class="mv-top">
  <div class="mv-top-main">
    <div class="mv-top-left">
      <a href="index.html" class="mv-top-logo"><img src="Mamavege_Logo.png" alt="MamaVege"></a>
      <div class="mv-top-sep"></div>
      <span class="mv-top-tool">🇨🇳 China Market Dashboard</span>
    </div>
    <div class="mv-top-right">
      <span id="top-user-name" style="color:rgba(255,255,255,.85);font-size:13px;font-weight:600"></span>
      <a href="index.html" class="mv-top-back" id="hub-link">← Hub</a>
      <button class="mv-top-btn" onclick="loadAll()">⟳ Refresh</button>
      <button class="mv-top-btn" id="logout-btn" onclick="logout()" style="display:none">Logout</button>
    </div>
  </div>
  <div class="mv-top-sub">
    <span class="mv-top-date"></span>
    <span>MamaVege Management Hub · 妈子素 China Operations</span>
  </div>
</div>

<div class="wrap">
  <div class="page-title">中国市场仪表板</div>
  <div class="page-sub">数据来源：Google Sheet「日常业绩」· 妈子素 China Operations · 自动汇总电商 / 博主代发 / 线下渠道业绩</div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap">
    <label style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">查看月份</label>
    <select id="month-select" onchange="onMonthChange()" style="padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;cursor:pointer;min-width:160px"></select>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div>Loading China market data…</div>
  <div id="content" style="display:none">

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">📈 月度业绩走势（近12个月）</div>
        <div class="chart-box"><canvas id="chartTrend"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">🏪 渠道业绩分布 <span id="lbl-channel" style="color:var(--muted);font-weight:500"></span></div>
        <div class="chart-box sm"><canvas id="chartChannel"></canvas></div>
        <div id="channel-legend" style="margin-top:6px"></div>
      </div>
    </div>

    <div class="grid-2b">
      <div class="card">
        <div class="card-title">🏆 客户 / 达人业绩排行榜 TOP 15 <span id="lbl-customers" style="color:var(--muted);font-weight:500"></span></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th></th><th>客户 / 达人</th><th>类型</th><th class="num">订单数</th><th class="num">业绩 (RMB)</th><th class="num">占比</th></tr></thead>
            <tbody id="top-customers"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🍜 产品销量分布 <span id="lbl-products" style="color:var(--muted);font-weight:500"></span>（按数量）</div>
        <div class="chart-box sm"><canvas id="chartProducts"></canvas></div>
      </div>
    </div>

  </div>
  <div id="errBox"></div>
</div>

<script>
// ── 登录权限校验 ──
// 只允许：HQ 管理员（userRole === 'hq'），或角色为 'china' 的 member（如 Jason）
function lsGet(key){
  const raw = localStorage.getItem(key);
  if(!raw) return null;
  try{
    const item = JSON.parse(raw);
    if(Date.now() > item.expiry){ localStorage.removeItem(key); return null; }
    return item.value;
  }catch{ return null; }
}
function lsClear(){
  ['userName','userRole','userId','hq_auth','memberRole'].forEach(k=>localStorage.removeItem(k));
}
function logout(){ lsClear(); location.href = 'index.html'; }

(function authGuard(){
  const userName = lsGet('userName');
  const userRole = lsGet('userRole');
  const memberRole = lsGet('memberRole');

  if(!userName || !userRole){
    location.href = 'index.html';
    return;
  }
  if(userRole === 'hq'){
    return; // HQ 管理员可正常访问
  }
  if(userRole === 'member' && memberRole === 'china'){
    // Jason：只允许看中国界面，隐藏返回 Hub 的入口
    document.addEventListener('DOMContentLoaded', ()=>{
      const nameEl = document.getElementById('top-user-name');
      const hubLink = document.getElementById('hub-link');
      const logoutBtn = document.getElementById('logout-btn');
      if(nameEl) nameEl.textContent = userName;
      if(hubLink) hubLink.style.display = 'none';
      if(logoutBtn) logoutBtn.style.display = 'inline-block';
    });
    return;
  }
  // 其他角色（一般 member）无权访问中国界面，导回各自首页
  location.href = 'my-dashboard.html';
})();

document.querySelectorAll('.mv-top-date').forEach(e=>e.textContent=new Date().toLocaleDateString('zh-CN',{weekday:'short',year:'numeric',month:'short',day:'numeric'}));

const CHINA_API = 'https://script.google.com/macros/s/AKfycbzxnGZQSq13c36n0NeVuGPUbxW_duPizD34lvLnxTx2rKDlxziuLtZe82dV4vifyyG5tw/exec';

// 渠道分类规则（vege 确认）：电商 = 微信小店 / 抖店；其余归入「博主 / 经销 / 线下」（无独立抖音渠道）
const ECOMMERCE_NAMES = ['微信小店', '抖店'];
const PRODUCT_COLS = ['香椿干盘面','青柠干盘面','冬阴功汤','香椿杯面','青柠杯面'];
const MONTHLY_GOAL = 50000;   // 中国市场月度目标 RMB 5万
const YEARLY_GOAL = 600000;   // 中国市场年度目标 RMB 60万

function progressBarHtml(pct, color){
  const w = Math.min(100, Math.max(0, pct));
  return `<div style="margin-top:6px;height:6px;border-radius:3px;background:#e5e7eb;overflow:hidden">
    <div style="height:100%;width:${w}%;background:${color};border-radius:3px"></div>
  </div>`;
}

let charts = {};

function fmtRMB(n){ return 'RMB ' + Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Google Sheet 日期是按表格时区（GMT+8）存的午夜时间，序列化成 UTC 后会往回退一天
// 加 8 小时换算回本地日期，避免错位
function parseSheetDate(raw){
  if(!raw) return null;
  const d = new Date(raw);
  if(isNaN(d.getTime())) return null;
  const shifted = new Date(d.getTime() + 8*3600*1000);
  return { y: shifted.getUTCFullYear(), m: shifted.getUTCMonth()+1, day: shifted.getUTCDate(), ym: `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth()+1).padStart(2,'0')}` };
}

function classifyChannel(name){
  const n = (name||'').trim();
  if(ECOMMERCE_NAMES.some(k=>n.includes(k))) return 'ec';
  return 'ot';
}
const channelLabel = { ec:'电商平台', ot:'博主 / 经销 / 线下' };
const channelColor = { ec:'#2563eb', ot:'#166534' };

async function fetchChinaData(){
  const res = await fetch(CHINA_API);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  const rows = json.data || [];
  return rows.map(r=>{
    const date = parseSheetDate(r['日期']);
    return {
      name: (r['客户/达人']||'').toString().trim(),
      revenue: parseFloat(r['总金额']) || 0,
      date,
      products: PRODUCT_COLS.reduce((acc,p)=>{ acc[p]=parseFloat(r[p])||0; return acc; },{}),
    };
  }).filter(r=>r.date); // 丢掉没有日期的脏数据行
}

function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }

let allRows = [];
const mNamesZh = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function populateMonthSelect(){
  const sel = document.getElementById('month-select');
  // 取数据里实际出现过的月份 + 当前月份，去重并按时间倒序排列
  const ymSet = new Set(allRows.map(r=>r.date.ym));
  const now = new Date();
  ymSet.add(monthKey(now.getFullYear(), now.getMonth()+1));
  const yms = Array.from(ymSet).sort().reverse();
  sel.innerHTML = yms.map(ym=>{
    const [y,m] = ym.split('-');
    return `<option value="${ym}">${y}年 ${mNamesZh[parseInt(m)-1]}</option>`;
  }).join('');
  sel.value = monthKey(now.getFullYear(), now.getMonth()+1);
}

function onMonthChange(){
  render(allRows, document.getElementById('month-select').value);
}

async function loadAll(){
  document.getElementById('loading').style.display='block';
  document.getElementById('content').style.display='none';
  document.getElementById('errBox').innerHTML='';
  try{
    allRows = await fetchChinaData();
    if(!allRows.length){ throw new Error('No data returned from sheet'); }
    populateMonthSelect();
    render(allRows, document.getElementById('month-select').value);
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(e){
    console.error(e);
    document.getElementById('loading').style.display='none';
    document.getElementById('errBox').innerHTML = `<div class="err">❌ 数据加载失败：${escHtml(e.message)}<br>请确认 Google Sheet API 已正确部署且可公开访问。</div>`;
  }
}

function render(rows, selectedYM){
  const now = new Date();
  const [selY, selM] = selectedYM.split('-').map(Number);
  const curYM = selectedYM;
  const monthLabel = `（${selY}年${selM}月）`;
  const lastDate = new Date(selY, selM-1, 1); lastDate.setMonth(lastDate.getMonth()-1);
  const lastYM = monthKey(lastDate.getFullYear(), lastDate.getMonth()+1);
  const isCurrentMonth = (selY===now.getFullYear() && selM===now.getMonth()+1);

  document.getElementById('lbl-channel').textContent = monthLabel;
  document.getElementById('lbl-customers').textContent = monthLabel;
  document.getElementById('lbl-products').textContent = monthLabel;

  // ── 月度汇总 ──
  const monthMap = {}; // ym -> revenue
  rows.forEach(r=>{ monthMap[r.date.ym] = (monthMap[r.date.ym]||0) + r.revenue; });

  const thisMonthTotal = monthMap[curYM] || 0;
  const lastMonthTotal = monthMap[lastYM] || 0;
  const momPct = lastMonthTotal > 0 ? ((thisMonthTotal - lastMonthTotal) / lastMonthTotal * 100) : null;
  const ytdTotal = rows.filter(r=>r.date.y===selY).reduce((s,r)=>s+r.revenue,0);

  // 本周（周一为起点，仅在选择「当前月」时显示有意义的数据）
  const day = now.getDay();
  const mondayOffset = (day===0 ? -6 : 1-day);
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()+mondayOffset);
  const mondayStr = `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
  const weekTotal = rows.filter(r=>{
    const ds = `${r.date.y}-${String(r.date.m).padStart(2,'0')}-${String(r.date.day).padStart(2,'0')}`;
    return ds >= mondayStr;
  }).reduce((s,r)=>s+r.revenue,0);

  // ── KPI cards ──
  const momHtml = momPct===null
    ? `<span style="color:#9ca3af">环比：无上月数据</span>`
    : `<span style="color:${momPct>=0?'var(--green)':'var(--red)'};font-weight:700">${momPct>=0?'▲':'▼'} ${Math.abs(momPct).toFixed(1)}%</span> vs 上月`;
  const secondCard = isCurrentMonth
    ? `<div class="kpi-card blue"><div class="kpi-label">本周业绩</div><div class="kpi-val blue">${fmtRMB(weekTotal)}</div><div class="kpi-sub">本周一至今</div></div>`
    : `<div class="kpi-card blue"><div class="kpi-label">本周业绩（实时）</div><div class="kpi-val blue">${fmtRMB(weekTotal)}</div><div class="kpi-sub">本周一至今，与所选月份无关</div></div>`;

  // 月度 / 年度目标达成进度
  const monthGoalPct = (thisMonthTotal / MONTHLY_GOAL * 100);
  const yearGoalPct = (ytdTotal / YEARLY_GOAL * 100);
  const monthGoalColor = monthGoalPct >= 100 ? 'var(--green)' : (monthGoalPct >= 60 ? '#d97706' : 'var(--red)');
  const yearGoalColor = yearGoalPct >= 100 ? 'var(--green)' : (yearGoalPct >= 60 ? '#d97706' : 'var(--red)');
  const monthGoalSub = `${momHtml}<br><span style="color:${monthGoalColor};font-weight:700">目标达成 ${monthGoalPct.toFixed(1)}%</span>（目标 RMB ${MONTHLY_GOAL.toLocaleString('zh-CN')}）${progressBarHtml(monthGoalPct, monthGoalColor)}`;
  const yearGoalSub = `${selY} 年累计　<span style="color:${yearGoalColor};font-weight:700">目标达成 ${yearGoalPct.toFixed(1)}%</span>（目标 RMB ${YEARLY_GOAL.toLocaleString('zh-CN')}）${progressBarHtml(yearGoalPct, yearGoalColor)}`;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">${selY}年${selM}月业绩</div><div class="kpi-val">${fmtRMB(thisMonthTotal)}</div><div class="kpi-sub">${monthGoalSub}</div></div>
    ${secondCard}
    <div class="kpi-card amber"><div class="kpi-label">上月业绩</div><div class="kpi-val amber">${fmtRMB(lastMonthTotal)}</div><div class="kpi-sub">${lastYM}</div></div>
    <div class="kpi-card"><div class="kpi-label">YTD 累计</div><div class="kpi-val">${fmtRMB(ytdTotal)}</div><div class="kpi-sub">${yearGoalSub}</div></div>
  `;

  // ── 趋势图：近12个月 ──
  const trendLabels = [], trendValues = [];
  for(let i=11;i>=0;i--){
    const d = new Date(selY, selM-1-i, 1);
    const ym = monthKey(d.getFullYear(), d.getMonth()+1);
    trendLabels.push(`${d.getFullYear()}/${d.getMonth()+1}`);
    trendValues.push(monthMap[ym] || 0);
  }
  if(charts.trend) charts.trend.destroy();
  charts.trend = new Chart(document.getElementById('chartTrend'), {
    type:'bar',
    data:{ labels:trendLabels, datasets:[{ label:'业绩 (RMB)', data:trendValues, backgroundColor:'#166534cc', borderColor:'#166534', borderWidth:1, borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>'RMB '+ctx.parsed.y.toLocaleString('zh-CN') } } },
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>(v/1000)+'k' } } }
    }
  });

  // ── 本月渠道分布 + 客户榜（基于本月数据）──
  const monthRows = rows.filter(r=>r.date.ym===curYM);
  const channelTotals = { ec:0, ot:0 };
  const customerMap = {}; // name -> {revenue, orders, channel}
  monthRows.forEach(r=>{
    const ch = classifyChannel(r.name);
    channelTotals[ch] += r.revenue;
    if(!customerMap[r.name]) customerMap[r.name] = { revenue:0, orders:0, channel:ch };
    customerMap[r.name].revenue += r.revenue;
    customerMap[r.name].orders += 1;
  });

  if(charts.channel) charts.channel.destroy();
  charts.channel = new Chart(document.getElementById('chartChannel'), {
    type:'doughnut',
    data:{ labels:[channelLabel.ec, channelLabel.ot],
      datasets:[{ data:[channelTotals.ec, channelTotals.ot], backgroundColor:[channelColor.ec, channelColor.ot], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:ctx=>`${ctx.label}: RMB ${ctx.parsed.toLocaleString('zh-CN')}` } } } }
  });
  const channelTotalSum = channelTotals.ec + channelTotals.ot || 1;
  document.getElementById('channel-legend').innerHTML = ['ec','ot'].map(k=>`
    <div class="legend-row">
      <span><span class="legend-dot" style="background:${channelColor[k]}"></span>${channelLabel[k]}</span>
      <span style="font-weight:700">${fmtRMB(channelTotals[k])} <span style="color:#9ca3af;font-weight:400">(${(channelTotals[k]/channelTotalSum*100).toFixed(1)}%)</span></span>
    </div>`).join('');

  // ── TOP 15 客户/达人 ──
  const sortedCustomers = Object.entries(customerMap).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,15);
  const grandTotal = monthRows.reduce((s,r)=>s+r.revenue,0) || 1;
  const tbody = document.getElementById('top-customers');
  if(!sortedCustomers.length){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#9ca3af;padding:24px">${selY}年${selM}月暂无数据</td></tr>`;
  } else {
    tbody.innerHTML = sortedCustomers.map(([name,d],i)=>{
      const pillClass = d.channel==='ec'?'ec':'ot';
      return `<tr>
        <td class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
        <td><strong>${escHtml(name)}</strong></td>
        <td><span class="pill ${pillClass}">${channelLabel[d.channel]}</span></td>
        <td class="num">${d.orders}</td>
        <td class="num">${fmtRMB(d.revenue)}</td>
        <td class="num">${(d.revenue/grandTotal*100).toFixed(1)}%</td>
      </tr>`;
    }).join('');
  }

  // ── 产品销量（本月）──
  const productTotals = PRODUCT_COLS.map(p=>monthRows.reduce((s,r)=>s+(r.products[p]||0),0));
  if(charts.products) charts.products.destroy();
  charts.products = new Chart(document.getElementById('chartProducts'), {
    type:'bar',
    data:{ labels:PRODUCT_COLS, datasets:[{ label:'销量', data:productTotals, backgroundColor:['#166534cc','#16a34acc','#d97706cc','#2563ebcc','#be185dcc'], borderWidth:0, borderRadius:6 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>ctx.parsed.x.toLocaleString('zh-CN')+' 件' } } },
      scales:{ x:{ beginAtZero:true } } }
  });
}

loadAll();
</script>

</body>
</html>
